# Competitor landscape (stream: competitors). Startup lens — NOT neutral product education (that is /systems/vendors).
#
# verify:
#   snippet    = key ownership/funding fact checked against a search-result snippet from the named publisher (see sources)
#   background = author's background knowledge (to mid-2026), NOT re-verified in the authoring session. Treat as a lead.
#   watchlist  = named in the research brief; product, funding and customers NOT verified. Do not repeat as fact.
# gaps[].basis:
#   scope      = follows from the vendor's own documented scope or target market (e.g. "not a TMS: no deal capture")
#   question   = an open question to test in interviews; NOT a claim that the gap exists
# types: sor (system of record) | workflow | analytics | execution
# sizes: startup | sme | midmarket | multinational

asOf: "2026-09-30"

types:
  - id: sor
    label: System of record
    short: Record
    blurb: Holds the authoritative data for something treasury is accountable for — deals, bank accounts, positions, postings. Hard to replace; audited; slow to change.
  - id: workflow
    label: Workflow tool
    short: Workflow
    blurb: Moves a task through people and controls — prepare, approve, release, reconcile. Its value is fewer hand-offs and cleaner controls, not new data.
  - id: analytics
    label: Analytics
    short: Analytics
    blurb: Reads data from other systems to produce a view or prediction (position, forecast, variance). Easier to adopt; easier to rip out.
  - id: execution
    label: Execution system
    short: Execution
    blurb: Where money or risk actually moves — a trade is dealt, a payment is released, a deposit is placed. Tight bank/counterparty integration; high consequence of error.

categories:
  - id: status-quo
    label: The status quo (Excel, bank portals, ERP)
    short: Status quo
    types: [workflow, execution]
    workflows: [daily-cash-positioning, cash-forecasting, payment-processing, bank-reconciliation, fx-hedging]
    page: /competitors/landscape
    summary: "The real incumbent for most companies below multinational size: spreadsheets, each bank's e-banking portal, and the ERP's payment run. Free at the margin, flexible, and already trusted."
  - id: traditional-tms
    label: Established TMS suites
    short: Established TMS
    types: [sor, workflow]
    workflows: [daily-cash-positioning, cash-forecasting, payment-processing, fx-exposure-management, fx-hedging, surplus-cash-investment, funding-subsidiary, credit-facility-management, month-end-reporting, bank-account-management, policy-compliance]
    page: /competitors/tms
    summary: "Full treasury suites: deal capture and valuation, cash positioning, in-house bank, payments, hedge accounting, ERP postings. Sold to large and upper-mid-market groups via RFP, implemented over months."
  - id: modern-tms
    label: Modern / API-first treasury platforms
    short: Modern TMS
    types: [analytics, workflow]
    workflows: [daily-cash-positioning, cash-forecasting, payment-processing, bank-reconciliation, liquidity-planning]
    page: /competitors/tms
    summary: "Newer cloud platforms (mostly founded after 2015) that start from bank connectivity and cash visibility, add payments and forecasting, and sell to scale-ups and mid-market companies without a treasury department."
  - id: cash-forecasting
    label: Cash forecasting & cash analytics
    short: Forecasting
    types: [analytics]
    workflows: [cash-forecasting, liquidity-planning, liquidity-crisis]
    page: /competitors/cash-forecasting
    summary: "Tools whose centre of gravity is the cash forecast: categorise bank transactions, pull ERP open items, build scenarios, measure forecast vs actual."
  - id: bank-connectivity
    label: Bank connectivity
    short: Connectivity
    types: [execution, workflow]
    workflows: [daily-cash-positioning, payment-processing, bank-reconciliation, bank-account-management, bank-fee-analysis]
    page: /competitors/connectivity-payments
    summary: "The plumbing: Swift service bureaus, EBICS/host-to-host and API aggregation, bank-format maintenance. Often bundled inside TMS or payment hubs rather than bought alone."
  - id: payments
    label: Payment hubs & payment security
    short: Payments
    types: [execution, workflow]
    workflows: [payment-processing, large-payment-approval, fraud-investigation, bank-reconciliation]
    page: /competitors/connectivity-payments
    summary: "Centralise payment files from several ERPs, apply approval workflows, sanctions and fraud checks, and route to banks. Payment factories in large groups run on these."
  - id: fx-hedging
    label: FX trading, hedging & hedge accounting
    short: FX / hedging
    types: [execution, analytics]
    workflows: [fx-exposure-management, fx-hedging, currency-shock]
    page: /competitors/fx-hedging
    summary: "Multi-dealer trading venues, hedging-automation software, advisory-plus-software firms and hedge-accounting tools. Execution venues are mature; the exposure-capture step upstream is where tools differ most."
  - id: investments
    label: Cash investment portals
    short: Investments
    types: [execution]
    workflows: [surplus-cash-investment]
    page: /competitors/fx-hedging
    summary: "Portals that let a treasurer place surplus cash in money-market funds or fixed-term deposits across providers, with counterparty-limit reporting."
  - id: working-capital
    label: Working capital (AR, AP, supply-chain finance)
    short: Working capital
    types: [workflow, execution]
    workflows: [cash-forecasting, liquidity-planning]
    page: /competitors/working-capital
    summary: "Collections/AR automation, supplier early-payment and supply-chain-finance programmes. Mostly owned by AR, AP and procurement — treasury is a stakeholder, often the funder."
  - id: treasury-ai
    label: Treasury intelligence & AI features
    short: AI / intelligence
    types: [analytics]
    workflows: [cash-forecasting, daily-cash-positioning, month-end-reporting, bank-fee-analysis]
    page: /competitors/ai-and-agents
    summary: "ML forecasting, anomaly detection and natural-language assistants — so far mostly shipped as features inside the vendors above, not as separate products."
  - id: treasury-agents
    label: Treasury agents (AI-native startups)
    short: Agents
    types: [workflow, analytics]
    workflows: [daily-cash-positioning, cash-forecasting, bank-reconciliation]
    page: /competitors/ai-and-agents
    summary: "Startups claiming that software performs treasury tasks end-to-end rather than assisting a human. In this session none could be verified; see the page for what that means."

vendors:
  # ---------------- Status quo ----------------
  - id: status-quo
    name: Excel + bank portals + ERP payment run
    short: Excel + portals
    category: status-quo
    types: [workflow, execution]
    verify: background
    sizes: [startup, sme, midmarket, multinational]
    region: Everywhere
    hq: n/a
    ownership: n/a — Microsoft Excel; each bank's e-banking (in Switzerland e.g. UBS, ZKB, PostFinance portals); ERP (SAP, Oracle, Microsoft Dynamics, Abacus, Bexio)
    sells: "Nothing treasury-specific. The treasurer logs into each bank portal, downloads balances or statements, pastes them into a workbook, and releases payments that the ERP generated as a [pain.001](term:pain-001) file."
    workflow: "Every workflow at small scale; at larger scale the forecast, hedge calculations and ad-hoc analysis still often live in Excel next to a TMS."
    positioning: "Not positioned — it is the default. Every vendor below is really selling against this."
    strengths:
      - "Zero incremental cost and zero implementation."
      - "Total flexibility: the model matches the company's quirks exactly, and the person who built it trusts it."
      - "Bank portals are the bank's own execution channel, with the bank's security and signatory rules."
    gaps:
      - basis: scope
        text: "No multi-bank consolidation, audit trail or version control by design; the workbook is only as reliable as the last person who touched it."
      - basis: question
        text: "Ask how many hours per week go into downloading and pasting, and what went wrong the last time the spreadsheet had an error. The answer tells you whether the pain is real or theoretical."
    notes: "Survey evidence that forecasting remains largely spreadsheet-based at many companies[](cite:deloitte-gts-2024). For a founder, the honest competitor for a 70–500-person company is often this row, not Kyriba — test that in interviews."
    sources: [deloitte-gts-2024]

