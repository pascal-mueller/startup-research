# Day-in-the-Life data. Owner: "day" stream. Rendered by src/components/DayViews.tsx.
# All six personas live through the SAME week: Monday 26 and Tuesday 27 October 2026.
# This is NOT the shared scenario Tuesday of the Start page / daily-cash-positioning (Tue 17 Nov 2026):
# different week, different numbers. Pages must never claim "the same Tuesday" (canonical facts v2.1).
# (EU clocks went back on Sunday 25 October; US clocks change on 1 November, so this week New York is
# only 5 hours behind Basel/Zurich instead of 6.) Swiss payroll for October was paid on Friday 23 October
# (the 25th is a Sunday); HM Deutschland and Alpine's German GmbH pay German salaries for value on the
# last business day — the subsidiaries' own convention — Friday 30 October.
# Each timeline entry: time, title, kind, systems[], call (the decision in a few words), why, input,
# decision, who, next, optional wf[] (workflow ids). Markdown with the usual link syntax is allowed.
# Timelines are illustrative synthesis, consistent with content/companies.yaml and the gold-standard workflows.

personas:
  # ---------------------------------------------------------------- SARAH
  - id: sarah
    name: Sarah
    title: CFO
    company: kleio
    page: /day/sarah
    rolePage: /org/roles-cfo
    tier: startup
    oneLiner: CFO of a 70-person SaaS company. Treasury is roughly half a day a week of her job, squeezed between fundraising, the board, pricing, HR and the audit.
    reportsTo: CEO; presents to the board quarterly
    team: Nina (accountant, prepares payments and bookkeeping); external fiduciary (payroll, VAT, statutory accounts); a US payroll provider
    treasuryShare: "~10% of her time"
    firstCheck: "Monday only: three e-banking portals, then the runway line in the Google Sheet"
    systems: ["E-banking portals (2 Swiss banks + 1 US bank)", "Google Sheet (cash + runway)", "Stripe dashboard", "Bexio-class cloud accounting", "bank mobile signing apps"]
    decides: How much runway is left and when to raise; which bank holds how much; whether to take venture debt; approves every payment above CHF 50k with the CEO.
    talksTo: [CEO, Nina (accountant), external fiduciary, the board, bank relationship managers, the venture-debt lender, customers' procurement teams]
    awake:
      - "**Runway, not rates.** CHF 22m of cash at CHF 0.9m net burn is roughly two years — but the January and July annual prepayments make the balance look better than the underlying burn for half of every year. If the next round slips six months, the conversation with the board changes."
      - "**A bank failure or a frozen account.** After the 2023 SVB collapse the board asked her to split cash across banks. Her worry is not interest income but *access*: could Kleio still pay salaries on the 25th if one bank stopped working for a week?"
      - "**A fraudulent payment.** With two people in finance, [segregation of duties](term:segregation-of-duties) is thin. CEO-fraud reports to Switzerland's Federal Office for Cybersecurity (BACS) rose from 719 in 2024 to 971 in 2025[](cite:bacs-ceo-fraud-2026); a single CHF 200k loss is [about a month of US payroll](why:day-us-payroll-topup)."
      - "**USD drift.** About 40% of revenue is in USD; USD costs (cloud, US payroll) offset part of it. She has no hedges and no policy — she converts surplus USD a few times a year and hopes the board does not ask why."
    rhythm:
      - { when: "Wednesday–Friday", what: "Board-pack drafting for the November board meeting; runway scenarios for the venture-debt discussion; interviews for a second accountant." }
      - { when: "Friday 30 Oct", what: "US payroll pay date (semi-monthly). Kleio Inc.'s account was checked and funded on Monday." }
      - { when: "Month-end + 5–8 days", what: "Nina closes the books with the fiduciary; Sarah reviews the P&L, cash-flow and the burn against budget; updates the runway sheet." }
      - { when: "25th of each month", what: "Swiss salaries, paid by the fiduciary's payroll run from bank A; Sarah checks bank A's CHF balance a week before." }
      - { when: "Quarterly", what: "Board meeting (cash, runway, hiring plan); Swiss VAT return via the fiduciary (due 30 days after quarter-end, 60 days for Q3); social-security instalments." }
      - { when: "January and July", what: "Enterprise customers' annual prepayments arrive (the two big inflows of the year); Sarah re-splits the surplus across banks and term deposits." }
    unusual:
      title: The 'Sarah' email that wasn't from Sarah
      body: |
        On a Thursday afternoon Nina receives an email that appears to come from Sarah's address: an urgent CHF 48,000 payment to a "new legal adviser" that must go out today "before the Series C term sheet is signed — keep this confidential". The display name is right; the reply-to domain differs by one letter.

        Nina does what they agreed after a fiduciary client of theirs lost money the previous year: she calls Sarah's mobile from the phone's contacts, not from the email ([call-back verification](term:call-back-verification)). Sarah is in a customer meeting and knows nothing about it.

        What Sarah then does, in order: forwards the email headers to the external IT provider and asks them to check whether any mailbox was compromised (it wasn't — a look-alike domain); tells the CEO, because a *real* Series C is not public and the email implies someone knows about fundraising; reports it to BACS, the Swiss Federal Office for Cybersecurity; and changes one rule — any payment to a beneficiary not paid before now needs her approval **and** a call-back, regardless of amount. Nothing was lost; the cost was an afternoon. See [fraud investigation](wf:fraud-investigation) and [business email compromise](term:bec).
    days:
      - id: monday
        label: Monday 26 October
        intro: Sarah's Monday is mostly not treasury. The treasury part is the first 45 minutes and one hour after lunch.
        entries:
          - time: "07:30"
            title: Weekly balance check in three portals
            kind: check
            systems: [E-banking bank A, E-banking bank B, US bank portal]
            call: Nothing to move; note USD balance at Kleio Inc.
            why: Kleio has no daily [cash position](term:cash-position). Monday is when Sarah confirms the week can be paid and that nothing strange left the accounts over the last seven days.
            input: "Closing balances of the 7 accounts: the CHF operating account, one CHF 4m term deposit, the EUR and the USD account at bank A; the CHF operating account and one CHF 4m term deposit at bank B; USD at the US bank for Kleio Inc. Last week's balances in the Google Sheet."
            decision: Whether any account needs topping up this week. Today the only question is Kleio Inc.'s USD account ahead of Friday's US payroll.
            who: Nobody — she does this alone before the leadership meeting.
            next: She types the balances into the sheet and moves on to the burn check.
            wf: [daily-cash-positioning]
          - time: "07:50"
            title: Update the Google Sheet and read the runway line
            kind: analysis
            systems: [Google Sheet]
            call: "Runway still ~24 months; no action"
            why: The number the CEO and board actually care about is [runway](term:cash-runway), not the balance.
            input: "Balances just typed in; last month's net [burn](term:burn-rate) of CHF ~0.9m; the list of expected receipts from the invoicing tool."
            decision: Whether the week's movement is consistent with the burn. Cash fell CHF 0.3m over the week, net of receipts — Friday's Swiss payroll of about CHF 0.8m was partly covered by card and invoice receipts — as expected.
            who: None; the sheet is hers. Nina can view it.
            next: If the trend were off by more than about CHF 0.2m she would ask Nina to check for an unusual payment. Not today.
            wf: [cash-forecasting]
          - time: "08:05"
            title: Check Kleio Inc. can fund Friday's US payroll
            kind: execution
            systems: [US bank portal, E-banking bank A, bank A signing app]
            call: Send USD 150k from the Swiss USD account
            why: The US payroll provider debits Kleio Inc.'s account a couple of days before each pay date. If the money isn't there, 8 US employees are paid late — a far bigger problem than any interest cost.
            input: "Kleio Inc. balance USD 95k; next payroll ≈ USD 118k gross-to-net plus employer taxes; a USD 40k US conference invoice due next week."
            decision: Top up by [USD 150k](why:day-us-payroll-topup) from Kleio AG's USD account at bank A (funded by US customer receipts), rather than converting CHF. Leaves a small buffer.
            who: Nina enters the transfer in bank A's e-banking; Sarah approves it in the bank's signing app ([collective signature](term:collective-signature) of two).
            next: Wire leaves today; Sarah checks Tuesday that it arrived. Nina books it as an intercompany receivable of Kleio AG.
            wf: [funding-subsidiary]
          - time: "09:00"
            title: Leadership meeting — hiring plan
            kind: meeting
            systems: ["Hiring plan (Google Sheet)"]
            call: Approve 2 of 4 requested hires
            why: Every hire is about CHF 150–180k a year fully loaded in Zurich; four hires add CHF 0.05–0.06m to the monthly burn and cost roughly six weeks of runway.
            input: The CTO's and CRO's hiring requests; Sarah's runway sheet.
            decision: She supports two hires now, two after the Q4 renewals are signed. Treasury here is a people decision.
            who: CEO, CTO, CRO, Head of People.
            next: She updates the headcount line in the runway model on Wednesday.
          - time: "10:30"
            title: Customer call about a 45-day overdue invoice
            kind: comms
            systems: [Invoicing tool, Customer procurement portal]
            call: Re-submit through the customer's supplier portal
            why: An insurer's CHF 180k annual renewal is 45 days overdue. It is not a credit problem — Kleio's invoice is stuck because it was emailed rather than uploaded to the insurer's procurement portal.
            input: The invoice, the insurer's purchase-order number, the portal onboarding email Nina never received.
            decision: Accept the insurer's process; Nina registers Kleio in the portal and re-submits. Sarah moves the expected receipt four weeks later in the sheet.
            who: The insurer's accounts-payable team and the Kleio account executive.
            next: Receipt now expected late November. See [accounts receivable](/org/with-ar).
          - time: "13:30"
            title: Venture-debt term sheet — runway effect
            kind: analysis
            systems: ["Google Sheet", "Term sheet (PDF)"]
            call: Take it to the board as optional insurance, not as runway
            why: A lender offers CHF 5m of [venture debt](term:venture-debt), drawable for 12 months, with warrants and a minimum-cash covenant. The board meets in November.
            input: Term sheet (interest, fees, warrants, minimum cash of CHF 5m, material-adverse-change clause); runway model; the Series C timing the CEO expects.
            decision: She models three cases (not drawn, drawn and repaid, drawn with a delayed Series C). The minimum-cash [covenant](term:covenant) effectively locks up CHF 5m, so the 'extra runway' is smaller than it looks. She will present it as a backstop.
            who: Later this week the CEO; a call with the lead investor's partner.
            next: Draft board memo Wednesday. See [credit facility management](wf:credit-facility-management).
          - time: "15:00"
            title: Term-deposit maturity next Monday
            kind: decision
            systems: [E-banking bank B, Google Sheet]
            call: Roll CHF 4m for 3 months at bank B
            why: One of the two CHF 4m three-month [term deposits](term:term-deposit) — the one at bank B — matures on 2 November. With the SNB policy rate at 0%, CHF deposits earn close to nothing; the reason to roll is to keep the [board-mandated split between banks](why:day-kleio-cash-policy) and keep the money outside the operating account.
            input: Bank B's quoted rate (near zero); the runway sheet showing no need for the cash before January.
            decision: Roll for three months. She considered a CHF money-market fund and decided it adds paperwork (new account, custody) for no meaningful gain at 0% rates — the USD surplus sits in a USD government money-market fund, where the yield makes the wrapper worth having.
            who: Bank B's relationship manager by email; the rollover needs a signed instruction.
            next: Instruction signed in bank B's portal on Wednesday. See [surplus cash investment](wf:surplus-cash-investment).
      - id: tuesday
        label: Tuesday 27 October
        intro: Tuesday is Kleio's payment day. Nina prepares, Sarah approves.
        entries:
          - time: "08:15"
            title: Confirm the USD transfer arrived
            kind: check
            systems: [US bank portal]
            call: Arrived; payroll covered
            why: A wire that left Monday should be credited in the US the same day or next morning. If not, Friday payroll is at risk and there are still two days to fix it.
            input: Kleio Inc. balance and incoming wire detail.
            decision: None needed — USD 150k credited Monday afternoon New York time.
            who: None.
            next: Closes the item in her task list.
          - time: "09:00"
            title: Approve the weekly supplier payments
            kind: approval
            systems: [E-banking bank A, bank A signing app, Cloud accounting]
            call: Approve 31 of 32; hold one
            why: Every outgoing payment needs two signatures (collective signature). Nina enters them; Sarah or the CEO is the second signatory, and both sign above CHF 50k.
            input: "Nina's payment list: 32 supplier invoices, CHF 214k in total, each with the invoice attached in the accounting tool."
            decision: She opens every payment above CHF 10k and every first-time beneficiary. One is a new freelance designer whose IBAN is at a foreign neobank; she holds it until Nina has confirmed the account by phone with the designer.
            who: Nina.
            next: The released payments go out today via [SIC](term:sic); the held one tomorrow after the call-back. See [payment processing](wf:payment-processing).
            wf: [payment-processing, large-payment-approval]
          - time: "10:00"
            title: Board pack — the cash page
            kind: analysis
            systems: [Google Sheet, Slides]
            call: Show runway with and without the January prepayments
            why: Board members compare runway quarter to quarter. The seasonal prepayments distort it, and she wants no surprises in January.
            input: Runway sheet; ARR and billing schedule from the CRO; the venture-debt option.
            decision: Present runway as a range — [about 21–24 months](why:day-runway-range) depending on renewals — rather than one number.
            who: CEO reviews the draft Thursday.
            next: Board meeting 12 November.
          - time: "11:30"
            title: Fiduciary call — Q3 VAT and October payroll
            kind: comms
            systems: [Phone, Cloud accounting]
            call: Confirm VAT payable and payment date
            why: The Swiss Q3 VAT return is due by 30 November. The fiduciary prepares it; Sarah needs the amount to plan bank A's CHF balance, and must sign the return.
            input: Fiduciary's draft return; the October payroll journal (bonus accrual for the US sales team).
            decision: Pay VAT in the week of 23 November from bank A. No cash transfer needed now.
            who: External fiduciary.
            next: Amount added to the Google Sheet's November line.
          - time: "14:00"
            title: FX — convert surplus USD?
            kind: decision
            systems: ["E-banking bank A (FX)", "Google Sheet"]
            call: Leave USD as is until December
            why: USD receipts from US customers accumulate at bank A; USD costs (cloud, US payroll) consume most of them — a [natural hedge](term:natural-hedge). The surplus is USD ~0.6m, sitting in a USD government money-market fund.
            input: USD balance; next three months of USD costs; USD/CHF around 0.80 (illustrative).
            decision: The surplus is under three months of USD costs; converting and later buying back would cost two spreads. The money-market fund already earns SOFR-level yield on it, so there is nothing to fix. She does not hedge and has no forecast precise enough to hedge against.
            who: None. She would ask the bank's FX desk for a quote if converting.
            next: Revisits in December. See [FX exposure management](wf:fx-exposure-management).
            wf: [fx-exposure-management]
          - time: "16:30"
            title: Release the held payment
            kind: approval
            systems: [bank A signing app]
            call: Release after call-back
            why: Nina reached the designer on the phone number in the signed contract; the IBAN matches.
            input: Nina's note of the call (who, when, which number).
            decision: Approve.
            who: Nina.
            next: Payment executes tomorrow morning; the call note is attached to the invoice in the accounting tool.

  # ---------------------------------------------------------------- PETRA
  - id: petra
    name: Petra
    title: Head of Accounting
    company: alpine
    page: /day/petra
    rolePage: /org/with-accounting
    tier: sme
    oneLiner: Runs a seven-person finance team at a CHF 80m robotics maker. Month-end close, audit and VAT are her job; cash, payments and bank reconciliations are done by her because nobody else is there to do them.
    reportsTo: Martin (CFO)
    team: 2 AP/AR accountants, 1 general-ledger accountant, 1 payroll/HR accountant, 1 controller, 1 apprentice; local bookkeepers at the German GmbH and US Inc.
    treasuryShare: "~20–30% of her time"
    firstCheck: "08:00 daily: balances in the two Swiss banks' portals, then yesterday's rejected payments"
    systems: [Microsoft Dynamics 365 Business Central, Cantonal bank e-banking, Large Swiss bank e-banking + FX portal, EBICS file upload, bank signing app, Excel cash sheet]
    decides: Which payments go in which run, which account pays; prepares every cash decision for Martin; approves payments up to CHF 250k with one other signatory.
    talksTo: [Martin (CFO), AP and AR accountants, project managers, German and US bookkeepers, the two banks' relationship managers and FX desk, the auditor]
    awake:
      - "**A milestone that slips.** One delayed acceptance certificate moves CHF 1–2m. The cash sheet depends on project managers telling her the truth about acceptance dates, and they are optimists."
      - "**Payroll on the 25th while the credit line is half-drawn.** The CHF 12m line is committed, but she does not want to be the person who tells Martin on the 23rd that it must be drawn today."
      - "**A payment she signed that went to a fraudster.** She knows the vendor-master change process is the weak point: an AP accountant can change a bank account, and she is the only real check."
      - "**Close, audit and cash all at once.** In the first week of each month the close competes with the payment runs. When something breaks, it is the treasury work that gets done late."
    rhythm:
      - { when: "Wednesday", what: "Bank reconciliations for the Swiss accounts (camt.053 import into Business Central, matching open items); intercompany reconciliation with the German bookkeeper." }
      - { when: "Friday 30 Oct", what: "Second payment run of the week; German payroll pays out (funded Tuesday); month-end cut-off in Business Central." }
      - { when: "Working days 1–6 of November", what: "October close: accruals, project revenue recognition with the controller, intercompany, bank reconciliations of all 9 accounts; results to Martin on WD6." }
      - { when: "Monthly", what: "FX: converts EUR surplus above ~EUR 1m at spot; hedges each newly signed EUR/USD project above EUR 1m with forwards (the rule from the board minute)." }
      - { when: "Quarterly / annual", what: "Swiss VAT return; covenant certificate for the cantonal bank (annual, with audited accounts); audit fieldwork in February; bank KYC renewals." }
    unusual:
      title: The US account that stopped paying
      body: |
        In February, the US bank restricts Alpine Robotics Inc.'s account: the bank's periodic [KYC](term:kyc) review found the beneficial-ownership certification out of date, and three emails to the US bookkeeper's old address went unanswered. Outgoing wires and ACH are blocked; incoming payments still arrive. US payroll is due in six days.

        Petra's sequence: she calls the bank's service line (not the relationship manager, who is on holiday) and learns which forms are missing; gets Martin and the US managing director to sign the certification that afternoon (the US MD signs electronically); sends it through the bank's secure portal; and — because the bank cannot promise a date — prepares a fallback in which Alpine Robotics AG pays the US payroll provider directly from its USD account, documented as an [intercompany loan](term:intercompany-loan) that the US entity repays. The account is unblocked after four days and the fallback is not needed. Her follow-up: a list of every bank's KYC contact and renewal date in the cash workbook. See [bank account management](wf:bank-account-management).
    days:
      - id: monday
        label: Monday 26 October
        intro: Monday is cash-sheet day. By 09:30 Martin wants to know which milestones slipped.
        entries:
          - time: "07:45"
            title: Balances in both portals
            kind: check
            systems: [Cantonal bank e-banking, Large Swiss bank e-banking]
            call: Nothing unusual; EUR account at EUR 2.1m
            why: Alpine's cash swings with milestone payments. Petra checks every morning that nothing unexpected left the accounts and that incoming customer payments arrived.
            input: "Balances and weekend credits of 9 accounts: the CHF operating account, one CHF deposit account, the EUR and the USD account at the cantonal bank (house bank); the CHF, EUR and USD accounts at the large Swiss bank; the German GmbH's EUR account and the US Inc.'s USD account, which she sees through the large bank's multibank view."
            decision: Whether anything needs explaining. A EUR 380k milestone from a Dutch customer arrived Friday; she notes EUR at the large bank is now EUR 2.1m.
            who: None.
            next: Balances go into the cash sheet.
            wf: [daily-cash-positioning]
          - time: "08:10"
            title: Refresh the weekly cash sheet
            kind: analysis
            systems: ["Excel cash sheet", "Business Central (AR/AP ageing export)"]
            call: Week-4 low point CHF 3.1m
            why: The sheet is Alpine's only forecast — 13 weeks by week, CHF-equivalent, with projects listed line by line.
            input: Bank balances (group CHF 7.4m equivalent); AR open items and AP due dates exported from Business Central; payroll (Swiss CHF 2.1m on the 25th); VAT; the project milestone list with expected acceptance dates.
            decision: She adjusts receipts she does not believe (a German customer that always pays 3 weeks late). Result — low point CHF 3.1m in week 4, with CHF 3m of the CHF 12m credit line drawn.
            who: None yet; she needs the project managers.
            next: Emails two project managers to confirm acceptance dates before 09:30. See [cash forecasting](wf:cash-forecasting).
            wf: [cash-forecasting]
          - time: "09:30"
            title: Monday cash meeting with Martin
            kind: meeting
            systems: [Excel cash sheet]
            call: Don't draw more now; prepare a CHF 2m drawing for 6 Nov
            why: "The Duisburg project's acceptance test found a software fault, and one unsigned acceptance certificate moves a chain of receipts: the final 20% (about EUR 0.7m of the EUR 3.5m contract) plus the 10% retention, and the customer has said the follow-on order's deposit waits for acceptance — about EUR 1.8m of the month's receipts with one signature."
            input: The cash sheet with and without the Duisburg chain; the credit line (CHF 12m committed, CHF 3m drawn).
            decision: "Martin decides: no drawing today; Petra prepares a CHF 2m drawing request for 6 November — the whole Duisburg chain (about CHF 1.7m) plus a margin, in case acceptance slips into December. Martin also asks sales to invoice the Swiss customer's delivery milestone this week instead of next."
            who: Martin (CFO). Martin informs the CEO.
            next: Petra diarises the drawing decision for 3 November. See [liquidity planning](wf:liquidity-planning) and [credit facility management](wf:credit-facility-management).
          - time: "10:15"
            title: October close planning
            kind: meeting
            systems: ["Close checklist (Excel)", "Business Central"]
            call: Assign close tasks; move bank recs to Wednesday
            why: Her main job. The October close must reach Martin by working day 6.
            input: Close checklist; the auditor's interim-audit request list for November.
            decision: Who does which reconciliation; she keeps bank reconciliations herself because they touch the cash sheet.
            who: The whole finance team.
            next: Close starts Friday. See [month-end close](term:month-end-close).
          - time: "13:30"
            title: Build Tuesday's payment proposal
            kind: analysis
            systems: ["Business Central (payment journal)"]
            call: Pay 72 invoices, defer 6 non-critical ones to Friday
            why: Alpine pays suppliers on Tuesdays and Fridays. With the Duisburg delay she wants to keep cash for the end-of-month run.
            input: Invoices due by Friday (CHF 1.34m); supplier terms; which suppliers are critical to production.
            decision: Pay all component suppliers and anything with a skonto (early-payment discount); push six service invoices to Friday within terms.
            who: The AP accountant prepares the journal; Petra reviews.
            next: Journal ready for export as a [pain.001](term:pain-001) file on Tuesday morning. See [payment processing](wf:payment-processing).
          - time: "15:00"
            title: German GmbH asks for payroll money
            kind: comms
            systems: [Email, Excel cash sheet]
            call: Fund EUR 300k on Tuesday
            why: The German bookkeeper needs EUR 300k on the GmbH account by Thursday for payroll paid for value 30 October, plus social charges.
            input: GmbH balance EUR 95k; the GmbH's receipts are low this month.
            decision: Transfer EUR 300k from Alpine AG's EUR account at the large bank on Tuesday as an intercompany loan. At about CHF 280k it is above her CHF 250k payment mandate, and intercompany transfers always carry Martin as signatory regardless of amount — so he signs.
            who: German bookkeeper; Martin.
            next: Tuesday 11:00 execution.
            wf: [funding-subsidiary]
          - time: "16:00"
            title: EUR surplus — convert?
            kind: decision
            systems: [Large Swiss bank FX portal]
            call: Convert EUR 1.0m to CHF at spot
            why: Alpine's costs are mostly CHF; the EUR account is above the ~EUR 1m level at which Martin wants surplus converted. No hedging policy beyond a board minute.
            input: EUR balance EUR 2.1m; EUR payments due in the next 4 weeks (EUR 0.9m); EUR/CHF around 0.935 (illustrative).
            decision: Proposes converting EUR 1.0m; Martin agrees by chat. She books the [spot](term:spot-fx) trade in the bank's FX portal, value T+2.
            who: Martin; the bank's FX portal (no dealer call).
            next: Trade confirmation arrives by email; she files it in the 'FX deals' tab of the cash sheet and tells the GL accountant to book it.
            wf: [fx-exposure-management]
      - id: tuesday
        label: Tuesday 27 October
        intro: Payment day. Everything must be signed before the banks' same-day cut-offs, and nothing can go out that she has not looked at.
        entries:
          - time: "07:50"
            title: Balances and yesterday's status reports
            kind: check
            systems: [Both e-banking portals]
            call: All clear
            why: Before sending new payments she confirms that Friday's run was fully executed — rejected payments show up in the [payment status report](term:payment-status).
            input: Balances; pain.002 status from Friday's upload.
            decision: None needed.
            who: None.
            next: Moves to the payment file.
          - time: "08:20"
            title: Export and upload the payment file
            kind: execution
            systems: [Business Central, EBICS client, Cantonal bank signing app]
            call: 72 payments, CHF 1.28m equivalent, uploaded for same-day value
            why: The house bank executes CHF and EUR supplier payments from a pain.001 file uploaded over [EBICS](term:ebics) and then signed electronically.
            input: The approved payment journal.
            decision: Last check of the total against the proposal and of three payments over CHF 100k.
            who: The AP accountant exports; Petra and the controller sign (two signatures up to CHF 250k).
            next: One payment of CHF 310k to a component supplier exceeds CHF 250k, so Martin must be one of the signatories — she messages him.
            wf: [payment-processing]
          - time: "09:05"
            title: A supplier 'changes bank details'
            kind: exception
            systems: [Email, Business Central vendor master, Phone]
            call: Reject the change; flag to Martin
            why: The AP accountant received a PDF letter from a German component supplier announcing a new bank account 'due to a bank merger', asking for Friday's payment to go there.
            input: The email (sent from a look-alike domain), the supplier's phone number in [vendor master data](term:vendor-master-data).
            decision: Petra calls the supplier's accounts-receivable contact on the number in Business Central. No change of bank. She blocks the change and tells the AP team to ignore the thread. See [call-back verification](term:call-back-verification).
            who: AP accountant; the supplier; Martin informed.
            next: She adds the look-alike domain to the email filter request to IT. See [fraud investigation](wf:fraud-investigation).
          - time: "10:10"
            title: One payment rejected
            kind: exception
            systems: ["EBICS client (pain.002)"]
            call: Correct and resend before cut-off
            why: The bank's status report shows 71 accepted and one rejected (account closed at beneficiary bank).
            input: The rejected payment's reason code and the supplier's last invoice.
            decision: She will not use the IBAN from the most recent email; the AP accountant calls the supplier on the known number, gets the new IBAN, and a second person changes the vendor master.
            who: AP accountant; supplier.
            next: Resent as a single payment at 11:30 — well before the house bank's 14:00 same-day CHF cut-off, which is why the call-back could be done properly instead of rushed.
          - time: "11:00"
            title: Fund the German GmbH
            kind: execution
            systems: [Large Swiss bank e-banking, bank signing app]
            call: EUR 300k sent as intercompany loan
            why: German payroll must be covered by Thursday.
            input: The German bookkeeper's request; AG's EUR balance after the conversion.
            decision: Send today rather than Wednesday, so a failure can still be fixed. Martin signs — intercompany transfers always carry him, whatever the amount.
            who: Petra enters; Martin signs.
            next: The GL accountant books the intercompany loan; the GmbH bookkeeper confirms receipt Wednesday.
            wf: [funding-subsidiary]
          - time: "13:30"
            title: Close preparation and audit request list
            kind: admin
            systems: [Business Central, Excel]
            call: None — accounting work
            why: The rest of the afternoon is her actual job.
            input: Auditor's interim request list.
            decision: Which schedules she prepares herself.
            who: Controller.
            next: Continues Wednesday.
          - time: "15:30"
            title: New project signed — hedge the EUR milestones?
            kind: decision
            systems: [Contract summary, Large Swiss bank FX portal]
            call: Martin approves EUR 1.2m forward for March 2027
            why: Sales signed a EUR 3.0m project with a 40% milestone expected in March 2027. The board minute says to hedge confirmed EUR/USD project receipts above EUR 1m.
            input: Contract milestone schedule; the bank's [forward](term:forward) quote for March 2027 value; the project manager's view of how firm the date is.
