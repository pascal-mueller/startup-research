        intro: "Lea started at 07:30 and has already refreshed the workbook. Daniel opens the same screens at 07:45 to see the picture before her proposal arrives. This is **not** the Tuesday of the [Start page](/start) and the [daily cash positioning](wf:daily-cash-positioning) workflow (that scenario is 17 November, with a CHF 2.6m gap from three causes and a EUR 1.5m top-up to HM Deutschland) — this is 27 October, a German payroll week, and the numbers differ."
        entries:
          - time: "07:45"
            title: Statement completeness check
            kind: check
            systems: [Multibank connectivity tool]
            call: The tool's 11 in; Suzhou's export missing again
            why: A missing statement means an unknown balance. He checks before he trusts any total.
            input: Prior-day [statements](term:bank-statement) (MT940/camt.053) for 11 of the 12 accounts, from 5 banks.
            decision: "[HM Suzhou's balance](why:day-china-manual-balance) is the one account the tool cannot cover: the Chinese bank has no EBICS/SWIFT corporate reporting, so Wei emails a portal export and Lea types it in. That is *not* a time-zone effect — Asian prior-day statements are the first to arrive in Switzerland — but the manual step at the end of that channel. The export is late again; Lea has already chased Wei."
            who: None; Lea owns the chase.
            next: Opens the workbook.
            wf: [daily-cash-positioning]
          - time: "07:55"
            title: Look at the refreshed workbook
