            call: Italian customer late (CHF 2.1m); German run a day early
            why: Timing differences and permanent losses need different responses.
            input: Transaction details for HM Italia and HM Deutschland; Lea's flags; Jens's note from Monday.
            decision: A large Italian customer did not pay CHF 2.1m on its due date, and Germany's supplier run of about CHF 0.9m equivalent debited Monday instead of the planned Tuesday — together the gap against last week's plan. Both look like timing, but he wants confirmation on Italy because this customer was also late in September.
