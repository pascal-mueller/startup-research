            input: HM AG's EUR account (about EUR 11.9m); the German account's minimum balance (EUR 0.25m); Thursday's EUR 8m forward delivery from HM AG's EUR account.
            decision: "[EUR 3m](why:day-german-funding-3m) covers payroll plus a buffer and still leaves HM AG about EUR 0.9m after Thursday's forward settlement. Structured as an [intercompany loan](term:intercompany-loan)."
            who: "[Lea enters the transfer at 08:25](/day/lea#tuesday-0825); Daniel approves it as second signatory at 08:30."
            next: Executes same day via EBICS; Lea updates the loan register for accounting.
            wf: [funding-subsidiary]
          - time: "09:40"
            title: Second signature on the Swiss supplier run
            kind: approval
            systems: ["Connectivity tool (EBICS distributed signature)"]
            call: Release 57 of 58; the large one goes to the CFO and CEO
            why: HM AG's payment runs are prepared by the Swiss accounting team; treasury provides one of the two electronic signatures on the EBICS file ([distributed signature](term:ebics-signature)). Up to CHF 2m the two electronic signatures are enough; above CHF 2m the CFO and the CEO co-sign in addition.
            input: The payment file (58 payments, CHF 4.3m in total, including one component payment of CHF 2.4m); the vendor-master change log for this run.
            decision: "[The CHF 2.4m payment](why:day-escalation-two-million) leaves the treasury pair and goes to Thomas and the CEO in the bank's signing workflow. One supplier's bank details changed on Friday; that payment waits until AP shows the call-back record."
            who: Swiss AP team lead.
            next: The held payment is released at 11:00 after AP produces the record; all of them clear the bank's cut-offs. See [large payment approval](wf:large-payment-approval).
            wf: [payment-processing]
          - time: "10:30"
            title: Thomas stops by
            kind: meeting
            systems: []
            call: Tell credit control about the Italian customer
            why: The CFO wants to hear about a delayed CHF 2.1m receipt before it turns into a bigger story.
            input: Giulia's reply via Lea (customer's payment run moved; pays Friday).
            decision: Nothing to decide on liquidity; Thomas asks that the customer's pattern goes to the next credit-control review.
            who: Thomas (CFO).
            next: Daniel emails Giulia and the group credit controller.
          - time: "11:00"
            title: 13-week forecast with the Italian delay
            kind: analysis
            systems: [Excel 13-week forecast]
            call: Low point about CHF 18m mid-December; no RCF drawing
            why: A late receipt can shift the low point. The CFO wants group cash above CHF 10m at all times.
            input: Last week's forecast; the Italian receipt moved to Friday; the December payroll weeks (Swiss and German payrolls including the 13th salary); the Swiss Q3 VAT payment (about CHF 0.8m, due 30 November).
            decision: "The low point stays about CHF 18m in the week of 14 December — December payrolls including the 13th salary — above the CHF 10m group minimum (of which about CHF 6m sits in China and cannot move). The annual bond [coupon](term:coupon) is a separate, later event and does not drive the low point. About CHF 137m of the CHF 200m [RCF](term:rcf) is undrawn; no drawing needed."
            who: None.
            next: Final numbers come after Tuesday's submissions (Lea).
            wf: [cash-forecasting, liquidity-planning]
          - time: "13:30"
            title: TMS scoring and business case
            kind: project
            systems: [Excel]
            call: Business case must show hours saved, not features
            why: Thomas will only take a TMS request to the executive board if it pays back in reduced manual work and risk.
            input: "Monday's demo notes; Lea's time log: the position takes her 45 minutes on a normal morning and about two hours on a Monday, the weekly forecast cycle about four hours of chasing and consolidating."
            decision: Frames the case around positioning, forecast collection, deal capture and key-person risk — about a day a week of Lea's time, plus the risk of the workbook living in one head.
            who: Lea; IT.
            next: Draft to Thomas in November.
          - time: "14:30"
            title: EUR hedge-ratio report
            kind: analysis
            systems: ["Excel hedge report (Lea's)"]
            call: No trade today; quote round Friday for Q2 2027
            why: The policy sets hedge bands by rolling calendar quarter — 60–90% for the front quarter, then 40–70%, 25–55% and 0–40% — because the forecast is less firm further out. Reading the report can wait unless a quarter is outside its band.
            input: >-
              Lea's Monday report: exposures from the forecast, outstanding [forwards](term:forward) from bank confirmations, each quarter against its band.
            decision: "Q4 2026 at 85% (band 60–90%) and Q1 2027 at 62% (band 40–70%) are inside; Q2 2027 at 30% is close to the bottom of its 25–55% band. He reads it [quarter by quarter against each band](why:day-hedge-ratio-by-quarter) — a blended ratio would hide a breach — and plans a quote round on Friday."
            who: None today.
            next: Friday — quotes from three banks, including the German bank. See [FX hedging](wf:fx-hedging).
            wf: [fx-hedging]
          - time: "15:30"
            title: Review forecast submissions so far
            kind: review
            systems: [Excel 13-week forecast]
            call: Challenge France tomorrow
            why: Subsidiaries submitted by noon — except France.
            input: Lea's first consolidation and variances.
            decision: The Czech numbers look fine; France is missing. He will call the French finance manager on Wednesday.
            who: Lea.
            next: Wednesday — overlays and the final forecast.
            wf: [cash-forecasting]

  # ---------------------------------------------------------------- LEA
  - id: lea
    name: Lea
    title: Treasury Analyst
    company: helvetic
    page: /day/lea
    rolePage: /org/roles-analyst
    tier: midmarket
    oneLiner: The analyst in a two-person central treasury. Builds the daily position every morning, runs the 13-week forecast process, produces the hedge-ratio report, and keeps the loan and deal registers accounting depends on.
    reportsTo: Daniel (Treasury Manager)
    team: None; works with subsidiary finance teams, Swiss AP, Group Accounting and the banks' service desks.
    treasuryShare: 100%
    firstCheck: "07:30 daily: the 11 statements the connectivity tool should have delivered — and Wei's emailed Suzhou export as the twelfth"
    systems: ["Multibank connectivity tool", "Excel positioning workbook", "Excel 13-week forecast + subsidiary templates", "SAP S/4HANA reports (AR/AP, FI)", "Bank portals", "Intercompany loan and FX deal registers (Excel)"]
    decides: Whether data is right; what to propose; which subsidiary to chase. She does not decide funding, investments or hedges — she prepares them and is the second signatory on treasury transfers.
    talksTo: [Daniel, subsidiary finance managers, Swiss AP team, Group Accounting (Claudia's team), bank service desks, TMS vendors]
    awake:
      - "**A number she sent that was wrong.** A broken link or an outdated FX rate in the workbook goes straight into Daniel's decision and the CFO's slide."
      - "**Chasing people who don't report to her.** The forecast depends on eight subsidiaries meeting a Tuesday-noon deadline for a task that is nobody's priority there."
      - "**Being the only one who knows.** Many workbook macros and the loan register logic are in her head. When she is on holiday, Daniel does her work and his."
      - "**Bank connectivity quietly breaking.** An expired EBICS key or a changed statement format means a missing balance on the one day it matters."
    rhythm:
      - { when: "Wednesday", what: "Position first, as every morning. Forecast consolidation after France submits; variance table for Daniel; bank reconciliation queries from accounting." }
      - { when: "Thursday", what: "Position first, as every morning. Matches FX forward confirmations for the EUR 8m maturity; prepares Daniel's jour-fixe pack." }
      - { when: "Friday", what: "Position first, as every morning. Collects the FX quotes Daniel requested and records the trades; sends the weekly forecast summary." }
      - { when: "Month-end WD1–3", what: "Intercompany loan interest for all loans; bank balance confirmations for Group Accounting; counterparty exposure table; data for the monthly treasury report." }
      - { when: "Recurring projects", what: "TMS selection (requirements, demo scripts, scoring); bank KYC document packs; annual bank-mandate and signatory update." }
    unusual:
      title: The German bank's EBICS keys expire
      body: |
        On a Wednesday in June, no statement arrives from the German bank and the payment upload for HM Deutschland fails with an authentication error. The German bank's EBICS subscriber keys for the treasury user had to be renewed, and the renewal reminder went to a mailbox nobody reads.

        Lea's day: she gets the German balances from the bank's web portal and types them into the workbook (the fallback in the [daily cash positioning](wf:daily-cash-positioning) workflow); asks Jens to release the day's German supplier run from the German portal with local signatories; then generates new keys in the connectivity tool and prints the initialisation letters, which two authorised signatories must sign and send to the bank before it activates the keys ([EBICS key initialisation](term:ebics-key-initialisation)). Daniel and Thomas sign; the bank activates them two days later. Her follow-up: a key- and certificate-expiry calendar for all five banks in the connectivity tool.
    days:
      - id: monday
        label: Monday 26 October
        intro: Monday statements cover three calendar days (Friday plus weekend instant payments), and the forecast week starts.
        entries:
          - time: "07:30"
            title: Statement completeness
            kind: check
            systems: [Multibank connectivity tool]
            call: The tool's 11 in; Wei's export missing — chase
            why: Every later number depends on it. The tool covers 11 of the 12 accounts; the twelfth, HM Suzhou, sits at a Chinese bank with no EBICS/SWIFT corporate reporting, so Wei emails a portal export and she types it in.
            input: "Prior-day statements (MT940/camt.053) covering Friday–Sunday for the 11 connected accounts — HM AG CHF and EUR (Swiss bank A), HM AG CHF (Swiss bank B), HM Service AG CHF, HM Deutschland EUR (German bank), HM Italia EUR, HM France EUR, HM UK GBP, HM CZ CZK and EUR, HM Inc. USD (global bank) — plus the overnight inbox for Wei's export for HM Suzhou CNY (Chinese bank), the twelfth."
            decision: "Whether a missing balance is a real problem. Wei's export has not arrived — a handover problem, not a time zone (Asian prior-day statements are the first to arrive in Switzerland). She chases Wei and carries on with the 11 accounts; [the twelfth is manual](why:day-china-manual-balance)."
            who: None.
            next: Imports into the workbook.
            wf: [daily-cash-positioning]
          - time: "07:40"
            title: Opening balances don't match
            kind: exception
            systems: [Excel positioning workbook, Connectivity tool]
            call: Duplicate German file — remove and re-import
            why: HM Deutschland's opening balance does not equal Friday's closing balance, and Friday's transactions appear twice.
            input: The workbook's control column (opening = prior close); the connectivity tool's import log showing two identical camt.053 files from the German bank.
            decision: It is a data problem, not a real movement. She deletes the duplicate and re-imports.
            who: Emails the German bank's electronic-banking service desk to ask why the file was sent twice.
            next: Checks the control column again — clean.
          - time: "08:00"
            title: Add today's and this week's known flows
            kind: analysis
            systems: ["Excel positioning workbook", "SAP (payment proposals)", "Outlook"]
            call: Germany will be short for Friday's payroll — fund by Thursday
            why: The position is only useful with the flows already known for today and the next days.
            input: Swiss payroll (CHF 6.8m) debited Friday as forecast; German supplier run planned Tuesday (Jens says it went out today instead); German payroll EUR 4.2m (value Friday); US payroll funding Thursday; EUR 8m forward maturing Thursday at HM AG.
            decision: HM Deutschland needs about EUR 3m before Thursday; the exact amount depends on today's supplier run.
            who: Jens (HM Deutschland) by chat.
            next: Proposal to Daniel.
          - time: "08:45"
            title: Position email to Daniel
            kind: comms
            systems: [Excel, Outlook]
            call: "Propose: no transfers today; fund Germany Tuesday; look at the 15 November RCF roll"
            why: Daniel decides; Lea's job is a clear proposal with options.
            input: The completed position (group cash CHF 45.6m), the week's known flows, the forecast.
            decision: What she recommends and what she flags as uncertain.
            who: Daniel.
            next: "[Daniel reviews at 08:50](/day/daniel#monday-0850)."
          - time: "09:15"
            title: Roll the 13-week forecast and send reminders
            kind: recurring
            systems: [Excel 13-week forecast, Outlook]
            call: Deadline Tuesday 12:00
            why: The forecast cycle starts every Monday. Last week becomes actuals; a new week 13 is added.
            input: Last week's forecast; actual bank flows by entity from the position workbook.
            decision: None — mechanical, but she checks the opening balance against today's position.
            who: Sends the template to 8 subsidiary finance managers with the Tuesday-noon deadline.
            next: Submissions arrive Tuesday. See [cash forecasting](wf:cash-forecasting).
            wf: [cash-forecasting]
          - time: "10:00"
            title: Pull SAP data for the central lines
            kind: analysis
            systems: ["SAP S/4HANA (AR/AP reports)", "Excel"]
            call: Swiss, German and Czech AR/AP loaded
            why: For the three entities on SAP, treasury does not rely on templates for receivables and payables.
            input: Open AR by due date and open AP with planned payment dates, exported to Excel.
            decision: Adjusts two large receivables for known late payers.
            who: None.
            next: Pasted into the forecast's data tabs; the other entities come via templates.
          - time: "10:40"
            title: Wei's export arrives after a chase
            kind: exception
            systems: [Excel positioning workbook, Teams]
            call: CNY balance as expected; log the late handover
            why: It should have been there at 07:30 — Asian prior-day statements normally arrive first, and the Suzhou export is produced in the bank's portal overnight. Wei was on the shop floor; the manual channel is only as reliable as one person's morning.
            input: Wei's portal export; his note that the plant has no backup contact for it.
            decision: Keys the CNY balance into the workbook and logs the late handover in her connectivity-gap list — the evidence she keeps for why the Chinese bank should be pushed for a reporting channel.
            who: Wei (HM Suzhou).
            next: Position saved as final for the day.
          - time: "11:15"
            title: Bank KYC request
            kind: admin
            systems: [Outlook, Commercial register extract, Signatory list]
            call: Send updated signatory list and register extract
            why: The global bank's periodic [KYC](term:kyc) review wants the current signatory list and a recent commercial-register extract for HM AG and HM Inc. Missing it can mean restricted accounts later.
            input: The bank's checklist; Helvetic's signatory register.
            decision: Which documents need a board-member signature (the signatory list) and which she can send now.
            who: Daniel (forwarded it); Legal for the certified extract.
            next: Package sent Thursday. See [bank account management](wf:bank-account-management).
          - time: "13:30"
            title: TMS demo (first hour)
            kind: project
            systems: [Vendor demo]
            call: Note what would replace her Monday
            why: She is the person whose weekly work a TMS would change most.
            input: The demo script she wrote from the real Monday.
            decision: Notes that statement import and duplicate detection would help; subsidiary forecast collection would not.
            who: Daniel, vendor.
            next: Her notes go into Tuesday's scoring.
          - time: "14:30"
            title: Weekly EUR hedge-ratio report
            kind: analysis
            systems: [Excel hedge report, FX deal register]
            call: Q4 85%, Q1 62%, Q2 30% — all inside bands
            why: The hedging policy sets a band per rolling calendar quarter — 60–90% for Q4 2026, then 40–70%, 25–55%, 0–40% — and Daniel needs to know which quarters need new forwards.
            input: Forecast EUR net receipts by quarter; outstanding forwards from the deal register, checked against bank confirmations; each quarter's ratio against its band.
            decision: None — she flags that Q2 2027 at 30% is close to the bottom of its 25–55% band.
            who: Sends to Daniel at 16:00.
            next: "[Daniel reads it Tuesday afternoon](/day/daniel#tuesday-1430). See [hedge ratio](term:hedge-ratio)."
            wf: [fx-hedging]
          - time: "16:30"
            title: Intraday check
            kind: check
            systems: ["Connectivity tool (intraday reports)"]
            call: Nothing outstanding
            why: Confirms that today's expected large receipts arrived and nothing unexpected went out.
            input: >-
              [Intraday reports](term:camt-052) (MT942/camt.052) from the banks that provide them.
            decision: None.
            who: None.
            next: Leaves at 17:00.
      - id: tuesday
        label: Tuesday 27 October
        intro: Lea builds the position every morning; on Tuesdays the forecast submissions are also due at noon.
        entries:
          - time: "07:30"
            title: Statements — Wei's export missing again
            kind: exception
            systems: ["Multibank connectivity tool", "Teams"]
            call: Chase Wei; position with Suzhou at yesterday's balance
            why: "The tool's 11 statements are in — for a Swiss company, Asian prior-day statements are normally the *first* to arrive. The missing piece is the twelfth: Wei's emailed portal export, late for the second day running."
            input: The connectivity tool's delivery log; yesterday's late handover.
            decision: "Chases Wei on Teams, and builds the position with HM Suzhou at yesterday's balance, [clearly marked as unconfirmed](why:day-china-manual-balance) — an unflagged stale balance is worse than a flagged one, and China is excluded from concentration anyway ([trapped cash](term:trapped-cash))."
            who: Wei (HM Suzhou).
            next: Workbook refresh.
            wf: [daily-cash-positioning]
          - time: "07:40"
            title: Refresh the workbook and flag the gap
            kind: analysis
            systems: [Excel positioning workbook]
            call: Group cash CHF 44.2m — CHF 3m short of expectation
            why: The position is the input to every decision Daniel makes this morning.
            input: 11 imported statements; last week's plan for this morning; known flows.
            decision: Flags two causes in her notes — no receipt from the large Italian customer (CHF 2.1m) and the German supplier run (about CHF 0.9m equivalent) debiting Monday instead of the planned Tuesday. She checks the control column so Daniel knows the gap is not a data error.
            who: "[Daniel opens the same workbook at 07:55](/day/daniel#tuesday-0755)."
            next: Sizes the German funding.
          - time: "08:00"
            title: Size the German payroll funding
            kind: analysis
            systems: [Excel positioning workbook]
            call: "Propose EUR 3m"
            why: She flagged on Monday that HM Deutschland would be short for payroll; after Monday's early supplier run the German account's need is now final.
            input: German balance about EUR 1.9m; payroll EUR 4.2m for value Friday; minimum EUR 0.25m; HM AG's EUR balance and Thursday's EUR 8m forward delivery.
            decision: "[EUR 3m](why:day-german-funding-3m): 4.2 payroll + 0.25 minimum − 1.9 balance = EUR 2.55m needed, rounded up for a buffer. It leaves about EUR 0.7m in Germany after payroll and about EUR 0.9m at HM AG after Thursday's forward settlement (11.9 − 3 − 8)."
            who: Daniel.
            next: Daniel decides at 08:20.
          - time: "08:25"
            title: Enter the German funding
            kind: execution
            systems: ["Connectivity tool (EBICS distributed signature)"]
            call: EUR 3m entered for same-day value
            why: Daniel instructed it; treasury transfers need two treasury signatures (she enters, he approves — [four-eyes](term:four-eyes-principle)).
            input: The German account details from the template (never typed free-hand).
            decision: Uses the stored template; checks amount and value date.
            who: Daniel approves as second signatory at 08:30.
            next: Records the [intercompany loan](term:intercompany-loan) in the register for Group Accounting.
            wf: [funding-subsidiary]
          - time: "09:30"
            title: Giulia replies about the Italian customer
            kind: comms
            systems: [Outlook, Excel 13-week forecast]
            call: Move CHF 2.1m to Friday
            why: Daniel asked HM Italia whether the customer's late payment is a problem.
            input: Giulia's email — the customer moved its payment run; payment scheduled for Friday.
            decision: Treat as timing. Moves the receipt into this week's Friday; keeps a note that this customer was late twice this quarter.
            who: Giulia (HM Italia); informs Daniel.
            next: Daniel mentions it to Thomas at 10:30.
          - time: "10:05"
            title: Wei's export arrives; save the position
            kind: check
            systems: [Excel positioning workbook]
            call: Position final; the gap-list item stays open
            why: Wei's export landed at 10:00 — the CNY balance is as expected, but the manual channel has now failed twice in two days.
            input: Wei's portal export, keyed in by hand (CNY 55m, as expected).
            decision: Keeps the issue open until the channel has a backup (a second person at the plant, or a reporting file from the Chinese bank) — two late handovers in two days means it will happen again.
            who: Wei (HM Suzhou).
            next: Saves the day's position; week-1 actuals go into the forecast.
          - time: "10:30"
            title: Chase subsidiary submissions
            kind: recurring
            systems: [Outlook, Teams]
            call: 7 of 8 by noon expected
            why: The forecast is only as good as the inputs, and inputs arrive late unless chased.
            input: Submission tracker.
            decision: Whom to remind (France, UK) and how politely.
            who: Subsidiary finance managers.
            next: France promises Wednesday morning.
            wf: [cash-forecasting]
          - time: "11:15"
            title: US statements land — the last of the eleven
            kind: check
            systems: ["Multibank connectivity tool (intraday feed)"]
            call: HM Inc.'s file in; balances as expected
            why: Of the 11 statements the tool delivers, the US ones are always the last — a US bank generates its prior-day file after the European morning has started. Until they land, the US balances come from the US bank's intraday report.
            input: HM Inc.'s and the group USD account's prior-day statements; the intraday figures she has used since 07:30.
            decision: None — nothing unexpected; she replaces the intraday placeholders with the prior-day figures.
            who: None.
            next: All 12 accounts are now on prior-day balances (Suzhou keyed in at 10:05).
          - time: "13:30"
            title: Consolidate and compute variances
            kind: analysis
            systems: [Excel 13-week forecast]
            call: First pass — Italy over-forecast again
            why: Last week's forecast vs actual shows where the forecast is unreliable.
            input: Submissions (France still missing); SAP data; bank actuals from the positioning workbook.
            decision: "A first pass only — the consolidation finishes Wednesday, as every week. She classifies variances as timing or permanent. Italy's receipts came in below forecast again."
            who: None.
            next: Variance table to Daniel at 15:30. See [variance analysis](term:variance-analysis).
          - time: "14:45"
            title: Prepare Thursday's forward maturity
            kind: execution
            systems: ["FX deal register", "Bank confirmation (PDF)"]
            call: EUR 8m delivery confirmed
            why: At maturity HM AG delivers EUR 8m to the bank and receives CHF. If the EUR isn't there, the settlement runs against the account's intraday credit line with the Swiss bank — and past that limit, into an overdraft.
            input: The original [trade confirmation](term:deal-confirmation); the bank's settlement instructions.
            decision: Confirms settlement details with the bank's back office by email; expects the CHF credit Thursday.
            who: The Swiss bank's FX back office.
            next: >-
              Thursday: checks the CHF credit and marks the deal settled.
          - time: "16:15"
            title: Intraday check and pain.002 statuses
            kind: check
            systems: [Connectivity tool]
            call: EUR 3m arrived in Germany; 58 payments accepted
            why: Confirms that the morning's decisions actually executed.
            input: Intraday reports; [payment status](term:payment-status) files.
            decision: None.
            who: None.
            next: Messages Jens that the payroll funding arrived.

  # ---------------------------------------------------------------- ANNA
  - id: anna
    name: Anna
    title: Group Treasurer
    company: globalchem
    page: /day/anna
    rolePage: /org/roles-head-of-treasury
    tier: multinational
    oneLiner: Leads a 25-person treasury at a CHF 7bn, BBB+-rated chemicals group. Does almost no transaction work herself; she owns policy, funding, the rating, the banks, the controls — and is the person the CFO calls when something is wrong.
    reportsTo: Markus (CFO); presents to the audit committee
    team: Priya (Cash & Liquidity / in-house bank), Jonas (Financial Risk — FX & rates), Olivier (Corporate Finance — debt & ratings), Marta (Treasury Operations & payment factory, Kraków), Ben (Treasury Systems); a Singapore regional treasury centre
    treasuryShare: 100%
    firstCheck: "Markets and credit news, then Priya's daily liquidity dashboard (after 10:30)"
    systems: [Bloomberg, Priya's daily liquidity dashboard, SAP treasury reporting, PowerPoint/Excel for board and rating-agency material, Email and Teams — she rarely logs into a bank]
    decides: Funding strategy and timing, bank panel and wallet allocation, policy and limit exceptions, hedging strategy proposals to the CFO/board, escalations; signs large intercompany loans and policy exceptions.
    talksTo: [Markus (CFO), her five team heads, relationship banks' senior coverage bankers, rating agencies, investor relations, group tax, group accounting, internal audit, the audit committee]
    awake:
      - "**The refinancing calendar.** A CHF 300m bond matures in June 2027. Pre-fund too early and carry costs rise; too late and a market shock could close the window."
      - "**The rating.** BBB+ constrains leverage, dividends and M&A. A large acquisition would test it."
      - "**Control failure at scale.** Hundreds of users, a payment factory, ~280 accounts. A single social-engineering success or a bad mandate change can lose millions; payment fraud attempts are routine in AFP's surveys[](cite:afp-pfc-2026)."
      - "**Forecast quality from 40 units.** The group plan and the hedging programme rest on local submissions she cannot personally check."
      - "**A bank in trouble.** Counterparty exposure is diversified, but a sudden bank failure still means trapped balances and broken cash pools."
    rhythm:
      - { when: "Wednesday", what: "Hedging committee with Jonas: 2027 budget rates and hedge programme proposal for the CFO." }
      - { when: "Thursday 29 Oct", what: "Q3 trading update published; she is on standby for analysts' questions on net debt and liquidity." }
      - { when: "Friday", what: "1:1s with team heads (rotating); approvals of limit exceptions; reads Marta's weekly controls report." }
      - { when: "Monthly", what: "Treasury report to Markus (liquidity, debt, FX, counterparty exposure, fraud incidents, KPIs); liquidity committee with FP&A; bank calls." }
      - { when: "Quarterly / annual", what: "Audit-committee treasury report; rating-agency annual review (November); policy review; bank panel review against RCF commitments; RCF extension options." }
    unusual:
      title: A deepfake voice call to the payment factory
      body: |
        On a Friday afternoon, an operator in the Kraków payment factory receives a voice call that sounds like Markus, the CFO, followed by an email 'confirming' an urgent EUR 2.4m payment to a lawyer's escrow account for a confidential acquisition. The operator follows the procedure: no payment outside the approved workflow, and a [call-back](term:call-back-verification) on the directory number. Markus knows nothing.

        Anna's role starts after the control has worked. She informs Markus and the Head of Internal Audit the same evening; asks Marta for a timeline and for a check whether other staff were contacted; has Ben confirm that no master data or payment templates were changed; and asks Group Security to report it. On Monday she decides two things — a reminder to all 300+ payment users that voice alone never authorises a payment (Swiss authorities specifically warn about AI-generated voices in CEO fraud[](cite:bacs-ceo-fraud-2026)), and an audit-committee note. See [fraud investigation](wf:fraud-investigation).
    days:
      - id: monday
        label: Monday 26 October
        intro: Anna's day is meetings and documents. The operational picture arrives from Priya and Jonas; her job is to decide what matters.
        entries:
          - time: "07:45"
            title: Markets and credit news
            kind: check
            systems: [Bloomberg]
            call: Nothing affecting funding
            why: Credit spreads, bank news and rate moves change funding costs and counterparty risk before any report shows it.
            input: EUR and CHF rates, GlobalChem's bond spreads, relationship banks' CDS and news.
            decision: None today.
            who: None.
            next: Leadership stand-up.
          - time: "08:30"
            title: Treasury leadership stand-up (30 min)
            kind: meeting
            systems: [Teams]
            call: Priority this week — Q3 update and CP rollover
            why: The one weekly meeting where all five team heads coordinate.
            input: Each head's top three items. Priya — EUR CP maturity Thursday and the Polish loan request; Jonas — 2027 budget rates; Olivier — rating-agency deck; Marta — month-end payment volume; Ben — ISO 20022 statement-format migration.
            decision: Where she wants to be involved this week (the Polish loan and the rating deck) and where she only wants the outcome.
            who: Priya, Jonas, Olivier, Marta, Ben.
            next: Items go into her week plan.
          - time: "09:15"
            title: Q3 net debt with Group Accounting and IR
            kind: meeting
            systems: [Excel net-debt bridge]
            call: Sign off net debt figure and liquidity wording
            why: The Q3 trading update publishes net debt and liquidity on Thursday; treasury owns the cash and debt numbers.
            input: Net debt bridge (about CHF 2.3bn, illustrative); undrawn EUR 1.5bn RCF; CP outstanding.
            decision: Agrees the wording on liquidity headroom; asks accounting to add the CP maturity profile to the Q&A file.
            who: Group accounting, investor relations.
            next: IR finalises Wednesday. See [month-end reporting](wf:month-end-reporting).
            wf: [month-end-reporting]
          - time: "10:45"
            title: Priya's daily liquidity dashboard
            kind: check
            systems: ["Daily liquidity dashboard (email + SAP report)"]
            call: Informed of CP plan; no intervention
            why: She reads it daily to know the group's position, not to redo it.
            input: "[Priya's dashboard](/day/priya#monday-1030): group cash and investments, pool positions, CP outstanding and maturities, headroom against the policy minimum, counterparty exposures, exceptions."
            decision: Whether anything needs her. The CP rollover is within Priya's authority.
            who: Priya.
            next: None.
            wf: [liquidity-planning]
          - time: "11:30"
            title: Rating-agency review deck with Olivier
            kind: project
            systems: [PowerPoint, Excel credit metrics]
            call: Lead with free cash flow, not leverage
            why: The annual review with the rating agencies in November determines whether BBB+ holds.
            input: >-
              Olivier's draft: leverage, FCF, capex plan, dividend, liquidity, the 2027 bond maturity.
            decision: >-
              The narrative: FCF covers the dividend; the 2027 maturity will be refinanced in advance.
            who: Olivier; later Markus.
            next: Second draft Friday. See [credit rating](term:credit-rating).
          - time: "14:00"
            title: 2027 bond refinancing options
            kind: decision
            systems: ["Olivier's analysis (Excel)", "Bank indications"]
            call: Recommend a CHF bond in Q1 2027
            why: The CHF 300m bond matures June 2027. Options — pre-fund with a new CHF bond, use CP/RCF temporarily, or a EUR issue swapped.
            input: Indicative pricing from relationship banks; the liquidity forecast.
            decision: Recommends pre-funding in Q1 2027 with a new CHF bond and accepting a few months of negative carry, to remove [refinancing risk](term:refinancing-risk) before the rating review cycle.
            who: Olivier; recommendation to Markus on Tuesday.
            next: Tuesday 1:1 with Markus.
          - time: "15:30"
            title: 1:1 with Jonas — hedging proposal
            kind: meeting
            systems: [Jonas's exposure model]
            call: Keep hedge ratios; revisit USD after budget
            why: Budget rates for 2027 are set in November; the board wants to know how much of 2027 is already protected.
            input: Net exposures after [netting](term:netting); hedge cover by currency; USD/CHF around 0.80.
            decision: No change to the programme; asks for a scenario for a further 10% USD fall.
            who: Jonas.
            next: Wednesday hedging committee. See [FX hedging](wf:fx-hedging).
            wf: [fx-hedging]
          - time: "17:00"
            title: Approvals queue
            kind: approval
            systems: [SAP workflow, Email]
            call: Approve two bank mandate changes; hold one account opening
            why: Mandate changes and account openings above team-head authority need her approval.
            input: Requests from Marta's team with the business reason.
            decision: Holds a request to open a new account in a country where GlobalChem already has two banks — she wants to know why the existing accounts cannot be used.
            who: Marta.
            next: See [bank account management](wf:bank-account-management).
      - id: tuesday
        label: Tuesday 27 October
        intro: Tuesday is almost entirely people outside treasury — a bank, the systems project, the CFO, the audit committee.
        entries:
          - time: "08:00"
            title: Relationship bank breakfast
            kind: meeting
            systems: []
            call: No new mandate promised
            why: A core RCF bank's coverage team wants to discuss its share of ancillary business.
            input: >-
              Olivier's [wallet-share](term:wallet-share) analysis: this bank's revenue from GlobalChem vs its RCF commitment.
            decision: The bank is 'underfed' but not by much; she offers a role in the planned 2027 bond but no cash-management change.
            who: Senior coverage banker.
            next: Olivier updates the bank allocation plan.
          - time: "10:00"
            title: Treasury systems steering committee
            kind: project
            systems: [Ben's project status]
            call: Go-live date held for the statement-format change
            why: Swiss banks discontinue the 2009 ISO 20022 message versions with the November 2026 release — banks communicate 14 or 21 November[](cite:six-sps-cash-mgmt); statement imports must be on the new versions before then.
            input: Ben's test status for the Swiss banks' camt.053 files; the service bureau's timetable.
            decision: Holds the go-live date; one bank's files still fail tests, so she asks Ben for a fallback (portal download) if it isn't fixed before the release.
            who: Ben, Marta, the service bureau.
            next: Weekly status.
          - time: "11:00"
            title: Polish subsidiary loan — approval
            kind: approval
            systems: [In-house bank loan request, Tax memo]
            call: Approve PLN 40m for 3 years
            why: The request is above Priya's authority.
            input: "[Priya's recommendation](/day/priya#monday-1500): the in-house bank lends PLN for 3 years, hedged back to CHF with a [cross-currency swap](term:cross-currency-swap) by Jonas's team; tax confirms the interest margin is arm's length."
            decision: Approves; asks that the loan is reviewed when the plant capex is complete.
            who: Priya; tax.
            next: Priya executes; accounting books it. See [funding a subsidiary](wf:funding-subsidiary).
            wf: [funding-subsidiary]
          - time: "11:30"
            title: 1:1 with Markus (CFO)
            kind: meeting
            systems: []
            call: Markus agrees the pre-funding approach
            why: The bond recommendation, the Q3 wording and the rating review need his view.
            input: Monday's refinancing analysis.
            decision: Markus supports a Q1 2027 CHF bond; wants the board informed in December.
            who: Markus.
            next: Olivier prepares the board paper.
          - time: "14:00"
            title: Audit-committee treasury report (Q3)
            kind: analysis
            systems: [PowerPoint, Excel]
            call: Report two policy breaches, both closed
            why: The audit committee receives a quarterly treasury risk report.
            input: Counterparty-limit report; hedge compliance shown [by quarter against each band](why:day-hedge-ratio-by-quarter); fraud attempts log; policy exceptions.
            decision: Two short counterparty-limit breaches (large customer receipts landing at a non-core bank) — both reported, with the remediation.
            who: Head of Internal Audit reviews the draft.
            next: Sent with the audit-committee pack. See [policy compliance](wf:policy-compliance).
            wf: [policy-compliance]
          - time: "16:00"
            title: Team development
            kind: meeting
            systems: []
            call: Rotation of an analyst to Singapore
            why: Part of the job is keeping a 25-person team staffed and experienced.
            input: Development plans; the Singapore RTC's request for a Basel-experienced analyst as the centre takes over APAC cash operations.
            decision: Supports the 12-month rotation — the Singapore centre needs someone who has run the in-house-bank processes — and asks Priya to backfill the Basel role before the year-end netting cycle.
            who: Priya; HR.
            next: HR opens the assignment; Priya plans the backfill.

  # ---------------------------------------------------------------- PRIYA
  - id: priya
    name: Priya
    title: Head of Cash & Liquidity
    company: globalchem
    page: /day/priya
    rolePage: /org/roles-cash-manager
    tier: multinational
    oneLiner: Runs the cash & liquidity / in-house bank team (6 people in Basel plus the Singapore centre's cash analysts). Owns daily liquidity, cash pools, short-term investments, commercial paper and intercompany funding.
    reportsTo: Anna (Group Treasurer)
    team: 2 cash managers, 3 analysts, 1 in-house-bank specialist in Basel; dotted line to 2 cash analysts in Singapore
    treasuryShare: 100%
    firstCheck: "07:30: the TMS exception list her two cash managers run — missing statements, failed sweeps, accounts outside pools below minimum — and which items reach her"
    systems: ["SAP S/4HANA treasury (cash position, in-house bank)", "SWIFT via service bureau", "bank portals (fallback)", "CP dealer platform and phone", "MMF portal", "forecasting tool", "Excel"]
    decides: Daily funding and investment of the group within limits; CP issuance and maturities within the programme; pool structure changes; intercompany loans within her authority; what goes to Anna.
    talksTo: [Anna, her team, Singapore regional treasury centre, Marta (payment factory), Jonas (cross-currency swaps for funding), subsidiary finance, core banks' cash-management teams, CP dealers, MMF providers, tax]
    awake:
      - "**The one flow the system doesn't know about.** 90% of the position is automated; the risk sits in the other 10% — an unannounced local payment, an account outside the pool, a receipt landing at the wrong bank."
      - "**Counterparty concentration.** A EUR 80m customer receipt landing at one bank can push it over its limit overnight."
      - "**CP market access.** GlobalChem rolls commercial paper every few weeks. If the CP market seized, she would need the RCF — which works, but becomes a public signal."
      - "**Restricted-currency countries.** Cash that cannot be pooled or moved quickly looks like liquidity in reports but isn't."
    rhythm:
      - { when: "Wednesday", what: "Weekly liquidity forecast lock: 4-week and 13-week views from the forecasting tool; accuracy by entity (target ±10% on 4-week receipts)." }
      - { when: "Thursday 29 Oct", what: "CP maturity settles against new issuance; month-end sweep and pool interest checks begin." }
      - { when: "Month-end / WD1–3", what: "In-house bank interest and statements to subsidiaries; intercompany balances confirmed with accounting; counterparty report to Anna." }
      - { when: "Monthly (mid-month)", what: "Multilateral netting settlement: subsidiaries' intercompany invoices settled net through the in-house bank; she funds the net positions." }
      - { when: "Twice a year", what: "The US/Europe daylight-saving mismatch (March and late October/early November) makes New York only 5 hours behind — about a week in autumn, roughly three weeks in spring; US funding calls move accordingly." }
    unusual:
      title: The pool bank's statements don't arrive
      body: |
        One Monday the service bureau's connection to the EUR cash pool bank fails overnight: no prior-day statements for 60 pooled accounts and no confirmation that Friday's sweeps executed. The TMS shows the pool header at Friday's balance, which is almost certainly wrong.

        Priya's decisions under time pressure: her cash managers download the header and five largest participant balances from the bank's portal manually; she asks the bank's cash-management team to confirm by phone that the sweeps ran; and, because the position cannot be fully verified before the EUR cut-offs, she funds conservatively — she delays a planned EUR 50m MMF placement rather than risk an overdrawn header. The connection returns at 13:00; the statements confirm the sweeps. The cost of caution was one day's interest on EUR 50m; she reports the incident to Anna and asks Ben for monitoring on missing-file alerts. See [daily cash positioning](wf:daily-cash-positioning).
    days:
      - id: monday
        label: Monday 26 October
        intro: The TMS position is ready at 07:00 Basel time; Singapore has already done Asia-Pacific.
        entries:
          - time: "07:30"
            title: TMS exception list
            kind: check
            systems: ["SAP treasury (cash position)", "Singapore handover email"]
            call: 14 exceptions; 3 need her
            why: With ~280 accounts, nobody reads balances one by one. The team [works by exception](why:day-exception-list).
            input: "Exception list: missing statements, failed sweeps, accounts outside the pools below minimum, unexpected large items; Singapore's handover (APAC positions done, one Indian account short of its minimum)."
            decision: Which exceptions her cash managers can close themselves and which need her — an unexplained EUR 12m credit at a non-core bank, a failed sweep in Spain, and a funding request from Poland.
            who: Her two cash managers; Singapore RTC.
            next: Exceptions assigned in the 07:45 huddle.
            wf: [daily-cash-positioning]
          - time: "08:15"
            title: EUR 12m at the wrong bank
            kind: exception
            systems: [SAP treasury, Bank portal, Counterparty limit report]
            call: Move to the pool bank today
            why: A large customer paid to an old account at a non-core bank, pushing that bank over its [counterparty limit](term:counterparty-limit).
            input: Transaction detail and remittance information; the limit report.
            decision: Transfer the funds to the EUR pool header today; ask credit & collections to tell the customer the correct account.
            who: Cash manager executes; Marta's team informs AR.
            next: The breach is logged for Anna's quarterly report.
          - time: "09:00"
            title: CP maturity Thursday — roll or repay?
            kind: decision
            systems: ["SAP (CP register)", "Forecasting tool", "Dealer indications (email/Bloomberg)"]
            call: Roll EUR 100m for 1 month; repay EUR 50m from surplus
            why: EUR 150m of [commercial paper](term:commercial-paper) matures Thursday.
            input: The EUR pool header's surplus (about EUR 110m, including the EUR 12m moved in this morning) and the 4-week forecast; dealer indications for 1–3 month CP (illustratively around €STR plus a small spread); MMF yields.
            decision: Repay EUR 50m from the surplus (paying CP interest while holding the same cash in MMFs costs the spread between them), and roll EUR 100m for one month to cover the mid-November netting settlement and month-end outflows. EUR 50m of the surplus is reserved for Thursday's repayment.
            who: Two CP dealers; Anna informed through the dashboard.
            next: Trades agreed Tuesday for Thursday settlement.
          - time: "09:45"
            title: Spanish sweep failed
            kind: exception
            systems: [SAP, Bank portal]
            call: Manual transfer today; bank to fix mandate
            why: The Spanish subsidiary's zero-balancing [sweep](term:sweeping) failed because the bank updated a mandate.
            input: Bank error message; Spanish balance.
            decision: Cash manager sends a manual transfer to the header; bank's cash-management team fixes the sweep instruction.
            who: Bank's implementation team; Spanish finance.
            next: Checked in Tuesday's exceptions.
          - time: "10:30"
            title: Daily liquidity dashboard
            kind: comms
            systems: [SAP report, Excel, Email]
            call: Sent to Anna and team heads
            why: One page that tells Anna and the other heads where the group stands.
            input: Group cash by currency and bank; pool positions; MMF and deposits; CP outstanding; headroom vs policy minimum; exceptions and actions.
            decision: What to highlight — today, the counterparty breach (resolved) and the CP plan.
            who: "[Anna reads it at 10:45](/day/anna#monday-1045)."
            next: None.
            wf: [liquidity-planning]
          - time: "11:00"
            title: Invest surplus EUR
            kind: execution
            systems: [MMF portal, SAP]
            call: EUR 40m into two MMFs
            why: After funding needs and the CP repayment reserve, surplus EUR remains.
            input: Pool header after reserving EUR 50m for Thursday's CP repayment and a buffer; MMF counterparty limits; the [investment policy](term:investment-policy) (liquidity and credit quality first).
            decision: Split EUR 40m across two same-day-liquidity [money market funds](term:money-market-fund), keeping each within its limit.
            who: Cash manager executes; a second person approves.
            next: Positions reflected in tomorrow's dashboard. See [surplus cash investment](wf:surplus-cash-investment).
            wf: [surplus-cash-investment]
          - time: "15:00"
            title: Polish plant loan request
            kind: analysis
            systems: [In-house bank module, Excel, Tax memo]
            call: Recommend PLN 40m, 3 years, hedged with a cross-currency swap
            why: The Polish subsidiary needs PLN for a plant expansion; the in-house bank funds subsidiaries in local currency.
            input: Capex plan; subsidiary's forecast; tax's view on arm's-length interest ([transfer pricing](term:transfer-pricing)); Jonas's team's cross-currency swap pricing to hedge the 3-year PLN exposure back to CHF.
            decision: Recommends the loan; amount above her authority, so it goes to Anna.
            who: Polish finance manager; tax; Jonas's team.
            next: "[Anna approves Tuesday at 11:00](/day/anna#tuesday-1100). See [funding a subsidiary](wf:funding-subsidiary)."
            wf: [funding-subsidiary]
      - id: tuesday
        label: Tuesday 27 October
        intro: A quieter exception list, so the day goes to CP, month-end preparation and forecast quality.
        entries:
          - time: "07:30"
            title: Exceptions
            kind: check
            systems: [SAP treasury]
            call: 11 exceptions; Spain sweep fixed
            why: Daily routine.
            input: Exception list; Singapore handover.
            decision: None needs her.
            who: Cash managers.
            next: CP trades.
            wf: [daily-cash-positioning]
          - time: "09:00"
            title: Agree CP rollover
            kind: execution
            systems: ["Dealer phone/chat", "SAP (CP register)"]
            call: EUR 100m, 1 month, with two dealers
            why: Monday's decision; trades agreed two days before Thursday's settlement.
            input: Dealer bids.
            decision: Splits between two dealers at the better levels.
            who: CP dealers; Marta's back office confirms and settles.
            next: Thursday settlement.
          - time: "10:00"
            title: Daily liquidity call
            kind: meeting
            systems: [Teams]
            call: Month-end payment volume covered
            why: Coordination with the payment factory, which will release large month-end runs.
            input: Marta's payment factory schedule (month-end supplier and payroll runs by entity).
            decision: Pre-funds two non-pooled accounts for month-end payroll.
            who: Marta (Kraków); cash managers; Singapore.
            next: Transfers before cut-offs.
            wf: [payment-processing]
          - time: "11:30"
            title: Forecast accuracy — two outliers
            kind: review
            systems: [Forecasting tool, Excel]
            call: Call Brazil; haircut India's receipts
            why: The 4-week receipts forecast drives CP issuance and MMF placements. The accuracy target is ±10% by entity; two entities missed it for the third week.
            input: Forecast vs actual by entity and category (the tool stores each week's version); the entities' comments.
            decision: Brazil's miss is a timing issue around a large customer — she asks local finance for the customer-level detail. India has over-forecast receipts consistently; she applies a central haircut until the local team explains the pattern.
            who: Analyst prepares; Priya calls Brazil's finance manager; FP&A informed because the same entities feed their outlook.
            next: Haircut noted in Wednesday's forecast lock. See [cash forecasting](wf:cash-forecasting) and [variance analysis](term:variance-analysis).
            wf: [cash-forecasting]
          - time: "13:30"
            title: Month-end in-house bank preparation
            kind: recurring
            systems: [SAP in-house bank]
            call: November internal rates approved
            why: Subsidiaries hold current accounts and loans with the [in-house bank](term:in-house-bank) and receive statements and interest monthly; the rates must be arm's length for tax.
            input: Reference rates (€STR, SOFR, SARON and local rates); the transfer-pricing margins agreed with group tax.
            decision: Checks that the rate table the specialist prepared matches the reference rates and margins; approves it.
            who: In-house bank specialist; group tax for any new currency.
            next: In-house bank statements run on working day 1; accounting books interest.
          - time: "14:30"
            title: Counterparty exposure check
            kind: review
            systems: ["SAP treasury (limit report)", "Excel (the counterparty-limit report she maintains on top)"]
            call: All banks inside limits after Monday's move
            why: Monday's EUR 12m breach should now be cleared; month-end receipts could create new ones.
            input: Exposure per bank (balances, deposits, MMF holdings by fund, derivative mark-to-market from Jonas's team) against limits set by rating.
            decision: No action; she asks the cash managers to watch the non-core bank until the customer's payment instructions are changed.
            who: Cash managers.
            next: Figures go into the monthly report to Anna. See [counterparty limit](term:counterparty-limit).
          - time: "15:30"
            title: USD funding for US payroll
            kind: execution
            systems: [SAP treasury, US bank portal]
            call: Fund USD 25m from the USD pool header
            why: The US subsidiaries' payroll pays on Friday via the payroll provider, which collects the funds from the US payroll account before pay date. That account sits outside the USD pool.
            input: USD pool header balance; the payroll amount from the US payroll team; the US bank's cut-offs.
            decision: Move the funds today rather than Thursday. This week New York is only five hours behind Basel (Europe changed clocks on Sunday, the US changes on 1 November), which shifts the afternoon calls by an hour.
            who: A cash manager enters, a second approves; the US payroll team is told.
            next: Confirmed through the US bank's intraday report at the end of the European day.
            wf: [payment-processing]
          - time: "17:00"
            title: End of day — what's still open
            kind: check
            systems: [SAP treasury, Email]
            call: Handover to Singapore
            why: Singapore starts before Basel; open items must be in writing.
            input: Open exceptions; tomorrow's known large flows (CP settlement Thursday, month-end payment runs).
            decision: What Singapore must watch first thing (the Indian account minimum).
            who: Singapore regional treasury centre.
            next: Wednesday 07:30.
