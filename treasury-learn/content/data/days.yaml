            input: Last year's wallet-share table (who earned what from Helvetic).
            decision: Promises the German bank a place in Friday's FX quote round; no change to cash management.
            who: Bank RM.
            next: Notes in the bank relationship file. See [relationship banks](term:relationship-bank).
          - time: "13:30"
            title: TMS vendor demo
            kind: project
            systems: ["Vendor demo", "Requirements list (Excel)"]
            call: Shortlist stays at two
            why: The group is evaluating a TMS. Daniel has to show Thomas that it would remove real work (statement import, forecast collection, deal capture), not just move Excel into a browser.
            input: Helvetic's own requirements list with 60 items; a script of Helvetic's real Tuesday (statements, known flows, German funding) to make the vendor demo it live.
            decision: This vendor handles bank statements and positioning well but its forecasting module would still need Excel templates for subsidiaries. Stays on the shortlist.
            who: Vendor; Lea (first hour); Helvetic IT.
