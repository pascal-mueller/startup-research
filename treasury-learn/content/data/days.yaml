  # ---------------------------------------------------------------- DANIEL
  - id: daniel
    name: Daniel
    title: Treasury Manager
    company: helvetic
    page: /day/daniel
    rolePage: /org/roles-treasury-manager
    tier: midmarket
    oneLiner: Runs a two-person central treasury for a CHF 650m machine-tool group with 8 subsidiaries in 6 currencies. Does the analysis, makes most operational decisions, and escalates the material ones to the CFO.
    reportsTo: Thomas (CFO)
    team: Lea (Treasury Analyst). Works daily with Claudia (Group Accounting), Marco (FP&A), and subsidiary finance managers Giulia (Italy), Jens (Germany), Wei (China).
    treasuryShare: 100% (plus the TMS selection project)
    firstCheck: "Statement completeness in the connectivity tool, then the positioning workbook Lea has refreshed, then her proposal"
    systems: ["Multibank connectivity tool (EBICS/SWIFT)", "Excel positioning workbook", "Excel 13-week forecast", "SAP S/4HANA (CH, DE, CZ)", "Bank FX portals and phone dealing", "Bloomberg-lite market data in the bank portal"]
    decides: Intercompany funding and cash concentration, deposits, FX forward trades within the hedge policy, forecast overlays, which bank gets which business; escalates facility drawings, policy exceptions and anything above CHF 2m that is not routine.
    talksTo: [Lea, Thomas (CFO), Claudia (Group Accounting), Marco (FP&A), Giulia/Jens/Wei (subsidiary finance), 5 banks' relationship managers and FX dealers, TMS vendors, auditors]
    awake:
      - "**[Key-person risk](term:key-person-risk).** Two people run treasury for a CHF 650m group. If Lea is ill during Daniel's holiday, the CFO is the backup signatory and nobody else can build the position. It is why Daniel builds the position himself on Lea's days off and insists the workbook is documented."
      - "**A forecast that is precisely wrong.** The subsidiaries' templates look professional, but Italy has over-forecast receipts in most recent weeks. The 13-week view drives deposits, hedges and the CFO's confidence."
      - "**The 2028 bond.** CHF 100m must be refinanced; the [refinancing](term:refinancing-risk) window is in 2027. He wants the 18-month liquidity plan to be credible before the banks start asking."
      - "**China.** Cash in HM Suzhou cannot be swept; a dividend needs audited accounts, tax clearance and bank paperwork. It looks like group cash in the CFO's slide but cannot pay a Swiss bill next week ([trapped cash](term:trapped-cash))."
      - "**A missed cut-off on payroll day.** The German payroll is EUR 4.2m. A funding transfer entered after the cut-off means 1,000 people paid a day late."
    rhythm:
      - { when: "Wednesday", what: "Forecast consolidation finished with Lea; variance review; calls to subsidiaries whose numbers look off; decides overlays." }
      - { when: "Thursday", what: "Weekly treasury [jour fixe](term:jour-fixe) with Thomas (30 min): position, 13-week low point, hedges, RCF drawings, bank topics." }
      - { when: "Friday", what: "FX: tops up the EUR hedge layers if the ratio report shows a quarter below its band — asks 2–3 banks for forward quotes and deals on the phone or FX platform; confirmations matched by Lea." }
      - { when: "Month-end / WD1–5", what: "Intercompany loan interest calculated and sent to Group Accounting; month-end treasury report to Thomas (cash, debt, hedges, counterparty exposure, forecast accuracy)." }
      - { when: "Semi-annual (June, December)", what: "Covenant calculation (net debt / EBITDA ≤ 3.25x, interest cover ≥ 4x) with Claudia; compliance certificate to the RCF agent." }
      - { when: "Annual", what: "Hedging policy review with the audit committee; bank relationship review (wallet share vs RCF commitments); budget FX rates with Marco." }
    unusual:
      title: EUR/CHF drops 2.5% before lunch
      body: |
        On a Thursday in spring, EUR/CHF falls from about 0.935 to 0.912 between 09:00 and 11:30 on unexpected news. Thomas walks into the treasury office at 11:40: "How badly does this hit us, and should we hedge more now?"

        Daniel's first 30 minutes: he opens Lea's latest hedge-ratio report instead of a market screen. The next two quarters are 72% and 55% hedged at rates around 0.94–0.95, so most near-term EUR revenue is already locked. He asks Lea to rerun the unhedged EUR exposure at the new rate (the translation effect on EUR subsidiaries' equity is a separate, non-cash question for Claudia). The answer he gives Thomas at 12:30: roughly CHF 1.5–2m of lower margin over the next 12 months on the unhedged part, no liquidity problem, no covenant issue.

        His recommendation — and the judgment call — is **not** to buy more forwards in a panic at the new, worse rate; the policy band is met, and hedging after a move locks in the loss. Thomas agrees but asks for a board note. The workflow is [currency shock](wf:currency-shock); see also [FX hedging](wf:fx-hedging).
    days:
      - id: monday
        label: Monday 26 October
        intro: Lea starts at 07:30 and builds the position. Daniel starts at 08:00 with markets and mail, then reviews what she built and decides.
        entries:
          - time: "08:00"
            title: Markets, mail, bank messages
            kind: check
            systems: [Bank portal market data, Outlook]
            call: Nothing requires action
            why: Overnight news, rate moves and bank emails decide whether the day has a surprise in it.
            input: EUR/CHF around 0.935, USD/CHF around 0.80 (illustrative); an email from the global bank's KYC team; a note from Jens that the German supplier run was released a day early.
            decision: Forwards the KYC request to Lea; notes the German run for the position.
            who: None yet.
            next: Waits for Lea's position.
          - time: "08:50"
            title: Review Lea's position email
            kind: approval
            systems: [Excel positioning workbook]
            call: No transfers today; fund Germany Tuesday
            why: The daily position is the basis for every funding decision. Lea proposes; Daniel decides.
            input: "[Lea's 08:45 position](/day/lea#monday-0845): group cash CHF 45.6m after Friday's Swiss payroll; HM Deutschland will be short for Friday's payroll and must be funded by Thursday; HM AG holds about CHF 4m more CHF than it needs this week; the RCF's interest periods roll on the 15th."
            decision: Agrees with Lea's proposal to send the German top-up on Tuesday, once Monday's early supplier run has fully debited and the German account's need is final.
            who: Lea.
            next: RCF rollover decision (next row).
            wf: [daily-cash-positioning]
          - time: "09:05"
            title: "The 15 November RCF roll — repay part of the drawings?"
            kind: decision
            systems: [Excel positioning workbook, Excel 13-week forecast, RCF agent's portal]
            call: Let the drawings stand; look again at the 15 January roll
            why: The [RCF](term:rcf) is drawn CHF 30m + EUR 35m (about CHF 63m) after the 15 October roll, in interest periods that roll on the 15th of each month — there is no one-month tranche maturing on a Friday. With CHF rates around 0%, surplus CHF earns nothing on deposit, so the only use of surplus CHF is to reduce drawings at a rollover.
            input: HM AG's CHF surplus (about CHF 4m this week); the forecast's mid-December low point (December payrolls including the 13th salary, about CHF 18m against the CHF 10m group minimum); the RCF cost (SARON about 0% plus the 0.85% margin, minus the [commitment fee](term:commitment-fee) he would pay on the repaid amount); the three-business-day notice for a new drawing.
            decision: "[Repaying CHF 4m at the 15 November roll](why:day-rcf-keep-drawn) saves only the margin net of the commitment fee for four weeks — a few thousand francs — and the money would have to be redrawn before the December low point. He lets the drawings stand and pencils in a reduction for the 15 January roll, when the Q4 collections rebuild cash."
            who: Lea prepares the roll notice for the RCF agent bank; Daniel signs it (15 November is a Sunday, so the roll settles on the next business day).
            next: Mentioned at Thursday's jour fixe. See [credit facility management](wf:credit-facility-management).
            wf: [credit-facility-management]
          - time: "09:30"
            title: Q3 leverage estimate for the banks' call
            kind: analysis
            systems: ["Excel covenant model", "SAP (Q3 figures from Group Accounting)"]
            call: 1.36x vs the 3.25x limit; no concern
            why: The covenant is tested semi-annually — 30 June and 31 December — so 30 September is not a test date. But Thomas wants the quarter's direction before the Q3 results call with the banks, and the lenders will ask for leverage on the 30 September LTM figures.
            input: "Claudia's preliminary figures for the LTM to 30 September: EBITDA about CHF 78m (Marco's forecast EBITDA is for the outlook only — LTM actuals come from Group Accounting); gross debt about CHF 160m (CHF 100m bond plus the RCF's then-drawn CHF 35m + EUR 27m ≈ CHF 25m); cash about CHF 54m. Lea supplied the net-debt schedule."
            decision: "[160 − 54 = 106; 106 ÷ 78 ≈ 1.36x](why:day-covenant-ltm) against the 3.25x limit, interest cover far above 4x. October cash is down to CHF 41–46m and the 15 October roll raised the drawings to CHF 30m + EUR 35m, so a pro-forma on today's figures is about 1.5x — still comfortable, and the test that counts is at 31 December."
            who: "Claudia (Head of Group Accounting) computes the ratio; Lea supplies the net-debt schedule; Daniel reviews and presents to the banks."
            next: One line for Thursday's jour fixe. See [covenant monitoring](wf:covenant-monitoring).
            wf: [covenant-monitoring]
          - time: "10:30"
            title: Call with Wei about the Suzhou dividend
            kind: comms
            systems: [Teams, Excel liquidity plan]
            call: Target December payment; start paperwork now
            why: HM Suzhou has CNY cash the group would like to [repatriate](term:repatriation). Paying a dividend requires audited statutory accounts, tax filings and documents for the bank.
            input: Wei's timeline; the local auditor's sign-off date; [withholding tax](term:withholding-tax) estimate from the tax adviser.
            decision: Aim for a December payment; keep it out of the 13-week forecast until the bank confirms the documents are complete.
