    narrow_start: One-click shock scenario on existing exposure data.
    expansion: None on its own.
    startup_view: Value only as a by-product of good exposure data.
    ai_note_view: Agrees — fast, complete exposure picture plausible; autonomous trading in a disorderly market is not.

  - id: liquidity-crisis
    class: hard
    assignment: "Expected receivables didn't arrive — keep the company liquid for the next four weeks."
    headline: >-
      A crisis is when forecasts break, banks need reassurance, and every payment is a negotiated decision. An agent can
      run the daily 13-week update and payment prioritisation lists; the crisis management is human.
    scores: { frequency: 1, value: 5, judgment: 5, data_availability: 3, data_quality: 2, verifiability: 2, consequence: 5, regulatory: 4, trust: 5, automation: 1, human_involvement: 5, suitability: 2, narrow: 3, expand: 2, feedback: 1, defensibility: 2 }
    notes:
      frequency: Rare, but the event that makes forecasting matter.
      value: Existential.
      judgment: Which payments to delay, which lenders to call, what to tell employees.
      data_availability: Forecast and payment lists exist; the real information is conversations.
      data_quality: Degrades under stress.
      verifiability: Only survival.
      consequence: Insolvency, director liability.
      regulatory: Directors' duties (e.g. over-indebtedness rules), lender agreements.
      trust: Lenders and board deal with people.
      automation: None.
      human_involvement: Total.
      suitability: Daily cash update and prioritisation drafts.
      narrow: Daily-updated 13-week view in crisis mode.
      expand: Via cash-forecasting only.
      feedback: Too rare — a rare event leaves no correction signal to learn from.
      defensibility: Low.
    already_automated: No.
    agent_does: Daily forecast refresh, payment prioritisation lists, lender-report drafts.
    human_keeps: All prioritisation decisions and communication.
    narrow_start: Crisis-mode daily forecast.
    expansion: None beyond forecasting.
    startup_view: Restructuring advisers' territory.

# ------------------------------------------------------------------ Digital workers (spec 18)
# access: read = reads only · draft = creates drafts a human must release · none = explicitly no access
digital_workers:
  - id: dw-liquidity-recommendation
    path: /lens/dw-liquidity-recommendation
    title: Prepare today's liquidity recommendation
    workflow: daily-cash-positioning
    company: helvetic
    assignment: "Lea, by 09:00 tell me where we stand today and what you'd move — I'll approve before the Swiss bank's early-afternoon cut-off."
    assigned_by: Daniel (Treasury Manager)
    performed_today_by: Lea (Treasury Analyst), ~60–90 minutes every morning
    cadence: Every business day; deadline set by the earliest currency cut-off
    inputs:
      - { name: Prior-day statements (camt.053 / MT940) for 11 of the 12 accounts, source: Multibank connectivity tool, arrives: "Asian banks early, European 06:00–08:00, US last", quality: "Complete when the channels work; a missing statement here is a connectivity problem, never a time-zone one" }
      - { name: "HM Suzhou's balance (the twelfth account)", source: "Wei's daily emailed portal export — the Chinese bank has no EBICS/SWIFT corporate reporting", arrives: "Whenever Wei sends it; typed into the workbook by Lea", quality: "One human handoff, no file and no feed — the weakest input; when it is late, carry yesterday's balance flagged unconfirmed and chase Wei" }
      - { name: Intraday reports (camt.052 / MT942), source: Banks that provide them, arrives: Intraday, quality: Partial coverage }
      - { name: Released AP runs and payroll, source: SAP (CH/DE/CZ), emails from IT/FR/UK/US, arrives: Day before / same morning, quality: "Structured in SAP; email elsewhere" }
      - { name: Known flows not in any system, source: "Emails and Teams messages from Giulia, Jens, Wei", arrives: Any time, quality: Unstructured }
      - { name: Minimum balances, counterparty limits, cut-offs, source: Treasury policy + bank documentation, arrives: Static, quality: Good but rarely updated }
      - { name: Yesterday's position and the 13-week forecast, source: Excel, arrives: Static, quality: As good as the forecast }
    reasoning:
      - "Is every account's balance actually known — did Wei's export arrive, and is any other balance just yesterday's number?"
      - "Does each opening balance equal yesterday's closing balance? If not, which bank back-valued something?"
      - "Which movements were unexpected — and is each one a timing difference, a data problem, or something that could be fraud?"
      - "After today's known outflows, which account drops below its minimum (e.g. EUR 250k in Germany)?"
      - "Is the CHF at the parent really surplus — the December payrolls (13th salary) make week 4 the low point and the CFO's CHF 10m minimum sits here — or can it reduce the CHF 30m RCF drawing at the 15 January rollover, since CHF deposits earn ~0%?"
      - "Fund Germany by moving EUR from the parent (intercompany loan) or by converting CHF? Which is cheaper and which is cleaner for accounting?"
      - "What must go first because of cut-off times — and which payment rail actually settles today (urgent EUR via T2, not SEPA)?"
      - "Is anything still unexplained at cut-off — move cash anyway for safety, or wait?"
    tools:
      - { name: Multibank connectivity tool, access: read, use: Statements and intraday reports }
      - { name: SAP S/4HANA, access: read, use: Released payment runs, open items, intercompany balances }
      - { name: Treasury mailbox and Teams channel, access: read, use: Known flows and explanations from subsidiaries }
      - { name: Positioning workbook / light TMS, access: draft, use: Writes the day's position and proposed transfers }
      - { name: Bank portals / EBICS signature app, access: none, use: Transfers are entered and released by humans (four-eyes) }
    output: >-
      A one-page morning note: group position by entity and currency (CHF equivalent), missing statements, the 3–7
      movements that need an explanation (each with the agent's best explanation and its evidence), and a numbered list
      of proposed transfers with amount, from/to account, value date, cut-off, reason and policy check (minimum balance,
      counterparty limit). Plus a short "what I am not sure about" list.
    verification:
      - { check: Opening balances tie to yesterday's closing, how: "Automatic — any gap blocks the note and names the bank" }
      - { check: Each proposed transfer leaves every account above minimum and every bank within limit, how: Deterministic policy check shown next to each line }
      - { check: Explanations are grounded, how: "Each explanation links to the statement line, remittance text or email it is based on; the manager spot-checks" }
      - { check: Proposals are sensible, how: "Daniel accepts, edits or rejects each line — the core expert judgment" }
      - { check: Projection was right, how: "Next morning, projected vs actual closing balance per account is scored automatically" }
    execution: >-
      Lea prepares (or the agent drafts) the transfers and enters them; Daniel releases them under the four-eyes
      principle — payments above CHF 2m additionally need the CFO's and the CEO's co-signature. The agent never holds
      signing rights. Intercompany loan records go to Claudia's accounting team.
    feedback:
      - { signal: "Accept / edit / reject per proposed transfer, with Daniel's one-line reason", becomes: "Labelled preference data: which buffer, which funding route, which timing" }
      - { signal: Edited explanations of unexpected movements, becomes: Evaluation set for explanation accuracy; recurring patterns become rules }
      - { signal: Projected vs actual closing balances, becomes: Objective daily accuracy metric per account }
      - { signal: Missed items that surfaced later, becomes: "Regression tests — 'the German trade-tax prepayment must never be missed again'" }
    failure_modes:
      - { mode: Stale balance treated as current (Wei's export has not arrived and yesterday's figure is carried over silently), guardrail: "Every balance carries its as-of time and its source (tool vs email); the export is chased with Wei, and a carried-over figure is visibly flagged unconfirmed" }
      - { mode: Plausible but invented explanation for a debit, guardrail: "No explanation without cited evidence; otherwise 'unexplained' — unexplained large debits escalate as possible fraud" }
      - { mode: Arithmetic or FX conversion error, guardrail: "All numbers computed by deterministic code; the language model only selects and explains" }
      - { mode: Automation bias — manager approves without reading, guardrail: "Approval rate and edit rate monitored; deliberate test items seeded occasionally" }
      - { mode: Prompt injection via an email or remittance text, guardrail: "Inputs treated as data; no write access to banks; proposals only" }
      - { mode: "System down at 08:00, or the bank changed its file (the 2009 camt.05x versions are discontinued in Nov 2026)", guardrail: "Degraded mode: yesterday's position clearly labelled stale, no proposals issued until inputs are back; parser changes tested against stored file samples first" }
    autonomy:
      - { level: 1, label: Briefing, scope: "Read-only position, missing statements, exception list", gate: "Two weeks of daily comparison with Lea's own position" }
      - { level: 2, label: Explanations, scope: "Draft explanations with evidence for unexpected movements", gate: "Explanation accuracy above an agreed threshold on the labelled set" }
      - { level: 3, label: Proposals, scope: "Proposed transfers with policy checks", gate: "Daniel accepts most proposals unedited over a quarter" }
      - { level: 4, label: Pre-filled transfers, scope: "Drafts in the portal awaiting two human signatures", gate: "Internal-control owner and auditors agree the control design" }
    metrics:
      - Time from last statement arrival to note ready
      - Share of proposals accepted without edit
      - Projected vs actual closing balance error by account
      - Unexplained items escalated vs later found material

  - id: dw-forecast-variance
    path: /lens/dw-forecast-variance
    title: Explain last week's forecast variances
    workflow: cash-forecasting
    company: helvetic
    assignment: "Lea, before Wednesday's call: why was last week CHF 3.6m worse than forecast, and what does it change in the next 12 weeks?"
    assigned_by: Daniel (Treasury Manager)
    performed_today_by: Lea (Treasury Analyst), half a day to a day per week
    cadence: Weekly (Monday–Wednesday)
    inputs:
      - { name: Last week's forecast by entity and category, source: Forecast workbook versions, arrives: Stored, quality: Good if versions are kept }
      - { name: Bank actuals by transaction, source: camt.053 / MT940 statements, arrives: Daily, quality: "Complete; categorisation is the problem" }
      - { name: AR/AP open items and cleared items, source: "SAP + local ERPs", arrives: On export, quality: Mixed across ERPs }
      - { name: Subsidiary submissions and their comments, source: Excel templates by email, arrives: Tuesday noon (France late), quality: "Copied, optimistic, missing lumpy items" }
      - { name: Emails with credit control and local finance, source: Mailbox, arrives: Any time, quality: Unstructured }
    reasoning:
      - "Which variances are big enough to matter — relative to the entity and to headroom?"
      - "Timing (the money still comes) or permanent (it won't)? What is the evidence?"
      - "Was the input wrong (subsidiary forecast), or did the world change (customer paid late)?"
      - "Is this a pattern — Italy over-forecast receipts in 8 of the last 10 weeks — that justifies a haircut?"
      - "Which lumpy items were missing (tax prepayments, bonuses) and how do I stop that recurring?"
      - "Does anything change the low point, the headroom, or an action already planned?"
    tools:
      - { name: Forecast workbook / forecasting tool, access: draft, use: Reads versions, writes variance table and draft adjustments }
      - { name: Bank statements, access: read, use: Actuals by transaction }
      - { name: ERP reports, access: read, use: Cleared and open items to identify which invoices were paid }
      - { name: Mailbox, access: draft, use: Drafts questions to subsidiaries; the analyst sends }
    output: >-
      A variance table by entity × category (forecast, actual, variance, timing/permanent, reason, evidence link,
      confidence), draft questions to subsidiary finance for unexplained lines, proposed adjustments to future weeks,
      and a 5-line commentary for the CFO note.
    verification:
      - { check: Actuals tie to bank statements, how: Automatic reconciliation of category totals to statement totals }
      - { check: Reasons are supported, how: "Each reason links to the invoice, statement line or email; Daniel marks right / wrong / partly" }
      - { check: Timing classification, how: "Scored automatically in later weeks — did the 'timing' money actually arrive?" }
      - { check: Proposed adjustments, how: Accepted or edited by Daniel; later scored by next weeks' actuals }
    execution: >-
      Nothing is executed. Daniel decides overrides and actions; Lea sends questions to subsidiaries (the agent drafts
      them). The forecast update itself is a draft until Daniel signs it off.
    feedback:
      - { signal: "Right / wrong / partly on each variance reason", becomes: Evaluation set for explanation quality }
      - { signal: "Whether 'timing' variances arrived within 4 weeks", becomes: "Objective label, no human needed" }
      - { signal: Daniel's overrides and haircuts, becomes: Entity-level bias corrections learned over time }
      - { signal: Forecast accuracy by entity/category over months, becomes: "The headline metric — does the forecast improve?" }
    failure_modes:
      - { mode: Confident but wrong reason (hallucinated customer delay), guardrail: "Evidence link required; otherwise 'unexplained'" }
      - { mode: Over-fitting to one week, guardrail: "Haircuts proposed only on multi-week patterns with the history shown" }
      - { mode: Subsidiaries feel audited by a bot, guardrail: "Questions go out under Lea's name, reviewed, specific and few" }
      - { mode: Miscategorised actuals, guardrail: "Categorisation rules are explicit, versioned, and corrections update them" }
    autonomy:
      - { level: 1, label: Variance table, scope: "Numbers only, reconciled to statements", gate: "Ties out every week for a month" }
      - { level: 2, label: Reasons, scope: "Timing/permanent classification with evidence", gate: "Reason accuracy judged by Daniel" }
      - { level: 3, label: Adjustments, scope: "Proposed changes to future weeks", gate: "Improves accuracy vs Lea's baseline over a quarter" }
      - { level: 4, label: Submission QA and chasing, scope: "Checks subsidiary submissions, drafts chasers", gate: "Subsidiary finance accept the process" }
    metrics:
      - Forecast error by entity/category at 1-, 4- and 13-week horizons
      - Share of variance explained with evidence
      - Hours of analyst time per weekly cycle

  - id: dw-exposure-collection
    path: /lens/dw-exposure-collection
    title: Collect and reconcile this month's FX exposures
    workflow: fx-exposure-management
    company: helvetic
    assignment: "Submissions by WD5 noon — and the clean group exposure report on my desk for the WD7 review: what's open, what's hedged, what changed and why."
    assigned_by: Daniel (Treasury Manager), who decides hedges with the CFO
    performed_today_by: Lea (Treasury Analyst), roughly WD2–WD6 of each month
    cadence: "Monthly after close (collection window WD2–WD6, report for the WD7 review), plus mid-month updates for large orders"
    inputs:
      - { name: Balance-sheet exposures (receivables, payables, cash in foreign currency), source: "SAP (CH/DE/CZ) and local ERPs", arrives: After local close, quality: "Structured, but different ERPs and account mappings" }
      - { name: Forecast exposures (next 12 months EUR/USD/CNY/GBP sales and purchases), source: Subsidiary templates, arrives: "WD5 noon deadline (window WD2–WD6)", quality: "Optimistic, stale, sometimes in the wrong currency" }
      - { name: Hedge book (forwards), source: Treasury deal register / bank confirmations, arrives: Static + new deals, quality: Good }
      - { name: Intercompany balances, source: ERPs, arrives: After close, quality: Often mismatched between entities }
      - { name: Hedging policy (ratios by horizon), source: Policy document, arrives: Static, quality: Clear }
    reasoning:
      - "Do the balance-sheet exposures agree with the ledgers — or did someone tag a EUR invoice as CHF?"
      - "Why did Italy's 6-month EUR forecast drop 30% — lost order or template error?"
      - "Do intercompany balances match on both sides, so they net out at group level?"
      - "What is the net exposure after natural offsets (EUR costs in DE/CZ against EUR sales)?"
      - "Where are we versus the policy corridor per rolling quarter — and if we are outside it, is it a passive drift that a roll fixes, or a new hedge decision?"
    tools:
      - { name: ERPs, access: read, use: Open items by currency }
      - { name: Subsidiary templates via email or portal, access: draft, use: Reads submissions; drafts chasers and questions }
      - { name: Deal register, access: read, use: Hedge coverage }
      - { name: Exposure workbook, access: draft, use: Writes the consolidated exposure report }
      - { name: FX dealing platform / bank, access: none, use: Trades stay human }
    output: >-
      Group exposure report by currency and horizon (balance-sheet and forecast), hedge coverage versus policy corridor,
      list of anomalies with proposed corrections, reconciliation of intercompany, and a draft "trades to reach policy"
      list for Daniel's decision.
    verification:
      - { check: Balance-sheet exposures tie to ledgers, how: Automatic reconciliation per entity and currency }
      - { check: Anomalies are real, how: Daniel/local finance confirm or reject each flag }
      - { check: Forecast exposures were realistic, how: "Compared with invoiced flows in later months (objective, delayed)" }
      - { check: Hedge proposals are policy-compliant, how: Deterministic check against policy corridors }
    execution: >-
      Daniel decides trades (with the CFO for anything outside policy) and deals within his mandate on the bank
      platform; Lea matches the confirmations and keeps the hedge register — Helvetic has no back office. The agent has
      no dealing access.
    feedback:
      - { signal: Confirmed / rejected anomaly flags, becomes: Precision of anomaly detection }
      - { signal: Corrections by local finance, becomes: "Entity-specific mapping rules (e.g. Czech entity invoices EUR from a CZK ledger)" }
      - { signal: Forecast exposure vs realised invoicing, becomes: Entity bias estimates feeding hedge ratios }
    failure_modes:
      - { mode: Clean-looking report on wrong inputs, guardrail: "Report shows which entities were reconciled and which were accepted as submitted" }
      - { mode: Double counting intercompany, guardrail: Intercompany matched before consolidation; mismatches block the total }
      - { mode: Hedge proposal treated as decision, guardrail: "Labelled as draft; requires a named approver; no execution rights" }
    autonomy:
      - { level: 1, label: Reconciliation, scope: "Balance-sheet exposures vs ledgers", gate: "Ties out for three month-ends" }
      - { level: 2, label: Forecast QA and chasing, scope: "Flags and questions on submissions", gate: "Local finance accept the questions" }
      - { level: 3, label: Hedge gap proposals, scope: "Draft trades or rolls back to the policy corridor", gate: "Daniel accepts most unedited" }
    metrics:
      - Days after close until exposure report is ready
      - Reconciliation breaks found before vs after hedging
      - Forecast exposure accuracy by entity

  - id: dw-bank-fee-review
    path: /lens/dw-bank-fee-review
    title: Review last quarter's bank fees
    workflow: bank-fee-analysis
    company: helvetic
    assignment: "Check what our five banks charged us against what we agreed — including what never shows on a fee statement — and draft the emails for anything wrong."
    assigned_by: Daniel (Treasury Manager)
    performed_today_by: "Lea (Treasury Analyst) — about four days each January; the review feeds Daniel's annual wallet review"
    cadence: "Annual in January at mid-market; the modelled system runs the price check on every statement instead, so a mispricing does not wait for next January"
    inputs:
      - { name: Fee charges, source: "Bank statements (charge lines), PDF fee invoices, EDI 822 / account analysis from the US bank", arrives: Monthly, quality: Non-standard descriptions per bank }
      - { name: Agreed pricing, source: "Price schedules, emails, RCF side letters", arrives: Static, quality: Scattered; sometimes only in email }
      - { name: Volumes, source: Payment and account data, arrives: Monthly, quality: Good }
      - { name: Ancillary business by bank (FX, deposits, RCF share), source: Treasury deal records, arrives: Static, quality: Good }
    reasoning:
      - "Is each charge the agreed price for that service, or list price because nobody loaded the deal?"
      - "Are we paying for accounts we closed in 2024, or services we don't use?"
      - "What did we pay inside the FX spread and the receipt deductions — the costs that appear on no fee statement?"
      - "Which bank is expensive relative to the business we give it — and is that worth a fight given it's in our RCF?"
    tools:
      - { name: Statements and fee PDFs, access: read, use: Extract charges }
      - { name: Price schedules and emails, access: read, use: Agreed prices }
      - { name: Mailbox, access: draft, use: Dispute email drafts }
    output: >-
      A fee table by bank × service (volume, charged, agreed, difference), a list of disputed items with evidence, draft
      emails to each bank's relationship manager, and a one-page wallet-share view (fees paid vs ancillary business given).
    verification:
      - { check: Extraction is complete, how: "Totals tie to the charge lines on statements" }
      - { check: Price mapping is right, how: "Daniel reviews the mapping table once per bank; afterwards mostly stable" }
      - { check: Disputes are justified, how: "Bank responses (credit given or explanation) label each dispute" }
    execution: Daniel sends (or softens) the emails; the relationship manager at each bank responds.
    feedback:
      - { signal: Bank credits vs rejections, becomes: Precision of dispute identification }
      - { signal: Daniel's edits to tone and to which items to pursue, becomes: Relationship-aware prioritisation }
    failure_modes:
      - { mode: Wrong service mapping, guardrail: Mapping table visible and approved per bank }
      - { mode: Only explicit fees checked — FX spreads and receipt deductions missed, guardrail: "Every review includes executed rates vs mid at trade time and receipts net of deductions; the wallet page shows the split" }
      - { mode: Aggressive disputes damaging relationship banks, guardrail: "Drafts only; human sends; relationship context shown next to each bank" }
    autonomy:
      - { level: 1, label: Fee table, scope: "Extraction and mapping", gate: "Ties to statements" }
      - { level: 2, label: Disputes, scope: "Draft disputes", gate: "Bank acceptance rate" }
      - { level: 3, label: Relationship view, scope: "Wallet-share and RFP prep", gate: "Used in the annual bank review" }
    metrics:
      - Overcharges identified and recovered per year
      - Hours per review
