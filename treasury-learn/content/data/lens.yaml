    notes:
      frequency: Rare (2015 SNB floor removal is the Swiss reference case).
      value: Material.
      judgment: Whether to hedge now, revise pricing, communicate.
      data_availability: If the exposure process works, yes.
      data_quality: Depends on exposure management.
      verifiability: Calculations checkable; decisions not.
      consequence: Large P&L and covenant effects.
      regulatory: Disclosure for listed companies.
      trust: Board and CFO.
      automation: Scenario tools in TMS.
      human_involvement: Intense for days.
      suitability: Impact calculation and briefing only.
