      defensibility: Low.
    already_automated: Scenario functions exist in TMS and risk systems.
    agent_does: Recomputes exposures, P&L and covenant impact, drafts the CFO briefing.
    human_keeps: All decisions.
    narrow_start: One-click shock scenario on existing exposure data.
    expansion: None on its own.
    startup_view: Value only as a by-product of good exposure data.

