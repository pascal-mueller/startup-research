# Systems & Data — structured data used by <StackDiagram/>, <CompanyStacks/>, <SystemsTable/>, <VendorProfiles/>.
# Owner: systems stream. Product facts: only what is supported by a registered source or is long-established;
# every product carries `checked` saying how current the description is.

# ---------------------------------------------------------------- stack layers (top = decisions, bottom = data sources)
layers:
  - id: decide
    name: Decide & report
    note: Where people look at the numbers and decide.
    boxes:
      - id: reporting
        name: Reports & decision packs
        detail: Daily cash report, 13-week forecast pack, covenant and board liquidity reports. Usually Excel/PowerPoint, sometimes BI (Power BI, Tableau) on top of TMS data.
        href: /systems/spreadsheets
  - id: treasury
    name: Treasury workflow
    note: The layer that combines everything below into positions, forecasts, deals and exposures.
    boxes:
      - id: tms
        name: TMS or cash tool
        detail: Cash position, forecast, deals (FX, money market, debt), in-house bank, bank account register, accounting postings. Below mid-market this box is a spreadsheet.
        href: /systems/tms
      - id: excel
        name: Spreadsheets
        detail: Present at every size — as the whole treasury system at small companies, as the glue and the judgment layer at large ones.
        href: /systems/spreadsheets
  - id: execution
    name: Execution
    note: Where money and deals actually get committed.
    boxes:
      - id: payhub
        name: Payment generation & approval
        detail: ERP payment run, TMS payment module or payment hub/factory; format generation (pain.001), approval workflow, sanctions screening.
        href: /systems/bank-connectivity
      - id: trading
        name: Dealing
        detail: FX and money-market trades by phone/chat with the bank, bank FX portal, or a multi-dealer platform (e.g. 360T, FXall, Bloomberg FXGO).
        href: /systems/market-data
  - id: connectivity
    name: Bank connectivity
    note: The pipes. Files and messages in both directions.
    boxes:
      - id: channels
        name: Portals · EBICS · Swift · host-to-host · APIs
        detail: Outbound payment files; inbound statements (camt.053/MT940), intraday reports (camt.052/MT942), status reports (pain.002) and notifications (camt.054).
        href: /systems/bank-connectivity
  - id: sources
    name: Data sources
    note: Treasury owns almost none of these.
    boxes:
      - id: erp
        name: ERP
        detail: AP and AR open items, payment runs, GL, vendor master data, intercompany balances. Owned by accounting / finance systems.
        href: /systems/erp
      - id: banks
        name: Banks
        detail: Balances, transactions, payment execution and status, fees, facility and deal confirmations.
        href: /systems/bank-connectivity
      - id: market
        name: Market data
        detail: FX spot and forward rates, interest-rate curves and fixings (SARON, €STR, SOFR, Euribor), credit spreads.
        href: /systems/market-data
      - id: bu
        name: Business units & FP&A
        detail: Forecast submissions, budgets, capex plans, big deals and one-offs — mostly by email and Excel template.
        href: /systems/data-quality

