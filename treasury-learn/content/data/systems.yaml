# ---------------------------------------------------------------- categories
categories:
  - id: erp
    name: ERP (with or without treasury modules)
    what: The accounting system of record. Some ERPs include treasury modules (SAP, Oracle, Dynamics 365 Finance); many companies use only its AP/AR/GL and payment-run functions.
    sizes: [startup, sme, midmarket, multinational]
  - id: tms-enterprise
    name: Enterprise TMS / TRMS
    what: Full treasury and risk management system — cash, forecasting, deal management and valuation, hedge accounting, in-house bank, payments, bank account management, accounting.
    sizes: [midmarket, multinational]
  - id: cash-platform
    name: Cloud cash-management / treasury platform
    what: Newer SaaS platforms built around bank connectivity, cash visibility, forecasting and payments, typically for SMEs to mid-market; several are adding deal management and TMS depth.
    sizes: [sme, midmarket]
  - id: connectivity
    name: Bank connectivity / payment hub
    what: Software or service that runs the file and message exchange with banks (EBICS, Swift, host-to-host, APIs), format conversion and payment approval — standalone, as a Swift service bureau, or embedded in ERP/TMS.
    sizes: [midmarket, multinational]
  - id: market-data
    name: Market data & dealing
    what: Rates and prices for valuation and decisions; platforms to execute FX and money-market trades.
    sizes: [midmarket, multinational]

# ---------------------------------------------------------------- products
# checked: how the description was verified. "search" = vendor/publisher page found via web search in Sept 2026
# (page text seen as search snippet, not opened in full). "knowledge" = long-established facts from the author's
# background knowledge, NOT re-verified in Sept 2026 — check the vendor site before relying on details.
products:
  - id: sap
    name: SAP S/4HANA — Cash Management, Treasury and Risk Management; SAP Multi-Bank Connectivity
    vendor: SAP
    category: erp
    segment: Mid-market to largest multinationals already on SAP
    current: "SAP ERP 6.0 (ECC) mainstream maintenance ends 31 Dec 2027 (optional extended maintenance to 2030), so many groups are in S/4HANA migrations that also reopen the treasury-system question[](cite:sap-ecc-maintenance). SAP Multi-Bank Connectivity (MBC) is SAP's managed cloud gateway to banks with embedded EBICS and Swift and support for SFTP/host-to-host and APIs[](cite:sap-mbc)."
    why: The treasury tools live in the same system as AP, AR and the GL, so bank statements post and payment runs originate without an interface. Large SAP shops (like GlobalChem) often use SAP itself as the TMS.
    flows: "In: bank statements (camt.053/MT940) into electronic bank-statement processing with posting rules; market data feed; deals entered by treasury. Out: pain.001 from payment runs (F110) and treasury payments — approved and released inside SAP through Bank Communication Management / FSCM payment approval before reaching MBC or the bank; GL postings for deals, hedge accounting, in-house-bank positions."
    users: Treasury front/back office, accounting (statement posting, reconciliation), AP (payment runs), a treasury-systems team or SAP consultants for configuration.
    not: "Does not make SAP easier to change: configuration (posting rules, liquidity items, bank formats) usually needs SAP specialists. Subsidiaries on non-SAP ERPs still have to be connected. Forecasting from business units remains a data-collection problem."
    sizes: [midmarket, multinational]
    companies: [helvetic, globalchem]
    sources: [sap-mbc, sap-ecc-maintenance]
    checked: search
  - id: oracle
    name: Oracle Fusion Cloud (Cash Management) / Oracle E-Business Suite
    vendor: Oracle
    category: erp
    segment: Mid-market to large groups on Oracle ERP; NetSuite (also Oracle) for startups and scale-ups
    current: Not re-verified in this session. Oracle's treasury-relevant functions in its cloud ERP centre on cash management (bank statement processing, reconciliation, cash positioning and forecasting); many Oracle customers run a separate TMS for deals and risk.
    why: Same argument as SAP — bank statements, AP and AR in one ledger.
    flows: "In: bank statements for reconciliation. Out: payment files from Payables; cash-position and forecast views from ledger and subledger data."
    users: Accounting and AP/AR teams; treasury where no TMS exists.
    not: Deal management, hedge accounting and in-house banking for complex groups are typically handled in a dedicated TMS (verify scope per version).
    sizes: [midmarket, multinational]
    companies: []
    sources: []
    checked: knowledge
  - id: dynamics
    name: Microsoft Dynamics 365 Finance / Dynamics 365 Business Central
    vendor: Microsoft
    category: erp
    segment: "Business Central: SMEs (like Alpine); Finance: mid-market and larger"
    current: Not re-verified in this session. Both include bank-account management, bank statement import and reconciliation, vendor payment files and a cash-flow forecast view; country payment formats often come from local partner extensions.
    why: The SME's accounting system already knows every open invoice; paying suppliers and reconciling the bank from it removes double entry.
    flows: "In: bank statement files (camt.053 or bank-specific) for reconciliation. Out: payment files (pain.001) for upload to the bank via portal or EBICS client."
    users: Accountants, AP clerk, head of accounting (Petra at Alpine); an implementation partner for formats and setup.
    not: No treasury deal management, hedge register or multi-bank connectivity of its own at SME level — those stay in bank portals and Excel.
    sizes: [sme, midmarket]
    companies: [alpine]
    sources: []
    checked: knowledge
  - id: kyriba
    name: Kyriba
    vendor: Kyriba (majority-owned by Bridgepoint since 2019; General Atlantic minority stake 2024)
    category: tms-enterprise
    segment: Mid-market to large multinationals; strong in bank connectivity and payments
    current: "Bridgepoint took majority control in 2019; General Atlantic bought a minority stake in late 2024 at a reported valuation above USD 3bn[](cite:kyriba-ga-2024). In April 2026 Kyriba announced agentic-AI features ('TAI'), a Circle USDC settlement integration and direct access to J.P. Morgan money-market funds from within the platform[](cite:kyriba-live-2026) — announcements, not evidence of adoption."
    why: SaaS TMS that combines cash positioning, forecasting, payments (incl. a payment hub), bank connectivity and FX risk in one platform, without on-premise infrastructure.
    flows: "In: bank statements via its own connectivity (Swift, EBICS, host-to-host, APIs); ERP AP/AR data; market data. Out: payments to banks; accounting entries back to the ERP."
    users: Treasury team, payments/back office, and usually a named internal system owner.
    not: Does not fix ERP data quality or late subsidiary forecasts; each bank connection still needs bank-side onboarding; implementation effort scales with the number of banks, entities and ERPs.
    sizes: [midmarket, multinational]
    companies: []
    sources: [kyriba-ga-2024, kyriba-live-2026]
    checked: search
  - id: fis
    name: FIS Treasury and Risk Manager (Quantum Edition, Quantum Cloud Edition, Integrity Edition)
    vendor: FIS
    category: tms-enterprise
    segment: "Quantum: large and complex treasuries (deep deal management and risk); Integrity: SaaS for mid-market"
    current: "FIS launched Treasury and Risk Manager – Quantum Cloud Edition on 29 April 2025 (public cloud); classic Quantum remains available. FIS states the suite serves more than 1,000 organisations[](cite:fis-quantum-cloud-2025)."
    why: Long-established TRMS for companies with heavy deal volumes, debt portfolios, derivatives and hedge accounting.
    flows: "In: deals, market data, bank statements, ERP exposures. Out: settlements and confirmations, valuations, hedge-accounting and GL entries."
    users: Front, middle and back office in larger treasuries; a TMS administrator or treasury-systems team.
    not: A deep TRMS is heavy to run for a two-person treasury; forecasting quality still depends on business inputs.
    sizes: [midmarket, multinational]
    companies: []
    sources: [fis-quantum-cloud-2025]
    checked: search
  - id: ripple-treasury
    name: Ripple Treasury (formerly GTreasury)
    vendor: Ripple (acquired GTreasury, announced 16 Oct 2025)
    category: tms-enterprise
    segment: Mid-market to large companies
    current: "Ripple announced the USD 1bn acquisition of GTreasury on 16 October 2025[](cite:ripple-gtreasury-2025); the product was rebranded Ripple Treasury in January 2026[](cite:ripple-treasury-rebrand). In January 2026 it also acquired Solvexia (reconciliation and regulatory-reporting automation)[](cite:gtreasury-solvexia-2026). The owner's stated strategy adds digital-asset capabilities — expect some interviewees to ask what this means for a conventional TMS."
    why: SaaS TMS covering cash positioning, forecasting, payments, debt and investments, FX exposure and hedge accounting.
    flows: "In: bank data, ERP data, deals, market data. Out: payments, accounting entries, risk and hedge reports."
    users: Treasury team, back office, system administrator.
    not: Same as any TMS — connectivity onboarding per bank, business-unit forecast quality and policy judgment remain the company's problem.
    sizes: [midmarket, multinational]
    companies: []
    sources: [ripple-gtreasury-2025, ripple-treasury-rebrand, gtreasury-solvexia-2026]
    checked: search
  - id: ion
    name: ION Treasury (Wallstreet Suite, Reval, IT2, Openlink, City Financials, Treasura, ITS)
    vendor: ION Group
    category: tms-enterprise
    segment: "Several products for different segments — e.g. Wallstreet Suite for the largest and most complex treasuries, Openlink for commodity-intensive companies, City Financials for Central European companies, Reval as SaaS"
    current: "ION's treasury portfolio is a collection of acquired systems that remain separate products[](cite:ion-treasury). When a treasurer says 'we run ION', ask which one."
    why: Covers everything from mid-market SaaS to complex multi-asset treasuries (and commodity trading).
    flows: "In: deals, market data, bank statements, exposures. Out: payments and settlements, valuations, accounting."
    users: Treasury front/middle/back office; systems team.
    not: Product choice inside the portfolio matters more than the brand; long-lived installations often carry customisations that make upgrades projects in their own right.
    sizes: [midmarket, multinational]
    companies: []
    sources: [ion-treasury]
    checked: search
  - id: coupa-treasury
    name: Coupa Treasury (formerly BELLIN)
    vendor: Coupa
    category: tms-enterprise
    segment: Mid-market to large, strong in DACH (BELLIN was German)
    current: "Coupa acquired the German TMS vendor BELLIN in 2020 and positions it as Coupa Treasury within its spend-management platform[](cite:coupa-bellin-2020). Later ownership changes at Coupa were not re-verified in this session."
    why: Cash management, forecasting, payments and bank connectivity, with ties to Coupa's procure-to-pay suite.
