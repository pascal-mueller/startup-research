    sizes: [midmarket, multinational]
    companies: []
    sources: [coupa-bellin-2020]
    checked: search
  - id: trovata
    name: Trovata
    vendor: Trovata (US; bank-backed investors)
    category: cash-platform
    segment: US-centric mid-market and larger companies; distributed partly through banks
    current: "In July 2025 Trovata acquired ATOM, the TMS built by Financial Sciences, to add in-house banking, intercompany netting, FX hedging and bank fee analysis to its API-based cash-visibility and forecasting platform, and extended its Series B with USD 9m from PNC and State Street[](cite:trovata-atom-2025)."
