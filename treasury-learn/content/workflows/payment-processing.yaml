related: [large-payment-approval, bank-reconciliation, daily-cash-positioning, fraud-investigation, bank-account-management]
sources: [six-sps-ig-ct-2026, six-address-factsheet, epc-vop-bulk-faq, swift-eoc-2025, afp-pfc-2026-highlights, pwc-gts-2025, six-ebics]
evidence_note: >-
  The invoice-to-payment sequence and its controls are established practice described in ERP documentation and AP
  training material; the timings, volumes and example are illustrative synthesis consistent with the reference
  companies. Format facts are from SIX (Swiss Payment Standards, November 2026 address and message-version change[](cite:six-address-factsheet)),
  the EPC (VoP bulk opt-out[](cite:epc-vop-bulk-faq)) and Swift (end of MT/MX coexistence for interbank payment
  instructions on 22 November 2025[](cite:swift-eoc-2025)); Swiss banks set the migration to EBICS 3.0 for November 2026[](cite:six-ebics).
  Fraud prevalence figures are from AFP's US-centric survey and should not be read as Swiss rates.
