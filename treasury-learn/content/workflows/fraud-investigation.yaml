evidence_note: >-
  Prevalence: 76% of AFP's mainly US respondents experienced attempted or actual payments fraud in 2025 and 74% were
  affected by BEC[](cite:afp-pfc-2026); in the 2025 edition vendor-imposter fraud rose to 45%[](cite:afp-pfc-2025). Recovery is
  poor: AFP's 2026 release reports that only 30% of organisations recovered 75% or more of lost funds[](cite:afp-pfc-2026).
  Speed matters: the FBI's IC3 Recovery Asset Team placed holds on 71% of potential losses in the 2023 incidents it acted
  on — mostly quickly reported US BEC wires, not a general recovery rate[](cite:ic3-2023-rat). Swiss reports of CEO fraud
  to the federal cyber office rose from 719 (2024) to 971 (2025), with AI-generated voices mentioned[](cite:bacs-ceo-fraud-2026).
  Deepfakes are real: Arup confirmed that an employee in Hong Kong transferred HK$200m (about US$25m) after a video call
  with deepfaked colleagues in early 2024[](cite:cnn-arup-deepfake-2024). Recall mechanics: Swift gpi Stop and Recall[](cite:swift-stop-recall);
  EU payee verification since Oct 2025 with a bulk-file opt-out[](cite:ecb-ipr,kpmg-vop-2025). The step sequence
  reflects established incident-response practice; the Helvetic example, insurance terms and timings are illustrative
  synthesis. Legal points (whether paying a fraudster discharges the debt, freezing powers) vary by jurisdiction.
