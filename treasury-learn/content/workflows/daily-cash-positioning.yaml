id: daily-cash-positioning
title: Daily cash positioning
question: What cash do we have right now — and do we need to do anything about it today?
group: Cash & liquidity
order: 1
summary: >-
  Every business morning, someone establishes how much cash the company actually has in each bank account,
  entity and currency, adds the flows already known for today, and decides whether any account needs funding,
  whether surplus should be concentrated or used to reduce borrowing, and whether anything unexpected needs
  investigating — all before the banks' cut-off times. It is the most basic and most frequent treasury workflow, and
  the foundation for forecasting, funding and investment decisions.
objective: >-
  Know the day's usable [cash position](term:cash-position) by account, entity and currency, so that every account can
  cover today's outflows, idle surplus is concentrated or used to reduce debt, and anomalies (errors, fraud, missing
  receipts) are caught the same morning.
trigger: >-
  Start of each business day, once prior-day [bank statements](term:bank-statement) are in; repeated intraday at larger
  companies as intraday reports, credit advices and instant-payment credits arrive.
frequency: >-
  Daily at mid-market and large companies, plus intraday checks. At SMEs the accountant glances at portal balances
  daily and builds the fuller account-by-account view on payment days (often twice a week). At startups: weekly, and
  before payroll or large payments.
people:
  - role: Treasury analyst / cash manager
    does: Collects balances, builds the position, investigates gaps, proposes transfers. (At SMEs, the head of accounting.)
  - role: Treasury manager / head of treasury
    does: Reviews the position, decides funding and the use of surplus (concentrate, reduce borrowing, invest), second approver on transfers.
  - role: Subsidiary finance managers / local accountants
    does: Explain unexpected local movements; flag large same-day payments or receipts not in any system; send statements or portal exports where the bank is not connected.
  - role: Accounts payable / payment operations
    does: Tell treasury which payment runs are released today and their amounts.
  - role: Group accounting
    does: Receives the record of intercompany transfers so both sides are booked and interest is charged.
  - role: CFO
    does: Only involved when the position shows a real shortfall, a credit-line drawing outside the manager's authority, or something that looks like fraud.
systems:
  - name: Bank portals / e-banking
    use: Check balances and today's credits/debits; the fallback when files fail. At small companies the only tool.
  - name: Bank connectivity ([EBICS](term:ebics), [SWIFT](term:swift), [host-to-host](term:host-to-host), [APIs](term:api-banking))
    use: Deliver prior-day statements (MT940 / camt.053), intraday reports (MT942 / camt.052) and debit/credit advices ([camt.054](term:camt-054)) automatically.
  - name: "[TMS](term:tms), multibank tool or cash-visibility tool"
    use: Imports statements, shows balances by entity/currency/bank, projects today's closing balance, sometimes proposes transfers.
  - name: "[ERP](term:erp)"
    use: Source of today's released payment runs, expected customer receipts, and intercompany settlements.
  - name: Excel
    use: At most mid-market companies the actual positioning worksheet; everywhere, the place where "known flows not yet in any system" get added.
  - name: Market data (bank portal, Bloomberg, central bank rates)
    use: FX rates to express everything in the reporting currency; money-market rates for decisions on surplus and borrowing.
data:
  - name: Prior-day closing balances (booked and value-dated)
    source: Bank statements (MT940, camt.053; BAI2 in the US)
    notes: >-
      The anchor of the position. Statements carry the [booked and value-dated balance](term:available-balance); the
      position should use value-dated (or available) balances, never the booked figure alone. Missing statements are the
      most common problem.
  - name: Intraday credits and debits
    source: Intraday reports (MT942, camt.052), credit/debit advices (camt.054, MT900/910), bank APIs, portal
    notes: A camt.054 or MT910 credit advice can confirm that a large customer receipt has arrived before the next statement. Coverage varies widely by bank and country.
  - name: Today's scheduled outflows
    source: ERP payment runs, payroll provider, tax calendar, loan schedules, treasury deals maturing
    notes: >-
      Payroll and tax dates are known months ahead; supplier runs a day or two ahead. [Direct debits](term:direct-debit)
      (tax offices, leasing, card acquirers) are the classic blind spot, because nobody in the company releases them.
  - name: Today's expected inflows
    source: Maturing deposits/deals (certain); customer receipts (uncertain); intercompany
    notes: Customer receipts are usually not counted until they arrive, unless value-dated and confirmed (credit advice or intraday report).
  - name: Account minimums and group minimum liquidity
    source: Treasury policy, CFO decision, local operating needs
    notes: >-
      Two different floors. Each account has a [minimum operating balance](term:minimum-operating-balance) (e.g. EUR 0.25m
      in the German operating account for card and direct-debit flows). Separately, the CFO sets a group
      [minimum liquidity](term:cash-buffer) (Helvetic: CHF 10m, held at the parent) that the forecast low point is tested
      against. Headroom additionally counts undrawn committed facilities.
  - name: FX rates
    source: Bank or market-data feed
    notes: For the consolidated view only; actual conversions are separate trades.
  - name: Bank cut-off times per currency and bank
    source: Bank documentation, experience
    notes: Determines the order in which decisions must be made (see step 7).
steps:
  - title: Check that all statements arrived
    who: Treasury analyst
    where: Connectivity tool / TMS / bank portals
    when: "07:30"
    detail: >-
      Confirm that every bank has delivered its prior-day statement for every account. A missing statement means the
      balance for that account is unknown. Time zones mostly help a Swiss company: Asian banks close their day while
      Switzerland is still asleep or starting work, so their prior-day statements are among the first available; US
      banks close around 22:00–23:00 Swiss time, so US prior-day statements arrive overnight, but *today's* US activity
      starts only in the Swiss afternoon. When a statement is missing the cause is usually connectivity, not the clock:
      a bank or country that is not connected to the group's tool (common for domestic banks in China and other
      restricted-currency countries), a file delivery that failed, or a new account not yet set up for reporting.
    manual: When a file is missing, the analyst logs in to that bank's portal and copies the balance by hand, or relies on a portal export emailed by local finance.
  - title: Load balances and check they make sense
    who: Treasury analyst
    where: TMS or Excel
    detail: >-
      Import balances by account. Check that each opening balance equals the prior day's closing balance (a gap means a
      missing statement or a back-valued correction by the bank), that value-dated rather than booked balances are used,
      and that balances look plausible. Convert to the reporting currency for the group total.
    judgment: Deciding whether an odd balance is a data problem (duplicate file, wrong account mapping) or a real event.
  - title: Identify unexpected movements
    who: Treasury analyst
    where: TMS / Excel / bank portal
    detail: >-
      Compare yesterday's actual movements with what was expected (yesterday's position and forecast). Flag large
      unexpected debits (possible error or fraud), direct debits nobody announced, missing expected receipts, returned
      payments, bank fees, and unexplained credits. Drill into transaction details, bank transaction codes and
      remittance information.
    judgment: Which differences matter today. A CHF 2m customer payment that is one day late is normal; an unknown CHF 180k debit is not until it is explained.
  - title: Add today's known flows
    who: Treasury analyst
    where: Excel / TMS
    detail: >-
      Add everything already known to leave or arrive today by [value date](term:value-date): payment runs released by AP,
      payroll, tax, loan interest and repayments, maturing deposits and FX deals, intercompany settlements, card settlements.
      Result: projected end-of-day balance per account.
    manual: >-
      Much of this arrives by email or chat ("Italy is paying EUR 1.2m to a supplier today", "payroll file was
      bigger this month because of bonuses") and is typed into the sheet.
  - title: Check each account against its minimum and limits
    who: Treasury analyst
    where: Excel / TMS
    detail: >-
      For each account, compare the projected closing balance with its minimum operating balance and any
      [overdraft](term:overdraft) limit. Also check group-level concerns: cash at a bank above its
      [counterparty limit](term:counterparty-limit), surplus in a subsidiary that should be concentrated, and whether the
      parent still holds the group minimum.
  - title: Propose funding, concentration and use of surplus
    who: Treasury analyst → treasury manager
    where: Excel / TMS / email
    detail: >-
      Propose actions: fund short accounts from surplus accounts (same entity) or by [intercompany loan](term:intercompany-loan)
      under the existing [framework agreement](term:intercompany-framework-agreement) (different entities); concentrate
      surplus to the parent (manually, or automatically where a [cash pool](term:cash-pooling) exists). For genuine surplus,
      check the forecast first: if the company has drawn debt, reducing the drawing at the next
      [interest-period](term:interest-period) rollover usually beats a deposit (in CHF at a 0% policy rate, a deposit earns
      roughly nothing); EUR or USD surplus can earn money-market rates. If the group is short, prepare a facility drawing.
      If a currency is short in one place and long elsewhere, choose between a [spot](term:spot-fx) conversion and an
      [FX swap](term:swap). The output is a short note or email to the manager: group total, by currency, change versus
      yesterday and versus forecast, exceptions, proposed actions.
    judgment: >-
      How much buffer to keep given today's uncertainty; whether to fund a shortfall by moving cash, converting currency,
      or drawing a facility; whether a surplus is temporary (needed next week) or durable enough to repay debt.
  - title: Approve and execute before cut-off
    who: Treasury manager approves; analyst or payment operations executes
    where: TMS / multibank tool / bank portal / EBICS signature app
    when: "Morning to early afternoon, by currency"
    detail: >-
      Transfers and deals are entered and approved under the [four-eyes principle](term:four-eyes-principle) (one person
      enters, another approves), within signing limits. [Cut-off times](term:cut-off-time) drive the order. Illustrative
      bank cut-offs for same-day value from a Swiss bank (they vary by bank and channel): CNY and other Asian currencies
      often the previous day or very early morning Swiss time, because the local payment systems close during the Swiss
      morning; urgent EUR (via T2) and CHF (via [SIC](term:sic)) typically early to mid-afternoon; USD often mid- to
      late afternoon. SEPA credit transfers are not same-day guaranteed; same-day EUR means an urgent/express payment or
      [SCT Inst](term:sct-inst) where both banks support it.
    judgment: If something is still unexplained at cut-off, whether to move cash anyway (safety) or wait (avoid unnecessary transfers).
  - title: Document and update the forecast
    who: Treasury analyst
    where: Excel / TMS
    detail: >-
      Save the day's position, send the intercompany drawing confirmations to group accounting (so both sides are booked
      and interest is charged), and feed actual balances and variances into the
      [short-term forecast](term:short-term-forecast).
  - title: Monitor intraday and close the loop
    who: Treasury analyst
    where: Intraday reports / portals / alerts
    when: Afternoon
    detail: >-
      Check that expected large receipts arrived and that transfers executed; chase anything outstanding with the bank or
      the subsidiary. At large companies "continuous" monitoring means an intraday balance dashboard fed by camt.052 or
      APIs every 15–60 minutes, alerts on large or unusual debits, camt.054 credit advices, and instant-payment credits
      that can arrive at any hour including weekends. At small companies it is often skipped.
example:
  title: "Tuesday 17 November at Helvetic Machines: EUR short in Germany, CHF that only looks like surplus"
  body: |
    **07:30** — Lea opens the multibank connectivity tool. 11 of 12 prior-day statements are in, including HM Inc.'s (the US day closed overnight Swiss time). The twelfth is HM Suzhou's account at a Chinese domestic bank, which has no EBICS or Swift reporting to the group: as every day, Wei has emailed a portal export from Suzhou, and Lea types the CNY balance into the workbook. She refreshes the positioning workbook.

    | Account (12) | Opening, value-dated | Known today | Projected close | Account minimum | Status |
    |---|---|---|---|---|---|
    | HM AG — CHF, Swiss bank A | CHF 14.2m | −1.1m supplier run | CHF 13.1m | 2.0m | Above minimum; see 09:10 |
    | HM AG — EUR, Swiss bank A | EUR 6.8m | +0.9m customer receipt (value today, in the 07:45 camt.052); −1.5m to Germany | EUR 6.2m | 0.5m | OK |
    | HM AG — CHF, Swiss bank B (RCF agent) | CHF 3.5m | 0 | CHF 3.5m | 0.5m | OK |
    | HM Service AG — CHF | CHF 0.8m | 0 | CHF 0.8m | 0.2m | OK |
    | HM Deutschland — EUR, German bank | EUR 1.5m (expected 1.8m) | −2.6m supplier run | **EUR −1.1m** | 0.25m | **Short EUR 1.35m** |
    | HM Italia — EUR | EUR 2.9m (expected 5.15m) | 0 | EUR 2.9m | 0.3m | Customer receipt missing |
    | HM France — EUR | EUR 0.9m | 0 | EUR 0.9m | 0.2m | OK |
    | HM UK — GBP | GBP 1.0m | 0 | GBP 1.0m | 0.2m | OK |
    | HM CZ — CZK | CZK 30m | 0 | CZK 30m | 5m | OK |
    | HM CZ — EUR | EUR 0.4m | 0 | EUR 0.4m | 0.1m | OK |
    | HM Inc. — USD, global bank | USD 3.1m | −0.4m payroll funding | USD 2.7m | 1.0m | OK (US day starts ~15:00 Swiss time) |
    | HM Suzhou — CNY, Chinese bank | CNY 55m (emailed export) | 0 | CNY 55m | 5m | Not concentrated ([trapped](term:trapped-cash)) |

    Group total about **CHF 41m** (illustrative rates EUR/CHF 0.935, USD/CHF 0.80, GBP/CHF 1.07), of which about CHF 6m in China. That is about CHF 2.6m below yesterday's forecast.

    **08:10** — Lea explains the gap. (1) HM Italia's largest customer did not pay EUR 2.25m (≈ CHF 2.1m) due yesterday; she emails Giulia in Milan. (2) HM Deutschland's statement shows a EUR 0.3m debit by the municipality: the Gewerbesteuer (trade-tax) prepayment due 15 November, collected by [direct debit](term:direct-debit). Jens confirms it is real; nobody had put it in the forecast. (3) HM AG's CHF account shows a CHF 180k debit to a known Swiss supplier that matches a payment made last Thursday.

    **08:25** — The CHF 180k debit is the fraud-shaped exception, so Lea checks before assuming anything: same beneficiary, same IBAN as the supplier master record, same invoice reference as Thursday's payment. The bank's camt.054 shows it came from a payment file uploaded twice by Swiss accounting. Not fraud: a duplicate. AP asks the supplier to refund it; Lea marks it as a timing difference in the forecast. Had the IBAN been new or the beneficiary unknown, she would have called Daniel and the bank immediately to try a recall.

    **08:40** — Options Lea writes up for Daniel:
    1. Transfer EUR 1.5m from HM AG's EUR account to HM Deutschland as a drawing under the intercompany framework agreement, sent as an urgent EUR payment (settled same day via the Swiss bank's euro clearing link to T2; SEPA would not be same-day guaranteed) before the Swiss bank's early-afternoon cut-off. *Recommended.*
    2. Pull EUR 1.5m from HM Italia: possible, but Italy's customer receipt is missing and it has a EUR 1.8m supplier run on Thursday.
    3. Let the German account use its EUR 2m [overdraft](term:overdraft): expensive, and the treasury policy forbids routine use of local overdrafts.

    **09:10** — Daniel reads the one-page position email, approves option 1 as second signatory in the connectivity tool, and it goes out over EBICS. He then looks at HM AG's CHF 13.1m. It is above the account minimum, but it is not surplus: the forecast shows the Swiss payroll (about CHF 7m) on 25 November and the Q3 Swiss VAT payment (about CHF 4.8m) on 30 November, and the CFO's CHF 10m minimum liquidity is held at the parent. A CHF deposit would earn about 0% anyway. The CHF 35m RCF loan is in an interest period to 15 January and cannot be prepaid mid-period without break costs, so the reduction decision waits for that rollover. He leaves the cash on the current account.

    **10:15** — Lea saves the day's position, emails the intercompany drawing confirmation to Claudia's team, records the three variances (Italian receipt: timing; German tax: missing input; duplicate payment: timing) and updates the 13-week forecast's week-1 actuals. **15:30** — the German transfer shows as credited in the German bank's intraday report; HM Inc.'s US account starts showing today's activity.
judgment:
  - decision: How much buffer to leave in each account
    why: Depends on the reliability of that entity's forecast, local payment habits (direct debits, card flows), and the cost of an overdraft vs idle cash. No formula captures a local team's track record.
  - decision: Whether an unexplained movement is a data error, timing, or a real problem (fraud, bank error, customer default)
    why: Requires context — knowing the customers, the supplier master data, the bank's habits, what the subsidiary is doing this week.
  - decision: Fund by transfer, FX conversion, FX swap, or credit-line drawing
    why: Trade-off between cost, tax/legal documentation (intercompany framework agreements), counterparty limits and how long the need will last.
  - decision: Whether a surplus is real and what to do with it
    why: Depends on the forecast over the next days and weeks, whether debt is drawn (repaying at the next rollover versus depositing), the rate environment per currency, and the investment policy.
  - decision: Whether to act before cut-off without full information
    why: Waiting avoids unnecessary transfers; acting avoids a failed payment. The cost of each mistake is asymmetric.
failure_modes:
  - mode: A statement is missing and the balance is assumed from yesterday
    consequence: Funding decisions based on stale data; an account goes overdrawn or a large debit (fraud, error) is noticed a day late.
    detection: Completeness check at the start; opening-balance-equals-prior-close check.
  - mode: A known flow is not in the position (a direct debit for local tax, a large one-off supplier)
    consequence: Account overdrawn, payment rejected, late-payment interest, embarrassed call with a supplier.
    detection: Usually only when the bank rejects the payment or the overdraft shows up next morning; prevention is a central calendar of statutory and direct-debit dates.
  - mode: Cut-off missed
    consequence: Payment executed a day late, payroll late, value lost, possible penalty.
    detection: Bank confirmation or rejection; complaint from the subsidiary.
  - mode: Booked balance used instead of value-dated or available balance
    consequence: Cash counted as available when it isn't; interest charged on intraday or overnight overdraft.
    detection: Reconciliation of value dates; bank interest statements.
  - mode: Surplus left idle while debt is drawn, or held above counterparty limits
    consequence: Paying a loan margin on money that sits at 0%; excessive exposure to one bank (the issue that hit many SVB depositors in 2023).
    detection: Weekly comparison of cash against drawn debt and rollover dates; counterparty-limit report.
  - mode: Transfer typed wrongly (wrong account, amount, currency)
    consequence: Funds misdirected; recovery can take days.
    detection: Four-eyes approval; templates for recurring transfers; bank confirmations.
  - mode: At multinationals, automatic sweeps or in-house bank postings silently fail
    consequence: A participant account is left overdrawn or cash sits outside the pool; internal account balances disagree with the bank.
    detection: Morning check that every sweep executed and every in-house-bank posting matches the bank statement.
software: >-
  At large companies, **TMS** cash-positioning modules (e.g. Kyriba, SAP treasury modules, FIS, GTreasury, ION products)
  import statements and propose transfers. Mid-market companies often use a **multibank connectivity tool** or a lighter
  cloud treasury product to aggregate balances via EBICS, SWIFT or APIs, still combined with an Excel workbook. The
  vendors in that space position themselves differently (for example Trovata around cash visibility and forecasting,
  Agicap around SME cash-flow management, Atlar and Embat as lighter treasury and payments platforms); banks also offer
  their own multibank portals. Small companies use **bank portals** and a spreadsheet; Swiss SMEs increasingly see bank
  transactions directly in their accounting software through [open-banking](term:open-banking) connections such as SIX
  bLink. See [Systems & Data](/systems); vendor names are examples, not endorsements.
manual_work:
  - Logging into portals, or retyping emailed exports, for banks or countries not connected to the group's tool.
  - Typing "known flows" from emails and chats into the positioning sheet.
  - Maintaining the account list (new accounts, closed accounts, changed account mapping) — errors here silently drop balances.
  - Looking up transaction details to explain unexpected items, often requiring a call or email to the bank or subsidiary.
  - Copying approved transfers from the spreadsheet into the bank portal or TMS (re-keying risk).
  - Writing the daily position email (group total, by currency, versus yesterday and forecast, exceptions, actions) to the treasurer or CFO.
by_size:
  startup: >-
    No daily routine. The founder or CFO logs into the bank portals weekly, or before approving payments, and looks at
    the balance. The relevant questions are "can we make payroll on the 25th?" and "how many months of
    [runway](term:cash-runway)?". The position is a number in a spreadsheet next to the [burn rate](term:burn-rate).
  sme: >-
    The head of accounting or a senior accountant looks at the portals every morning (a few minutes) and, on payment
    days, updates an Excel sheet by bank and currency and makes sure the accounts cover the run. The CFO is asked before
    moving large amounts or drawing the credit line. Subsidiary balances are often seen through the same bank's
    multi-country view, or only at month-end. 20–40 minutes on a payment day.
  midmarket: >-
    A daily routine owned by a small treasury team. Statements arrive via EBICS/SWIFT or a multibank tool; the position
    is built in Excel or a light TMS by 09:00–10:00; transfers between entities are manual intercompany loans under
    framework agreements. Main pain: banks or countries that are not connected, known flows communicated by email,
    key-person dependency.
  multinational: >-
    Largely automated: the TMS imports hundreds of statements, cash pools sweep automatically at the bank's end of day,
    and the [in-house bank](term:in-house-bank) position is updated. The morning work is checking that the automation
    worked (all statements in, all sweeps executed, in-house-bank postings match the banks) and handling exceptions:
    unexpected items, accounts outside pools, restricted-currency countries, and funding needs that pools don't cover.
    Intraday monitoring for large flows. The judgment moves to exceptions and to structural questions (which accounts
    should be in the pool?).
companies:
  kleio: >-
    Sarah checks the three banks' portals each Monday and before payroll, and types the balances into the Google Sheet.
    After the Series B she split the cash across two Swiss banks and moved part into a CHF money-market fund, for
    counterparty diversification after SVB rather than for yield (CHF money-market yields are about zero at a 0% SNB
    rate). The USD that Kleio Inc. needs for US payroll and cloud bills sits in a USD government MMF at the US bank,
    which does earn a money-market rate.
  alpine: "Petra checks the portals daily at 08:00; on payment days (Tue/Fri) she makes sure the CHF account can cover the run. When the German subsidiary is short she asks Martin, who approves a transfer from the parent's EUR account."
  helvetic: "The worked example above. Lea builds the position; Daniel reviews and decides. There is no cash pool: concentration and funding are manual intercompany transfers. China is connected only by emailed portal exports, and CNY can't be moved freely, so it is monitored but excluded from concentration."
  globalchem: "The TMS position is ready at 07:00 Basel time; the cash & liquidity team first checks that all ~280 statements arrived and the overnight sweeps and in-house-bank postings match, then reviews ~15 exceptions a day, executes funding for accounts outside the pools, and checks the in-house bank's external position against counterparty limits. Asia-Pacific positioning is done earlier by the Singapore regional centre."
handoffs:
  - from: Banks
    gives: prior-day statements (MT940 / camt.053), intraday reports and credit/debit advices
    to: Treasury analyst
  - from: Accounts payable
    gives: released payment runs and amounts for today
    to: Treasury analyst
  - from: Subsidiary finance
    gives: "large local payments/receipts not in the system; explanations of unexpected items; portal exports where the bank is not connected"
    to: Treasury analyst
    note: Typically by email or chat — the least structured and least reliable input.
  - from: Treasury analyst
    gives: position email (by account/entity/currency, versus forecast) + proposed transfers or drawings
    to: Treasury manager
  - from: Treasury manager
    gives: approved transfers (four-eyes) and decisions on surplus and borrowing
    to: Payment operations / bank
  - from: Treasury manager
    gives: escalation if the group is short, a facility must be drawn, or something looks like fraud
    to: Head of treasury / CFO
  - from: Treasury analyst
    gives: intercompany drawing confirmations
    to: Accounting
    note: So intercompany balances and interest are booked on both sides.
interview: >-
  Ask the person who *builds* the position (analyst, cash manager, or head of accounting at an SME) to walk you through
  **this morning**: which screens they opened, in what order, what was missing, what they had to ask someone, what
  they decided. Ask which banks or countries are not connected and how those balances arrive. Then ask the manager
  what they look at when the position reaches them, what they did with the last surplus, and what they would never
  let a system do automatically. See [Who should I interview?](/org/interview-finder).
ai_note: >-
  Collecting balances and assembling the position is already largely automated at companies with good connectivity.
  The residual human work is explaining exceptions (which needs context from emails, subsidiaries and banks) and
  deciding transfers under cut-off pressure. An assistant that drafts explanations and proposes transfers for approval
  is plausible; autonomous execution of transfers faces a high trust and control bar.
terms: [cash-position, available-balance, value-date, bank-statement, camt-054, mt940, iso-20022, minimum-operating-balance, cash-buffer, direct-debit, cash-concentration, intercompany-loan, intercompany-framework-agreement, overdraft, four-eyes-principle, cut-off-time, sic, eurosic, sct-inst, interest-period, counterparty-limit, trapped-cash, cash-pooling]
related: [cash-forecasting, liquidity-planning, surplus-cash-investment, funding-subsidiary, bank-reconciliation, credit-facility-management]
sources: [deloitte-gts-2024, swift-iso-mt9xx, zkb-iso20022-factsheet, six-sps-cash-mgmt, gewstg-19, six-eurosic, ecb-ipr, snb-mpa-2026-09-primary, six-blink]
evidence_note: >-
  The steps and failure modes are established practice described consistently in treasury training material and
  vendor documentation. Timings, cut-off times, the worked example and company variants are illustrative synthesis.
  Survey evidence that positioning is still immature at some large companies: 22% of Deloitte's 2024 respondents said
  their cash-positioning capability requires development[](cite:deloitte-gts-2024). Message formats: when Swift's
  MT/ISO 20022 coexistence for cross-border payments ended in November 2025, reporting MTs such as MT940/942 were
  deprecated rather than withdrawn[](cite:swift-iso-mt9xx); Swiss banks have set no end date for MT940/942 to
  corporates[](cite:zkb-iso20022-factsheet), while the 2009 camt versions end in November 2026[](cite:six-sps-cash-mgmt).
  German trade-tax prepayment dates are statutory[](cite:gewstg-19). Euro-area banks must be able to receive SCT Inst
  since January 2025 and send it since October 2025[](cite:ecb-ipr); Swiss banks are not bound by the EU regulation,
  and SIX will discontinue euroSIC at the end of 2027[](cite:six-eurosic). CHF deposits earn about nothing because the
  SNB policy rate is 0%[](cite:snb-mpa-2026-09-primary).
