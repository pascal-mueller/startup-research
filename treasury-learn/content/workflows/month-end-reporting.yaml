id: month-end-reporting
title: Month-end treasury reporting
question: What does treasury hand to accounting at month-end, and what goes in the CFO / board treasury report?
group: Controls & reporting
order: 1
summary: >-
  In the first working days after month-end, treasury does two different jobs. First it feeds the accounting close:
  confirmed bank balances, the list of open financial deals with their month-end valuations, interest accruals and
  intercompany loan balances, so that accounting can book them. Then it produces its own management report for the
  CFO (monthly) and a condensed version for the board or audit committee (usually quarterly): cash and debt, liquidity
  headroom, hedge positions and their market value, bank counterparty exposure, forecast accuracy, covenant headroom
  and any policy breaches. It is recurring, deadline-driven, spreadsheet-heavy work whose value lies less in the
  numbers than in the exceptions and commentary.
objective: >-
  Give accounting complete, reconciled treasury data on time for the close, and give the CFO and board a short,
  reliable picture of liquidity, debt, financial risk positions and control exceptions — so that problems (a
  shrinking headroom, a covenant getting tight, a bank limit exceeded, a forecast that keeps missing) surface
  months before they become crises.
trigger: Calendar month-end. Deadlines are set by the group close calendar (e.g. "treasury data to group accounting by WD2 12:00"); quarter- and year-end add audit and disclosure requirements.
frequency: >-
  Monthly at mid-market and large companies (the CFO pack); quarterly to the board / audit committee; semi-annual or
  quarterly compliance certificates to lenders where covenants apply. At startups and SMEs, treasury content is a few
  lines inside the monthly management accounts or the board deck.
people:
  - role: Treasury analyst (or treasury back office at large companies)
    does: Pulls month-end balances and deal lists, obtains valuations, prepares the accounting pack and the draft report tables.
  - role: Treasury manager / head of treasury
    does: Reviews the numbers, investigates exceptions, writes the commentary, decides what to escalate; owns the report.
  - role: Group / head of accounting and local accountants
    does: Set the close calendar and month-end FX rates; book interest, derivatives, intercompany loans and deposits in the general ledger; reconcile.
  - role: FP&A / controlling
    does: Provide the outlook (forecast EBITDA) used in headroom projections. LTM actual EBITDA for covenant ratios comes from group accounting — FP&A never supplies LTM actuals.
  - role: Subsidiary finance
    does: Confirm local bank balances, local borrowings and guarantees; book their side of intercompany loans and interest.
  - role: Banks / counterparties
    does: Send month-end statements, deal confirmations and valuation statements for open derivatives.
  - role: CFO
    does: Reads the monthly report, asks questions, takes material items (refinancing, breaches, fraud attempts) to the executive board or audit committee.
  - role: Board / audit committee
    does: Receives a quarterly treasury section; approves policy exceptions and financing decisions reserved to it.
systems:
  - name: Bank connectivity / portals
    use: Month-end statements (camt.053 / MT940) and, at some banks, balance confirmations; the source of truth for cash.
  - name: "[TMS](term:tms) or treasury deal spreadsheet"
    use: Deal register (deposits, loans, FX forwards, swaps), month-end valuation, accrual calculation, accounting entries (at companies with integrated TMS/ERP treasury modules).
  - name: "[ERP](term:erp) general ledger"
    use: Where accounting books what treasury reports; cash per GL, intercompany balances, interest expense.
  - name: Bank valuation statements / market data (Bloomberg, LSEG, bank portals)
    use: Month-end [mark-to-market](term:mark-to-market) values of derivatives; closing FX rates and yield curves.
  - name: Consolidation / reporting tool
    use: Where group accounting consolidates; treasury's numbers must reconcile to it.
  - name: Excel and PowerPoint
    use: The report itself at most companies below the largest; covenant calculations; commentary.
data:
  - name: Month-end bank balances by account, entity, currency
    source: Bank statements for the last business day
    notes: Bank balance and GL cash usually differ by items in transit; the difference must be explained, not ignored.
  - name: Debt and facilities
    source: Loan agreements, RCF utilisation notices, bond terms, local credit lines
    notes: Drawn amounts, undrawn committed amounts, maturities, margins, fees.
  - name: Open financial deals
    source: TMS / deal register, reconciled to bank confirmations
    notes: Deposits, FX forwards and swaps, interest-rate swaps, with trade date, maturity, rate, counterparty.
  - name: Month-end valuations
    source: Bank valuation statements or TMS valuation from market data
    notes: Banks' valuations differ slightly from each other and from the TMS; policy says which one is used.
  - name: Closing FX rates
    source: Group accounting's rate table (often based on a published month-end fixing)
    notes: Treasury must use the same rates as accounting, or its numbers will never reconcile.
  - name: Interest accruals
    source: Calculated by treasury (TMS or spreadsheet) from deal and loan terms
  - name: Intercompany loans and cash-pool balances
    source: Treasury's intercompany loan register / in-house bank
    notes: Both entities must book the same balance and interest; mismatches block the consolidation.
  - name: LTM EBITDA and outlook
    source: Group accounting (LTM actuals, for covenant ratios); FP&A / controlling (outlook)
    notes: LTM EBITDA for covenant estimates comes from group accounting; FP&A supplies forecast EBITDA only, used for headroom projections between formal test dates.
  - name: Derivative collateral and margin balances
    source: CSA margin statements from the hedging banks
    notes: Under ISDA credit support annexes, margin calls and collateral balances are month-end items in the accounting pack and a classic reconciliation gap (larger groups; Helvetic's plain forwards carry no CSA).
  - name: Forecast vs actual
    source: Stored 13-week forecast versions and actual cash flows
  - name: Limits and policy thresholds
    source: "[Treasury policy](term:treasury-policy)"
    notes: Counterparty limits, hedge-ratio ranges, minimum liquidity, approved instruments.
steps:
  - title: Capture month-end balances and check completeness
    who: Treasury analyst
    where: Connectivity tool / bank portals / Excel
    when: WD1 morning
    detail: >-
      Load the statements for the last business day of the month for every account, including accounts that are not
      part of the daily routine (dormant accounts, escrow, local accounts in China). Compare the total with the last
      daily cash position and the account list; a missing account silently understates cash. At year-end, bank
      confirmation letters requested by the auditor arrive separately and must agree with the same figures.
    manual: Accounts outside the connectivity set-up (local banks, escrow, guarantees) are looked up in portals or requested by email from subsidiaries.
  - title: Reconcile the deal register with banks
    who: Treasury analyst / treasury back office
    where: TMS or deal spreadsheet vs bank confirmations
    when: WD1
    detail: >-
      Check that every open deposit, loan, FX forward and swap in the register is confirmed by the counterparty and
      that no bank shows a deal treasury does not have (a classic sign of an unrecorded or unauthorised trade). Record
      deals that matured or rolled during the month. Update facility utilisation (e.g. RCF drawings rolled on the
      interest period date).
    judgment: Whether a difference is a booking error, a timing issue (deal traded on the 30th, confirmed on the 1st) or something that must be escalated.
  - title: Obtain month-end valuations and closing rates
    who: Treasury analyst
    where: Bank valuation statements / TMS / market data
    when: WD1–WD2
    detail: >-
      Request or download each bank's valuation of open derivatives as of month-end, or run the TMS valuation with
      the month-end curves; take closing FX rates from group accounting's rate table. Compare bank and TMS values for
      large deals; differences of a few basis points are normal, large ones are not.
    manual: Bank valuation statements arrive as PDF or email at different times; the analyst types or pastes them into the register.
  - title: Calculate accruals and intercompany interest
    who: Treasury analyst
    where: TMS / Excel
    when: WD1–WD2
    detail: >-
      Compute interest accrued but not yet paid on the bond coupon, RCF drawings, commitment fees on the undrawn part,
      deposits, and every [intercompany loan](term:intercompany-loan) and cash-pool balance, with the rates set under the
      group's transfer-pricing rules. Produce a list per entity: balance, rate, accrued interest, currency.
  - title: Deliver the accounting pack
    who: Treasury analyst → group accounting and subsidiary accountants
    where: Email with Excel pack, or TMS-generated postings into the ERP
    when: WD2 (per close calendar)
    detail: >-
      Hand over balances, deal list with valuations, accruals and intercompany statements. At most mid-market
      companies accounting books the entries; treasury does not post to the general ledger. At larger companies with
      integrated treasury modules, postings are generated automatically from the TMS and reviewed by treasury
      accounting or back office. What the pack contains for derivatives depends on the reporting framework, and the
      two vocabularies must not be mixed (see [why the packs differ](why:fer-vs-ifrs-pack)). Helvetic reports under
      **Swiss GAAP FER**: derivatives are handled under **FER 27 "Derivative financial instruments"**, treasury
      supplies fair values, accruals and the hedge book, and the [hedge-accounting](term:hedge-accounting) treatment
      and hedge-ratio bands are **management practice** — FER 27 requires no formal hedge-documentation or
      effectiveness testing. GlobalChem reports under **IFRS 9/16** with hedge
      accounting: treasury supplies designation documentation and ongoing effectiveness assessments (that is where
      "effectiveness data" belongs — IFRS 9 vocabulary, with no IAS 39-style 80–125% bright line), plus the data
      behind the IFRS 7 risk disclosures.
    judgment: Which exceptions (a disputed valuation, a late confirmation) to flag to accounting rather than silently resolve.
  - title: Reconcile treasury figures to the ledger
    who: Treasury analyst with accounting
    where: Excel / ERP reports
    when: WD3
    detail: >-
      Compare treasury's cash per bank with GL cash, treasury's debt with GL debt, and both sides of each intercompany
      loan. Explain every difference: payments released on the 30th but value-dated the 1st, fees not yet booked,
      a subsidiary that booked intercompany interest at last quarter's rate. Fix or document before consolidation.
    manual: Intercompany mismatches are chased by email with local accountants; this is where much of the month-end friction sits.
  - title: Compute covenant and headroom estimates
    who: Group accounting (Claudia's team) computes the LTM ratios; the treasury analyst supplies the net-debt schedule; the treasury manager reviews
    where: Excel covenant model
    when: WD3–WD4
    detail: >-
      With LTM EBITDA from group accounting (FP&A supplies forecast EBITDA only — never LTM actuals), compute [net debt](term:net-debt), [leverage](term:leverage-ratio) and
      [interest cover](term:interest-cover) using the loan agreement's definitions (which differ from the reported
      figures — e.g. treatment of leases, one-offs, pro-forma acquisitions). Compute [liquidity headroom](term:liquidity-headroom):
      freely available cash plus undrawn committed facilities, minus minimum cash. Project both to the next test date.
      Lea prepares the net-debt schedule and the projections; Daniel reviews and presents the ratios to the banks.
    judgment: Which adjustments the lender definitions allow, and whether a projected trend (not today's number) warrants a warning to the CFO.
  - title: Check limits and policy compliance
    who: Treasury analyst → treasury manager
    where: Excel / TMS limit report
    when: WD3–WD4
    detail: >-
      Compare month-end exposures with the [treasury policy](term:treasury-policy): cash plus positive derivative value
      per bank against [counterparty limits](term:counterparty-limit) and minimum ratings; hedge ratios per period
      against policy ranges; minimum liquidity; approved instruments. List every breach with cause and remediation.
      See [treasury policy compliance](wf:policy-compliance).
    judgment: Whether a breach is technical and self-curing (a large receipt landed on the 30th) or needs action and formal reporting.
  - title: Measure forecast accuracy
    who: Treasury analyst
    where: Excel / forecasting tool
    when: WD3
    detail: >-
      Compare the month's actual cash flows with what the forecast predicted 4 and 13 weeks earlier, by entity and
      category; track the trend. See [cash forecasting](wf:cash-forecasting).
  - title: Write the report and commentary
    who: Treasury manager
    where: PowerPoint / Excel / dashboard
    when: WD4
    detail: >-
      Assemble a few pages: cash and debt by entity and currency; net debt and its change; liquidity headroom;
      [debt maturity profile](term:debt-maturity-profile); hedge positions (notional, hedge ratio vs policy, average rate,
      market value); counterparty exposure vs limits; forecast accuracy; covenant headroom; exceptions (breaches, fraud
      attempts, bank issues); actions and decisions requested. Commentary explains changes versus last month and
      what to worry about next quarter.
    judgment: What to highlight. A good report says "headroom is fine, but the 2028 bond refinancing window opens in Q2 next year"; a weak one reprints tables.
  - title: Review, send and follow up
    who: Head of treasury / CFO; board or audit committee quarterly
    where: Meeting / email / board portal
    when: WD5 (monthly); board cycle (quarterly)
    detail: >-
      The CFO reviews and asks questions ("why did net debt rise CHF 8m?", "why are we over the limit at the German
      bank?"). Material points go into the executive and board packs; decisions (e.g. start refinancing, approve a
      limit waiver) are minuted. Quarter- and year-end figures also feed the external financial statements and
      notes (liquidity risk, market risk, derivatives), prepared by accounting with treasury input.
example:
  title: "Helvetic Machines, September close: WD1 to WD5"
  body: |
    **WD1 (Thu 1 Oct)** — Lea loads the 30 September statements: 12 operating accounts plus two accounts outside the daily routine (a CZK escrow account and a USD guarantee collateral account). She requests valuation statements for the open forwards from the three hedging banks and takes the month-end rates from Claudia's rate table (EUR/CHF 0.9350, USD/CHF 0.8000 — illustrative).

    **WD2** — The accounting pack goes to Claudia's team at 11:40, [ten minutes inside the WD2 12:00 deadline](why:pack-wd2-report-wd5): open forwards with bank values, accrued interest (bond coupon CHF 0.73m accrued since the last coupon date; RCF interest and commitment fee; eight intercompany loans), and intercompany statements. Local accountants book their side. The pack's *contents* follow the reporting framework: Helvetic reports under **Swiss GAAP FER**, so it carries fair values, accruals and the hedge book — "hedge documentation and effectiveness data" would be IFRS 9 vocabulary, and at GlobalChem (IFRS 9/16) that is exactly what treasury supplies alongside the numbers. One intercompany row behind the WD3 mismatch, in the schedule that goes to Claudia (HM AG → HM Italia):

    | Entity | Principal | Rate | Accrued interest, September |
    |---|---|---|---|
    | HM Italia | EUR 8.0m | 2.35% (quarterly reset; 2.10% booked in error) | EUR 15.7k at 2.35% vs EUR 14.0k booked |

    The close week also collides with the weekly forecast cycle: subsidiaries' Tuesday-noon 13-week submissions land on WD4 and Lea normally consolidates Tue–Wed — this week she pushes the forecast consolidation to Wednesday–Thursday and Daniel's forecast review slips a day with it.

    **WD3** — Reconciliation: GL cash is CHF 1.9m lower than bank cash because HM Deutschland's supplier run was booked on 30 Sept but debited on 1 Oct (value date) — explained. HM Italia booked intercompany interest at 2.10% instead of the reset rate of 2.35%: Lea emails Giulia, who corrects it before consolidation.

    **WD4** — Daniel's report (CHF m, illustrative):

    | Item | 31 Aug | 30 Sep | Comment |
    |---|---|---|---|
    | Cash (bank) | 61.2 | 54.0 | [German August VAT prepayment (due 10 Sep) and seasonal working capital](why:september-vat-driver); of which CNY 55m (CHF 6.1m equivalent) held in China, not freely movable |
    | Gross debt (RCF 60.0 + bond 100.0) | 160.0 | 160.0 | Bond due 2028 |
    | Net debt | 98.8 | 106.0 | |
    | Undrawn committed RCF | 140.0 | 140.0 | |
    | Liquidity headroom (free cash 55.1 / 47.9 + undrawn 140.0 − minimum 10.0) | 185.1 | 177.9 | Free cash excludes the [China balance](why:china-cash-excluded) |
    | Net debt / LTM EBITDA (78.0 from group accounting) | 1.27x | 1.36x | Covenant ≤ 3.25x; formal test 31 Dec |
    | Interest cover (EBITDA / net interest 3.4) | 23x | 23x | Covenant ≥ 4x |

    **Hedges** — EUR net inflows forecast for the next 12 months: EUR 118m; hedged with forwards EUR 58m. Next quarter hedged 80% (policy [60–90%, the bands grade down by quarter](why:hedge-bands-graded)), Q+2 61%, Q+3 41%, Q+4 16%. Average contracted rate 0.9390; market value of all forwards +CHF 0.9m (EUR +0.6m, USD +0.3m) per bank valuations — [valued off the forward curve, not off spot](why:hedge-mtm-forward-curve): the naive spot-only check gives EUR +0.23m (58m × 0.004), but with €STR ≈ 2.2–2.4% against SARON ≈ 0% the four-month EUR/CHF forward is ≈ 0.928, and (0.9390 − 0.928) × 58 ≈ +0.6m. (Continuity note: the November forecast will show Q1 2027 at EUR 30m forwards against EUR 40m of exposure, 75% — quarterly EUR inflows are seasonal and about EUR 6m of new hedges go on in October–November.)

    **Counterparty exposure** — German bank: cash 9.8 + positive forward value 0.3 = CHF 10.1m against a CHF 10m limit (101%) after a EUR 3.1m customer receipt landed on 30 September. Daniel classifies it as a [passive breach](why:passive-vs-active-breach), releases an EUR 2m transfer to HM AG on 1 October (prepared by Lea under the four-eyes rule; exposure back to about 82%) and lists it in the exceptions section.

    **Cash vs RCF** — HM AG holds CHF 9m above its CHF 10m buffer. CHF deposits earn about 0% while RCF drawings cost SARON plus the margin, so Daniel's commentary proposes reducing the CHF drawing by CHF 5m at the 15 October rollover rather than placing a deposit (CHF 35m → 30m; net debt unchanged, interest cost lower, the amount can be redrawn if the forecast turns).

    **Forecast accuracy** — September receipts forecast 4 weeks earlier: CHF 58.0m; actual CHF 52.3m (−9.8%), mostly Italy again.

    **WD5** — Thomas reads the report, asks why net debt rose CHF 7.2m (answer: [the German August VAT prepayment and seasonal working capital](why:september-vat-driver), as forecast) and asks Daniel to bring a first bond-refinancing timetable to the October meeting, because the CHF 100m bond will fall within the 12-month current-liability window of the 2027 year-end accounts and banks and bond investors will want to see a plan well before then. At year-end the same data serves a second master: the auditor's bank confirmations must agree to the same balances and open derivative confirmations are sampled — which is exactly where a shortcut like "2 of 41 forwards confirmed by Daniel himself" surfaces in [treasury policy compliance](wf:policy-compliance).
judgment:
  - decision: Which exceptions go in the report and how prominently
    why: The report's value is in the exceptions; listing everything hides what matters, omitting a breach erodes trust with the CFO and auditors.
  - decision: How to interpret covenant definitions between formal test dates
    why: Loan agreements define EBITDA and net debt differently from the published accounts; treasury, accounting and sometimes legal have to agree the calculation.
  - decision: Whether a limit or hedge-ratio breach is passive (caused by events) or active (caused by a decision), and what remediation is proportionate
    why: A passive breach may be cured by moving cash; an active one is a control failure that must be reported.
  - decision: Which valuation to use when bank and TMS values differ
    why: Policy may specify; otherwise it is a judgment agreed with accounting and auditors, especially for less liquid instruments.
  - decision: What trend to warn about
    why: Headroom and covenant numbers are usually comfortable; the manager's job is to see the quarter when they will not be (refinancing, acquisitions, a downturn).
failure_modes:
  - mode: An account or a deal is missing from the month-end data
    consequence: Cash, debt or derivative exposure understated in the accounts; an auditor finding; at worst an undetected unauthorised trade.
    detection: Account-list completeness check; deal reconciliation against bank confirmations; year-end bank confirmation letters.
  - mode: Treasury and accounting use different FX rates or cut-offs
    consequence: Numbers never reconcile; time wasted every month; the CFO sees two "cash" figures.
    detection: Single rate table; reconciliation of treasury cash to GL cash with listed reconciling items.
  - mode: Intercompany loans booked differently on both sides
    consequence: Consolidation blocked or delayed; wrong interest and withholding-tax treatment.
    detection: Intercompany statements sent by treasury and confirmed by both entities before the close deadline.
  - mode: Covenant computed with the wrong definition
    consequence: False comfort — or a false alarm to lenders; in the worst case, a breach discovered at the formal test.
    detection: Covenant model built from the loan agreement's definitions and reviewed with accounting; legal review of unusual items.
  - mode: Report that repeats tables without commentary
    consequence: The CFO stops reading it; the early-warning function is lost.
    detection: Ask whether any decision or question came out of the last three reports.
  - mode: Manual copying between systems and slides
    consequence: Typos and stale numbers in board materials.
    detection: Tie-out of report totals to the reconciled pack; a second person checks board versions.
software: >-
  At large companies, **TMS** modules (e.g. SAP treasury and risk management, Kyriba, FIS, ION products) hold the
  deal register, value deals from market data, generate accruals and accounting entries, and produce standard limit
  and exposure reports; the CFO/board pack is still usually assembled in PowerPoint. Mid-market companies typically
  have a deal spreadsheet, bank valuation PDFs and an Excel covenant model; **cash-visibility tools** supply balances
  but rarely cover derivatives, debt and covenants. **Consolidation tools** belong to accounting. See [Systems & Data](/systems).
manual_work:
  - Collecting balances for accounts outside automated connectivity (local, escrow, collateral accounts).
  - Typing bank valuation statements into the deal register.
  - Building accrual and intercompany interest lists in Excel.
  - Chasing intercompany booking mismatches with subsidiary accountants.
  - Recomputing covenant ratios from FP&A numbers with loan-agreement adjustments.
  - Copying tables into PowerPoint and writing the same commentary structure every month.
by_size:
  startup: >-
    No treasury report as such. The CFO shows cash, burn and runway on one slide of the monthly board or investor
    update; the external fiduciary or accountant books bank interest. If there are term deposits or venture debt,
    they appear as a line or two. The key month-end number is months of runway.
  sme: >-
    The head of accounting closes the books and includes cash by bank, credit-line usage and perhaps FX exposure in
    the monthly management accounts. Hedging deals (if any) are listed from bank confirmations; covenant ratios are
    calculated when the bank asks for them. No separate treasury report; the CFO comments at the board meeting.
  midmarket: >-
    A small treasury team delivers the accounting pack by WD2 and a 4–8 page CFO report by WD4–WD5, mostly Excel and
    PowerPoint, with quarterly board extracts. Reconciliation with accounting and intercompany interest are the main
    friction; covenant tracking is informal between test dates.
  multinational: >-
    Treasury back office or treasury accounting produces TMS-generated postings and reconciliations on a tight
    timetable (often WD1–WD3), and hedge-accounting documentation in the vocabulary of the reporting framework —
    IFRS 9 designation and effectiveness files at a group like GlobalChem, FER 27's lighter regime (no effectiveness
    testing) at a Swiss GAAP FER group like Helvetic. The monthly multilateral netting cycle runs before the close,
    with settlement mismatches chased by WD1. The middle office runs limit and risk reports; the
    group treasurer presents quarterly to the audit committee and sometimes a treasury committee. Additional external
    reporting: rating-agency metrics, derivative disclosures, lender compliance certificates.
companies:
  kleio: "Sarah's month-end board update has one treasury slide: cash by bank (CHF 22m across three banks, CHF 8m of it in deposits), burn, runway, and the USD balance. Nina books deposit interest when the deposits mature."
  alpine: "Petra closes the books by WD8. Her management pack shows cash by bank and currency, credit-line usage (CHF 3m drawn of 12m) and the open EUR forwards from the house bank's confirmations. Martin presents it to the board quarterly; there is no separate treasury report."
  helvetic: "The worked example above: Lea prepares the pack and tables; Daniel writes the commentary; Claudia's team books; Thomas receives the report by WD5 and takes a quarterly extract to the audit committee."
  globalchem: "SAP treasury modules post deals, accruals and valuations automatically; Marta's back office in Kraków reconciles by WD2 and runs the monthly multilateral netting cycle before the close (settlement mismatches chased by WD1); Jonas's team produces the IFRS 9 hedge-designation, effectiveness and risk reports (GlobalChem reports under IFRS 9/16); Priya reports in-house-bank and pool balances. Anna presents a quarterly treasury report to the audit committee covering liquidity, rating metrics, refinancing, counterparty exposure and policy breaches."
handoffs:
  - from: Banks
    gives: month-end statements, deal confirmations and derivative valuation statements
    to: Treasury analyst / back office
  - from: Group accounting
    gives: close calendar and month-end FX rate table
    to: Treasury analyst
  - from: Treasury analyst
    gives: accounting pack (balances, deals with values, accruals, intercompany statements)
    to: Group accounting and subsidiary accountants
    note: At mid-market companies accounting books; treasury does not post to the ledger.
  - from: Subsidiary finance
    gives: confirmations of local balances and intercompany bookings
    to: Treasury analyst
  - from: FP&A / controlling
    gives: outlook (forecast EBITDA) for headroom projections
    to: Treasury analyst / manager
    note: LTM actual EBITDA for covenant estimates comes from group accounting, which computes the ratios.
  - from: Treasury manager
    gives: monthly treasury report with commentary, exceptions and requested decisions
    to: CFO
  - from: CFO / head of treasury
    gives: quarterly treasury section, breaches, requested approvals
    to: Board / audit committee
  - from: Treasury manager
    gives: covenant compliance certificate (at test dates, signed by the CFO)
    to: Lenders / facility agent
interview: >-
  Ask the analyst to walk you through **last month's close**: what they sent to accounting and when, which numbers did
  not reconcile and why, where the valuations came from, and how long the report took. Ask the treasury manager which
  page of the report the CFO actually reads and what question the CFO asked last time. Ask the head of accounting the
  mirror question: what arrives late or wrong from treasury. See [Who should I interview?](/org/interview-finder).
ai_note: >-
  Much of month-end treasury work is rule-based collection, reconciliation and formatting, and larger companies
  already automate it in TMS/ERP. For mid-market teams, tools that assemble the pack, reconcile to the ledger and
  draft variance commentary look tractable; the output is checkable against bank data. The judgment — covenant
  definitions, what to escalate, how to frame a trend for the board — stays with the treasurer, and board materials
  carry a high accuracy bar.
terms: [month-end-close, cash-position, net-debt, liquidity-headroom, covenant, covenant-headroom, leverage-ratio, interest-cover, ebitda, mark-to-market, hedge-ratio, counterparty-exposure, counterparty-limit, debt-maturity-profile, interest-accrual, closing-rate, forecast-accuracy, intercompany-loan, hedge-accounting, compliance-certificate, treasury-report]
related: [policy-compliance, covenant-monitoring, cash-forecasting, fx-hedging, bank-reconciliation, credit-facility-management]
sources: [deloitte-gts-2024, pwc-gts-2025, ch-co-board-duties, fer-27-derivatives, pwc-fer-financial-instruments-2025]
evidence_note: >-
  The month-end sequence (balances, deal reconciliation, valuations, accruals, reconciliation to the ledger, report)
  is established practice in treasury operations; the WD timings, the report contents and the Helvetic numbers are
  illustrative synthesis consistent with the reference company, not a survey benchmark. No published survey gives a
  standard treasury-report template or close timetable; practice varies widely. The Swiss board's responsibility for
  financial control and planning (and therefore for receiving treasury reporting) follows from Art. 716a CO[](cite:ch-co-board-duties).
  The framework split follows the standards: FER 27's recognition, measurement and note rules for derivatives and its
  lack of an effectiveness-testing requirement[](cite:fer-27-derivatives), and PwC's FER guidance ("no formal
  documentation requirement of the hedge relationship ... no requirement for testing effectiveness") versus IFRS 9
  designation and effectiveness assessment[](cite:pwc-fer-financial-instruments-2025). Survey context on tool
  maturity: about a fifth of Deloitte's respondents (22%) say the maturity of their cash-positioning capability
  requires development[](cite:deloitte-gts-2024), and PwC's 2025 survey of 350 treasurers finds cash and liquidity
  management the top priority, with the largest groups investing in in-house banks, payment factories and
  POBO[](cite:pwc-gts-2025).
