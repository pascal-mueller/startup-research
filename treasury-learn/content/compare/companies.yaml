# "Same problem, four companies" topics owned by the companies-size stream.
# Used on /companies/same-problem, the four company pages and the /size pages.
# All numbers are illustrative and consistent with content/companies.yaml.

- id: co-forecast-error
  title: When the forecast is wrong
  question: Last month's cash came in well below forecast. Who notices, how, and what happens next?
  cells:
    kleio: "Sarah notices at month-end when she updates the runway sheet: a CHF 400k enterprise renewal invoiced in July has not been paid. She emails the customer's procurement contact herself and recalculates runway (still about 24 months). No variance analysis exists — the 'forecast' is the runway model, and the only review is the next board meeting."
    alpine: "Petra sees it in the Monday cash sheet: a CHF 2m acceptance payment from a German logistics customer slipped because the robot failed its acceptance test. Martin calls the project manager, not the customer. The consequence is concrete: the credit line goes from CHF 2m to CHF 4m drawn for a month. Nobody measures forecast accuracy; the lesson is kept in Petra's head."
    helvetic: "Lea's weekly [variance analysis](term:variance-analysis) classifies the CHF 3.4m miss by entity and category — timing vs permanent. Daniel phones Giulia (HM Italia) about the late customer, adds the forgotten German tax dates to a central calendar and haircuts Italy's receipts by 15%. The CFO sees a one-line explanation in the weekly note."
    globalchem: "The forecasting tool flags 6 of 40 entities outside the ±10% accuracy band on 4-week receipts. Priya's analysts send variance requests; the entity CFOs must explain in the tool. Repeated misses go into the quarterly entity scorecard that Anna reviews with the regional CFOs. Group liquidity barely moves — single misses are small relative to CHF 900m of cash."
  takeaway: "The size of the error relative to the cash buffer drives the reaction: at Alpine one project is a funding event, at GlobalChem it is a data-quality KPI."

- id: co-fx-exposure
  title: Finding the FX exposure
  question: Where does each company's currency risk come from, and how does it find out how big it is?
  cells:
    kleio: "USD revenue (~40%) is partly offset by USD costs (US payroll, cloud hosting), so the net USD surplus is roughly USD 1–2m a year; EUR revenue (~20%) has almost no EUR costs. Nobody calculates this formally — Sarah sees it as USD and EUR piling up in the bank accounts."
    alpine: "Sales are 45% EUR and 20% USD; costs are mostly CHF with about EUR 12m of German component purchases. Net EUR long of roughly EUR 24m a year, concentrated in large project milestones. Petra lists signed projects by currency in a tab of the cash sheet; that list is the exposure report."
    helvetic: "The Swiss parent sells in EUR and USD to its own sales subsidiaries and builds in CHF; the Czech plant has CZK costs; the Chinese subsidiary creates CNY translation exposure. Lea collects next-quarter forecast net flows by currency from subsidiary submissions and the 13-week forecast; Daniel treats that as the hedgeable [transaction exposure](term:transaction-exposure)."
    globalchem: "Around 30 currencies with material flows. Subsidiaries report forecast exposures monthly into the TMS; intercompany flows are first offset in monthly [netting](term:netting); balance-sheet exposures in the in-house bank are measured daily. Jonas's team sees a net position per currency pair after all offsets — much smaller than the gross flows."
  takeaway: "Exposure identification is the hard part everywhere; only the largest company has a system that computes a net number automatically — and it still depends on forecasts submitted by people."

- id: co-fx-hedging
  title: Hedging decisions
  question: Should we hedge, how much, with which instrument — and who decides?
  cells:
    kleio: "No hedging. Sarah holds USD and EUR in foreign-currency accounts and converts to CHF when CHF runs low, at her bank's quoted rate. A board member once asked about [forwards](term:forward); the answer was that runway is long and the net amounts small. The real exposure — CHF costs vs USD-denominated fundraising valuations — is not hedgeable anyway."
    alpine: "Ad hoc forwards. When a large EUR project is signed, Martin may sell part of the expected EUR forward at the large Swiss bank ('EUR 2m, 90 days'). The only rule is a board minute allowing hedging of signed contracts. Whether it happens depends on how busy Martin is and whether EUR/CHF has just moved."
    helvetic: "A written policy: hedge 60–90% of next-quarter forecast EUR net inflows, with forwards or plain-vanilla options, only with RCF banks. Daniel executes rolling [forwards](term:forward) monthly; the quarterly treasury committee (Thomas, Daniel, Claudia) approves changes — e.g. raising the USD [hedge ratio](term:hedge-ratio) from 50% to 60% after a large US order."
    globalchem: "Systematic programmes under a board-approved policy: layered forward hedging of 12–18 months of forecast net exposure, FX swaps for in-house-bank balance-sheet positions, options for some uncertain flows; [hedge accounting](term:hedge-accounting) for cash-flow hedges. Jonas's desk trades on a multi-bank platform; Marta's back office confirms. Anna and the CFO approve the policy and ratios, not individual trades."
  takeaway: "Hedging moves from a CFO's occasional judgment call to a policy-driven, repeatable process — the judgment shifts from 'should we trade?' to 'is the forecast behind the hedge any good?'"

- id: co-payment-approval
  title: A large, unusual payment
  question: An unusually large payment request arrives (large relative to the company). Who checks it, who approves, and how is it released?
  cells:
    kleio: "USD 300k to prepay a three-year cloud commitment. Nina enters it in the e-banking portal; Sarah approves in the bank's app as the second signature (collective signature for two). The check is Sarah's memory of the contract and a phone call to the vendor's known account manager to confirm the bank details. The CEO is told, not asked."
    alpine: "CHF 1.2m prepayment to a new Asian component supplier. The AP clerk creates the payment in Business Central; Petra checks the supplier master data change was call-back verified; because it exceeds CHF 250k Martin must be one of the two signatories and signs the EBICS file with his key from his phone."
    helvetic: "CHF 4m down payment to a Swiss machine supplier. The request comes with the signed purchase contract; Lea checks the bank details against the vendor master and the contract, and confirms the payment fits the 13-week forecast. Non-routine payments of CHF 2–10m need the CFO and the CEO. Lea releases it through the connectivity tool before the CHF cut-off; it settles through SIC the same day."
    globalchem: "CHF 40m for a plant expansion instalment. The request comes from the subsidiary's ERP into the payment factory, is flagged by value, matched to the approved capex item, screened for sanctions and fraud rules, and released under the bank mandate by two authorised signatories in treasury — one from Priya's team, one senior manager. Board approval happened at the capex stage, not at payment."
  takeaway: "The controls look alike (two people, verified bank details), but at scale the approval of the spending and the release of the payment become separate events handled by different people."

- id: co-payment-run
  title: The routine payment run
  question: How do ordinary supplier payments get from invoice to bank?
  cells:
    kleio: "Twice a month Nina collects approved invoices, types or uploads them as a batch in the Swiss bank's e-banking and Sarah approves. US payroll and US vendors are paid from Kleio Inc.'s US account; Swiss payroll is run by the external payroll provider and funded from the CHF account."
    alpine: "Every Tuesday and Friday the AP clerk runs the payment proposal in Business Central; Petra reviews it (typically 60–90 payments), removes disputed invoices and releases a [pain.001](term:pain-001) file over [EBICS](term:ebics) to the house bank. The German and US subsidiaries' bookkeepers pay local suppliers through their own bank access."
    helvetic: "Each subsidiary runs its own payment runs from its own ERP and bank channel; local finance releases with two local signatories. For the Swiss parent, the accounting team prepares batches and Daniel or Lea approves as second signatory in the connectivity tool. Treasury does not see subsidiaries' runs until the statements arrive the next morning."
    globalchem: "Around 28 ERPs send payment proposals to the [payment factory](term:payment-factory) in the Kraków shared-service centre, which applies central fraud and sanctions checks and sends around 60,000 payments a month via Swift — in Europe [on behalf of](term:pobo) subsidiaries from the in-house bank's accounts. Payments outside Europe still go through local banks."
  takeaway: "The unit of work changes from 'approve this payment' to 'operate a payment process' — and treasury's involvement moves from signing to designing the controls."

- id: co-liquidity-planning
  title: Liquidity planning and the backstop
  question: Will there be enough cash over the next 12–24 months, and what is the backstop if not?
  cells:
    kleio: "Runway: CHF 22m cash ÷ CHF 0.9m monthly net burn ≈ 24 months. The board rule of thumb is to start fundraising with 12–15 months left. The only backstop on the table is a venture-debt offer, which Sarah is evaluating mainly as insurance rather than for the cash."
    alpine: "A 12-month cash plan built from the budget in Excel, refreshed quarterly. Backstop: the CHF 12m committed [current-account credit line](term:current-account-credit); the board wants at least CHF 5m headroom at all times. The main risk is not the line but several milestone payments slipping in the same quarter."
    helvetic: "An 18-month plan rebuilt quarterly with FP&A (Marco): free cash flow, capex, dividends, debt maturities, covenant headroom. The RCF (CHF 200m, ~CHF 60m drawn) runs to 2027 and the CHF 100m bond is due 2028, so in 2026 the plan is mostly about refinancing timing and keeping net debt / EBITDA well below 3.25x."
    globalchem: "A multi-year funding plan owned by Olivier's corporate-finance team: CHF 900m cash, an undrawn EUR 1.5bn RCF as backstop to the CP programme, CHF 500m bond maturities in 2027 and 2029 pre-funded roughly 12–18 months ahead, and liquidity metrics watched by rating agencies. Anna presents it to the CFO and the board's audit committee."
  takeaway: "From 'months of runway' to 'maturity profile and rating metrics' — the time horizon lengthens and the backstop becomes a formal committed facility."

- id: co-bank-landscape
  title: Banks and accounts
  question: How many banks and accounts does each company have, why, and who manages the relationships?
  cells:
    kleio: "Two Swiss banks (the second added after the 2023 SVB collapse at the board's request) plus a US bank for Kleio Inc.; 7 accounts. Sarah is the relationship: she meets each bank's relationship manager once a year and when she needs something."
    alpine: "A cantonal bank as house bank (CHF payroll, supplier payments, EBICS, the CHF 12m line, the plant mortgage) and a large Swiss bank for FX, EUR and USD; the US subsidiary also keeps a local account. 9 accounts. Martin owns both relationships personally."
    helvetic: "Five banks: two Swiss, one German, one global bank for the US and UK, one Chinese bank; 12 operating accounts after a 2024 [rationalisation](term:bank-account-rationalisation) from 31. The four RCF banks expect ancillary business (FX, cash management) in return for lending; Daniel tracks the wallet roughly."
    globalchem: "About 20 banks and ~280 accounts; seven core banks provide the RCF and get most of the ancillary business. A small bank-relationship function tracks [wallet share](term:wallet-share), handles around 60 KYC refreshes a year and maintains signatories in a bank-account-management tool."
  takeaway: "More banks and accounts come from more countries and more lending needs; each additional account adds statements to reconcile, signatories to maintain and KYC files to refresh."

- id: co-bank-account-opening
  title: Opening a bank account
  question: A new bank account is needed. Who does what, and how long does it take?
  cells:
    kleio: "When Kleio Inc. was founded, Sarah opened the US account herself: company documents, the US tax ID, beneficial-owner declarations, identity documents for the signatories. About 4–6 weeks, mostly waiting for the bank's KYC review. There is no account register other than the Google Sheet."
    alpine: "Opening a new account for the US subsidiary: Martin decides; Petra assembles board resolutions, commercial-register extracts, passports and signature cards; the US managing director signs local forms. Several weeks, plus setting up EBICS or portal access and adding the account to the cash sheet."
    helvetic: "Daniel owns [bank account management](wf:bank-account-management): board resolution for the entity, KYC pack, signatory list aligned with the group's signing rules, connectivity set-up so statements reach the connectivity tool. Typically 4–12 weeks; longer in China. Daniel's policy since 2024: no subsidiary opens an account without treasury approval."
    globalchem: "A request in the bank-account-management tool with a business case; Priya approves, Marta's team handles KYC and documentation, Ben's team sets up statement delivery via the Swift service bureau and TMS master data; internal audit checks the process annually. 6–12 weeks is normal; restricted markets take longer."
  takeaway: "The bank's KYC process is the bottleneck at every size; what changes is whether anyone keeps a complete list of accounts and signatories."

- id: co-investments
  title: Surplus cash
  question: There is more cash than needed. Where does it go, and who decides?
  cells:
    kleio: "After the Series B, Sarah put CHF 8m into 3-month deposits split across the two Swiss banks and keeps the rest on current accounts. The point is safety and spreading bank risk, not yield — CHF deposits earn roughly nothing with the SNB rate at 0%. Surplus USD sits in short US deposits at close to SOFR-level rates; the board's rules also allow a government money market fund, not yet used."
    alpine: "Usually there is no surplus: spare CHF first repays the drawn part of the credit line, which saves interest, whereas a CHF deposit would earn roughly nothing. Spare EUR is kept for EUR supplier payments or converted when Martin sells EUR forward."
    helvetic: "Surplus CHF above the CHF 10m minimum goes to reducing RCF drawings at the next rollover — CHF deposits earn roughly nothing. Surplus EUR is placed as short EUR deposits (1–12 weeks) at around €STR level, within [counterparty limits](term:counterparty-limit) of CHF 30m per A-rated bank and CHF 15m per BBB bank. Daniel decides; Lea checks the 13-week forecast first."
    globalchem: "The in-house bank places daily surpluses overnight with core banks; a EUR 400m liquidity portfolio (deposits, [money market funds](term:money-market-fund), short government bills) is run under a board-approved [investment policy](term:investment-policy) with ratings and counterparty limits. At the same time the group issues commercial paper — gross cash is kept for liquidity and rating reasons."
  takeaway: "Surplus-cash decisions start as 'which bank is safe?' and become a policy-bound portfolio; at every size, safety and liquidity come before yield."

- id: co-intercompany
  title: Funding a subsidiary
  question: A subsidiary is short of cash. How does money get there?
  cells:
    kleio: "Kleio Inc. collects most US customers' USD and pays the eight US salaries. It settles its intercompany invoice to the Swiss parent (which owns the software) quarterly, sending the surplus up. When a large US renewal pays late, Sarah sends USD down from the parent's USD account to cover payroll, and the fiduciary books it against the intercompany balance."
    alpine: "Petra spots the shortfall; Martin approves a transfer from the parent's EUR account to the German subsidiary. The bank also sweeps anything above a threshold from the German account back to the parent each evening — a simple sweep, not a cash pool."
    helvetic: "Daniel instructs an [intercompany loan](term:intercompany-loan) (e.g. EUR 3m to HM Deutschland before payroll), documented under a framework agreement with an arm's-length interest rate agreed with tax. China is different: cash can come out mainly as an annual dividend, so it is excluded from concentration."
    globalchem: "Automatic: European subsidiaries are swept to zero daily into the in-house bank's [physical pool](term:physical-pooling), so a shortfall is simply an internal overdraft at the in-house bank. Outside the pools, the Singapore centre or Priya's team funds entities by intercompany loan; tax and transfer pricing set the rates."
  takeaway: "Funding moves from an ad hoc transfer someone remembers to a structure (sweep, pool, in-house bank) that makes it automatic — with tax and legal documentation growing alongside."

- id: co-systems
  title: The systems on screen
  question: Which systems does the person doing treasury actually open?
  cells:
    kleio: "Three e-banking portals, the accounting software (Bexio-class), Stripe's dashboard, and one Google Sheet that holds balances, deposits and the runway model."
    alpine: "Business Central (AP, AR, payment proposals), an ERP-connected banking module that sends files over EBICS to both Swiss banks, two e-banking portals, and Excel for the cash sheet and FX list. No TMS."
    helvetic: "SAP S/4HANA in CH/DE/CZ and four other ERPs in the smaller subsidiaries; a multibank connectivity tool that collects statements and sends payments; bank FX portals; Excel workbooks for positioning, forecasting, hedging and covenants. A TMS project is in evaluation."
    globalchem: "SAP S/4HANA with SAP treasury modules as TMS, Swift connectivity via a service bureau, a multi-bank FX trading platform, Bloomberg for market data, a separate cash-forecasting tool, and a bank-account-management tool. Excel still appears around the edges — ad hoc analysis, board packs, and processes the systems do not cover."
  takeaway: "Spreadsheets never fully disappear; what changes is whether they are the system of record or a working layer on top of one."

- id: co-controls
  title: Payment fraud controls
  question: What would stop a fraudulent payment request?
  cells:
    kleio: "Two signatures in e-banking (Nina and Sarah) and Sarah's instinct. The weakest point: a CEO-impersonation email to Nina while Sarah is travelling. The bank's own fraud monitoring is the second line."
    alpine: "Petra's rule: no supplier bank-detail change without a call-back to a known number and a second person approving the change in Business Central; above CHF 250k Martin must co-sign. The key-person risk is that Petra is the only one who fully understands the EBICS set-up."
    helvetic: "Vendor-master changes blocked until a second person confirms by phone; signing matrix by amount; treasury approves as second signatory for the parent. The gap is the subsidiaries: eight local teams with their own bank access and different levels of discipline."
    globalchem: "Central controls in the payment factory: sanctions screening, duplicate and anomaly rules, bank-detail verification, strict [segregation of duties](term:segregation-of-duties) between the FX front office and back office, and user-rights reviews across ~280 accounts. The residual risk sits in countries outside the factory and in the sheer number of users."
  takeaway: "Small companies rely on people knowing each other; large ones rely on systems and segregation — and both remain exposed where the process has exceptions."

- id: co-reporting
  title: What management sees
  question: What does the CFO, CEO or board actually see about cash, and how often?
  cells:
    kleio: "A runway slide in the quarterly board deck: cash, burn, months of runway, next fundraising milestone. Sarah tells the CEO weekly if anything unusual happens."
    alpine: "Martin gets Petra's cash sheet every Monday; the board sees cash, credit-line usage and headroom against the CHF 5m minimum in the monthly or quarterly reporting."
    helvetic: "A weekly one-page note from Daniel to the CFO (cash, low point, headroom, key changes); a monthly treasury report with forecast, hedge ratios, covenant headroom and counterparty exposure; the quarterly treasury committee; covenant certificates to the RCF agent semi-annually."
    globalchem: "Daily dashboards for treasury management; a monthly treasury report to the CFO (liquidity, funding, FX, counterparty, policy compliance, forecast accuracy); quarterly reporting to the audit committee; annual policy approval by the board; rating-agency meetings once or twice a year."
  takeaway: "Reporting grows from one number (runway) to a set of policy-compliance metrics — and producing it is a large share of the analyst workload at mid-market and above."

- id: co-key-person
  title: Holiday cover
  question: What happens when the person who does treasury is away for two weeks?
  cells:
    kleio: "Sarah schedules deposits to roll over before she leaves and pre-approves payroll; the CEO is the backup signatory. Nothing else happens — which is usually fine."
    alpine: "The biggest operational risk the company has. A senior accountant runs the payment runs from a checklist; the cash sheet is not updated. Martin looks at the portals himself."
    helvetic: "Lea and Daniel cover each other, which means one person does two jobs and forecast quality drops. When both are away (rare, but it happens), the CFO signs and positions are checked only every few days."
    globalchem: "Every role has a documented deputy; the process runs without any single person. The risk shifts to system outages and key-person knowledge in treasury systems (Ben's team)."
  takeaway: "Key-person dependency is one of the most consistent pain points below the multinational tier — worth asking about in every interview."
