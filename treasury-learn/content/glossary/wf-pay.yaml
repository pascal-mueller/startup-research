# Glossary terms for stream wf-pay (payments, bank reconciliation, bank accounts, bank fees).

- id: sct-inst
  term: Instant payments (SCT Inst / SIC IP)
  aka: [instant credit transfer, SCT Inst, real-time payments, RTP, FedNow]
  category: Payments
  plain: Payments that reach the recipient's account within seconds, at any hour, any day.
  professional: "Account-to-account credit transfers settled in near real time 24/7/365: SCT Inst in euro (under the EU Instant Payments Regulation euro-area banks had to receive by Jan 2025 and send by Oct 2025, at no higher price than a normal SEPA transfer); SIC Instant Payments in CHF (receiving mandatory for large Swiss banks since Aug 2024, all by end-2026); RTP and FedNow in the US. Irrevocable once sent, which is why fraud controls matter more."
  example: "Kleio pays a freelance designer's EUR invoice as SCT Inst on a Saturday; it is credited in seconds. The same irrevocability means a payment to a fraudster cannot be stopped."
  related: [sepa, sic, verification-of-payee, rtgs-note]

- id: sic
  term: SIC (Swiss Interbank Clearing)
  aka: [SIC5, SIC IP, euroSIC]
  category: Payments
  plain: Switzerland's central payment system through which Swiss franc payments between banks are settled.
  professional: "The Swiss RTGS system for CHF, operated by SIX on behalf of the Swiss National Bank. Settles high-value and retail CHF payments individually and irrevocably in central-bank money. Since 2023 the SIC5 platform also carries SIC Instant Payments (24/7). euroSIC is the parallel system for euro payments in Switzerland."
  example: "Helvetic's CHF 4m down payment to a Swiss supplier leaves HM AG's account and is settled through SIC on the same day, provided Lea submits it before the bank's CHF cut-off."
  related: [rtgs-note, sct-inst, qr-bill, settlement]

- id: pain-001
  term: pain.001 (payment instruction file)
  aka: [pain.001, customer credit transfer initiation, payment file]
  category: Banking & connectivity
  plain: The standard electronic file a company sends its bank to say "please make these payments".
  professional: "ISO 20022 CustomerCreditTransferInitiation message: a group header, one or more payment information blocks (debtor account, requested execution date, payment method) and individual transactions (amount, creditor, creditor account, remittance information, end-to-end ID). Country and bank variants (e.g. Swiss Payment Standards, CGI-MP) define usage; generated by the ERP/TMS and transmitted via EBICS, SWIFT, host-to-host or upload."
  example: "Alpine's Tuesday run creates one pain.001 with three payment-information blocks — CHF domestic, EUR SEPA, USD cross-border — containing 84 transactions, which Petra uploads via EBICS."
  related: [pain-002, iso-20022, ebics, payment-run]

- id: pain-002
  term: pain.002 (payment status report)
  aka: [status report, PSR, payment status report]
  category: Banking & connectivity
  plain: The bank's electronic reply saying which payments in a file it accepted and which it rejected, and why.
  professional: "ISO 20022 CustomerPaymentStatusReport returned for a pain.001 at file, batch or transaction level with status codes (e.g. ACCP accepted, ACSC settled, RJCT rejected, PART partially accepted) and reason codes (e.g. AC01 incorrect account number, AM04 insufficient funds). Needs to be imported and monitored — otherwise rejections are noticed only when a supplier complains."
  example: "The pain.002 for Alpine's run shows 83 accepted and one rejected with AC04 (account closed); Petra calls the supplier on the number in Business Central to get the new IBAN — and has the change approved by a second person before re-paying."
  related: [pain-001, camt-054, iso-20022]

- id: camt-054
  term: camt.054 (debit/credit notification)
  aka: [camt.054, booking notification, ESR/QR detail]
  category: Banking & connectivity
  plain: A bank report listing the individual items behind a single booking — for example every supplier inside a batch payment or every customer reference behind a collective credit.
  professional: "ISO 20022 BankToCustomerDebitCreditNotification. Used intraday or end of day to confirm individual debits/credits and, crucially for reconciliation, to break down batch bookings (one camt.053 line for a whole payment run) and to deliver QR/creditor references for automated receivables matching."
  example: "Alpine's camt.053 shows one debit of CHF 1.9m for the Tuesday run; the camt.054 lists the 83 executed payments so the ERP can clear each vendor invoice individually."
  related: [pain-002, bank-statement, reconciliation, qr-bill]

- id: swift-gpi
  term: Swift gpi
  aka: [gpi, global payments innovation, UETR, gpi tracker]
  category: Payments
  plain: A Swift service that lets banks — and their corporate customers — track a cross-border payment like a parcel, and see fees deducted along the way.
  professional: "Rulebook and tracker on the Swift network in which each payment carries a Unique End-to-end Transaction Reference (UETR) and each bank in the chain reports status, charges and FX applied. Corporates access it via their bank's portal/API or directly (gpi for Corporates). Related services include pre-validation of beneficiary account details."
  example: "A USD 60k payment from Helvetic to a Brazilian distributor hasn't arrived. Lea looks up the UETR in the bank portal: credited to the beneficiary bank yesterday, USD 25 deducted by an intermediary — the problem is at the receiving bank, not Helvetic's."
  related: [swift, correspondent-banking, iso-20022]

- id: correspondent-banking
  term: Correspondent banking
  aka: [correspondent bank, intermediary bank, nostro/vostro]
  category: Payments
  plain: The chain of banks that holds accounts with each other so money can move between countries and currencies.
  professional: "Arrangement where a bank (correspondent) holds accounts for other banks (respondents) and settles payments on their behalf, usually instructed over Swift. A cross-border payment may pass through one or more intermediaries, each of which may screen, delay or deduct fees (with OUR/SHA/BEN charge options). Correspondent 'de-risking' has reduced coverage for some countries."
  example: "Alpine's USD payment to a US component supplier goes from its Swiss bank to the bank's USD correspondent in New York and then via Fedwire to the supplier's bank; with SHA charges the supplier receives USD 20 less than invoiced."
  related: [swift, swift-gpi, fedwire, sanctions-screening]

- id: fedwire
  term: Fedwire / ACH
  aka: [Fedwire Funds Service, wire, ACH, Same Day ACH, CHIPS]
  category: Payments
  plain: The main US payment rails — Fedwire for urgent, high-value wires settled immediately, ACH for cheaper batch payments such as payroll and supplier runs.
  professional: "Fedwire Funds Service: the Federal Reserve's RTGS system (final, irrevocable, per payment). ACH: batch clearing under Nacha Operating Rules (credits and debits, same-day or next-day settlement; returns possible). CHIPS is a private high-value netting system. Checks remain widely used by US businesses and are the most fraud-exposed method; RTP and FedNow add instant payments."
  example: "Kleio Inc. pays its US payroll by ACH through the payroll provider two days before payday, and a USD 180k annual cloud invoice by Fedwire when the vendor insists on immediate funds."
  related: [positive-pay, correspondent-banking, sct-inst, rtgs-note]

- id: three-way-match
  term: 3-way match
  aka: [three-way match, 2-way match, invoice matching, PO-GR-IR match]
  category: Working capital
  plain: The check that an invoice matches what was ordered and what was actually delivered before it is approved for payment.
  professional: "AP control comparing purchase order (price, quantity, terms), goods receipt / service entry and supplier invoice within tolerances; mismatches block the invoice for payment until resolved by procurement or the requester. A 2-way match (PO vs invoice) is used for services or low-value items; non-PO invoices need separate approval workflows."
  example: "An Alpine invoice for 400 servo motors at EUR 118 arrives; the goods receipt shows 380 received. Business Central blocks the invoice until the warehouse confirms the remaining 20 or the supplier credits EUR 2,360."
  related: [payment-run, vendor-master-data, segregation-of-duties]

- id: vendor-master-data
  term: Vendor master data
  aka: [supplier master data, creditor master, bank-detail change, vendor bank details]
  category: Risk & control
  plain: The supplier records in the ERP — name, address, bank account, payment terms — from which every payment is generated.
  professional: "ERP master records used by the payment run. Because a payment goes wherever the master record says, changes to bank details are the main entry point for vendor-imposter fraud; controls include restricted edit rights, dual approval of changes, call-back verification to a known contact, change logs and 'sensitive field' locks (e.g. SAP's confirmation of changes), and first-payment holds."
  example: "At Helvetic, a changed IBAN for any supplier is blocked for payment until a second person in the accounting team confirms it by phone with the supplier's known contact and approves the change in SAP."
  related: [call-back-verification, business-email-compromise, segregation-of-duties, three-way-match]

- id: sanctions-screening
  term: Sanctions screening
  aka: [sanctions check, OFAC screening, SECO list, embargo screening]
  category: Risk & control
  plain: Checking that the people, companies, banks and countries in a payment are not on government sanctions lists.
  professional: "Comparison of counterparties (and for banks, payment messages) against lists such as SECO (Switzerland), EU consolidated list, OFAC SDN (US), UK OFSI and UN, with fuzzy matching and manual review of hits. Banks screen every payment; corporates typically screen customers and vendors at onboarding and periodically, and payment factories often screen outgoing files before release. Hits delay or block payments."
  example: "GlobalChem's payment factory holds a EUR 38k payment because the beneficiary's name partially matches an EU-listed entity; the compliance analyst clears it as a false positive after checking the address and registration number."
  related: [correspondent-banking, payment-factory, kyc]

- id: call-back-verification
  term: Call-back verification
  aka: [call-back, callback, out-of-band verification, second-channel verification]
  category: Risk & control
  plain: Phoning the person or supplier on a number you already had — never the one in the email — to confirm a payment request or a change of bank details.
  professional: "Out-of-band confirmation of payment instructions and master-data changes using independently sourced contact data (vendor master, contract, prior correspondence), documented with who called whom, when and what was confirmed. Recommended by national cyber authorities (e.g. Switzerland's BACS) against CEO and vendor-imposter fraud."
  example: "Lea receives an email from the 'CEO' asking for an urgent CHF 850k transfer for a confidential acquisition. She calls the CEO's mobile from the internal directory; he knows nothing about it."
  related: [business-email-compromise, vendor-master-data, four-eyes-principle, verification-of-payee]

- id: signing-authority-matrix
  term: Signing authority matrix
  aka: [approval matrix, delegation of authority, DoA, authority limits, Kompetenzordnung]
  category: Organisation
  plain: The table that says who may approve what, up to which amount.
  professional: "Board-approved schedule (part of the organisational regulations / treasury policy) of approval limits by transaction type and amount — e.g. payments, capex, contracts, intercompany loans, hedges — specifying single vs joint approval and escalation to CFO, CEO or board. Must be consistent with the bank mandates and e-banking rights, which is often not the case after reorganisations."
  example: "Helvetic's matrix: routine AP payments are released by two local signatories; non-routine payments of CHF 2–10m need CFO and CEO; anything above CHF 10m, or capex not in the budget above CHF 5m, needs the board."
  related: [four-eyes-principle, signatory, payment-mandate, treasury-policy]

- id: business-email-compromise
  term: Business email compromise (BEC) / CEO fraud
  aka: [BEC, CEO fraud, fake president fraud, vendor imposter fraud, payment diversion fraud]
  category: Risk & control
  plain: Fraudsters pretend — by email, phone or even a cloned voice — to be the boss or a supplier and trick staff into paying them.
  professional: "Social-engineering fraud in which a spoofed or compromised email account (or deepfake call) impersonates an executive ('CEO fraud'), supplier ('vendor imposter', change of bank details) or adviser to induce an authorised payment. In AFP's 2026 survey 74% of US organisations were affected in 2025; the FBI's IC3 recorded close to USD 2.8bn of BEC losses in 2024."
  example: "A spoofed email 'from' Helvetic's CEO asks Lea, on a Friday at 16:30 while the CFO is travelling, to wire CHF 850k to a Hong Kong account for a confidential deal. The urgency, secrecy and new beneficiary are the classic markers."
  related: [call-back-verification, vendor-master-data, verification-of-payee, four-eyes-principle]

- id: positive-pay
  term: Positive pay
  aka: [check positive pay, ACH positive pay, payee positive pay, ACH debit block]
  category: Risk & control
  plain: A US bank service where the company tells the bank which checks it wrote, and the bank refuses any check that doesn't match.
  professional: "Fraud control in which the issuer sends an issued-check file (number, amount, often payee name) to the bank; presented items that don't match are held as exceptions for the client to pay or return, usually by a daily deadline. ACH debit blocks/filters and ACH positive pay play the same role for unauthorised debits."
  example: "Alpine Inc.'s US bookkeeper uploads a check-issue file after each run; one morning the bank flags a USD 9,400 check with an altered payee name, which she rejects in the portal before the 11:00 decision deadline."
  related: [fedwire, business-email-compromise, reconciliation]

- id: suspense-account
  term: Suspense account
  aka: [clearing account, unallocated cash, bank clearing account, cash in transit]
  category: Accounting & tax
  plain: A temporary holding account in the books for bank items that haven't yet been matched to the right invoice or cost.
  professional: "GL account used by the reconciliation process to post unmatched bank transactions so that the bank GL balance agrees with the statement while items are investigated. Needs an ageing report and regular clearing; old balances are an audit finding and can hide errors or fraud."
  example: "Helvetic's unallocated-receipts account holds CHF 312k at month-end: 41 customer payments without usable references. Claudia's team clears all but CHF 18k within five working days."
  related: [reconciliation, bank-statement, camt-054]

- id: bank-services-billing
  term: Bank Services Billing (camt.086 / AFP service codes)
  aka: [BSB, camt.086, TWIST BSB, AFP Service Codes, AFP Global Service Codes]
  category: Banking & connectivity
  plain: Standard codes and a standard file format that let a company compare bank fees across banks without translating each bank's own descriptions.
  professional: "ISO 20022 camt.086 (BankServicesBillingStatement), developed from the TWIST BSB standard, reports volumes, prices, taxes and balance credits in structured form; AFP Service Codes (US, since 1986, major overhaul 2020) and AFP Global Service Codes classify services consistently. Coverage varies by bank and country; many banks still send PDFs."
  example: "GlobalChem requires camt.086 from its seven core banks; the TMS maps each line to AFP global codes so Ben can compare 'SEPA credit transfer, file-based' costs across banks in one table."
  related: [account-analysis, iso-20022, tms]

- id: ebam
  term: eBAM (electronic bank account management)
  aka: [eBAM, bank account management, BAM, account register]
  category: Banking & connectivity
  plain: Keeping one central record of every bank account and signatory, and ideally opening, changing and closing accounts electronically instead of on paper.
  professional: "Two related things: (1) an internal bank-account-management register (often a TMS module) holding accounts, purpose, owner entity, mandates, signatories, users and documents with workflow approvals; (2) the ISO 20022 acmt message set for exchanging account opening/maintenance/closing requests with banks over Swift. (2) has seen limited bank adoption since its introduction around 2011; (1) is widespread among large companies."
  example: "GlobalChem's TMS register lists ~280 accounts; when a Kraków team member leaves, Marta's team generates signatory-removal letters for the 11 banks where she was a user, and tracks each bank's confirmation."
  related: [signatory, payment-mandate, kyc, dormant-account, tms]

- id: dormant-account
  term: Dormant account
  aka: [inactive account, unused account]
  category: Banking & connectivity
  plain: A bank account that is still open but hardly used — a cost, a control gap and a common target for fraud.
  professional: "Account with no customer-initiated activity for a defined period (bank or regulatory definitions vary). For corporates, a symptom of poor bank account management: it keeps mandates and e-banking users alive, incurs fees and KYC requests, and may not be in the reconciliation or cash-visibility scope. Account rationalisation projects target them first."
  example: "Helvetic's 2024 review found 7 of 31 accounts had fewer than ten transactions in a year, including a CZK account at a local bank with a former controller still listed as a signatory."
  related: [ebam, signatory, payment-mandate, kyc]
