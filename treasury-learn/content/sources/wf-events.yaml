- id: neugroup-svb-2023
  title: "SVB Shockwaves: Updating Bank Counterparty Credit Risk Strategy"
  publisher: NeuGroup
  year: 2023
  url: https://connect.neugroup.com/public/blogs/svb-shockwaves-updating-bank-counterparty-credit-risk-strategy
  type: survey
  note: >-
    NeuGroup "Best Practices in Assessing Bank Counterparty Risk" survey of member treasuries (mostly large US
    corporates; sample size not stated in the snippet): the crisis triggered a reassessment of bank counterparty
    credit management at 81% of treasuries; 69% planned fundamental changes; the most common strategy was greater
    deposit diversification, alongside more cash in government money market funds. (The earlier neugroup.com URL has
    moved to connect.neugroup.com; the recorded URL is the location found in review round 1.)
- id: co-art-725
  title: "Code of Obligations (SR 220), Art. 725 — Notification of the court in the event of capital loss, over-indebtedness or threatened illiquidity"
  publisher: Swiss Confederation (Fedlex)
  year: 2023
  url: https://www.fedlex.admin.ch/eli/cc/27/317_321_377/en
  type: official
  note: >-
    Statutory basis for the board's liquidity duties in Switzerland. Under the revised company law in force since
    1 January 2023, Art. 725(1) CO obliges the board to monitor solvency (Zahlungsfähigkeit) and take remedial action,
    and Art. 725(2) requires it to notify the court if insolvency is threatened and no postponement can be obtained
    (Art. 725a governs capital loss, Art. 725b over-indebtedness). Confirmed against the statutory text and law-firm
    commentary (Walder Wyss, "Pflichten des Verwaltungsrats in finanziellen Krisenlagen nach neuem Aktienrecht", 2023)
    in review round 1.
