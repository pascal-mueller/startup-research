# Sources for the org-roles stream (role pages, roles.yaml, who-knows-what).
# Verification note: in this authoring session WebFetch was blocked by the network proxy for every domain, so the
# notes below record what the publisher's own search-result text showed (title, URL, snippet). Job advertisements
# are single-company evidence: they show what that employer expects, not what the profession does everywhere.
- id: act-competency-framework
  title: ACT Competency Framework
  publisher: Association of Corporate Treasurers (ACT)
  url: https://www.treasurers.org/cpd-and-training/competency-framework/
  type: standard
  note: "Built with senior treasurers, banks and L&D teams. Three competency areas (technical, business, behavioural), mapped to four job levels: tactical, operational, managerial, strategic. Used here to frame analyst → manager → head-of-treasury progression."
- id: act-wiki-front-office
  title: Front office (ACT Wiki)
  publisher: Association of Corporate Treasurers (ACT)
  url: https://wiki.treasurers.org/wiki/Front_office
  type: standard
  note: "Front office: works with the business to identify exposures, provides market information and pricing advice, cash management, dealing (money markets, FX, interest rates, long-term funding) and deal entry into the TMS."
- id: act-wiki-middle-office
  title: Middle office (ACT Wiki)
  publisher: Association of Corporate Treasurers (ACT)
  url: https://wiki.treasurers.org/wiki/Middle_office
  type: standard
  note: "Middle office (predominantly in large organisations): checks deals follow authorisation rules, monitors limits and reports breaches, analyses and reports exposures and performance, maintains bank account and dealing mandates, processes changes in standing data such as SSIs."
- id: act-wiki-back-office
  title: Back office (ACT Wiki)
  publisher: Association of Corporate Treasurers (ACT)
  url: https://wiki.treasurers.org/wiki/Back_office
  type: standard
  note: "Back office: confirms treasury transactions promptly, settles deals when due, performs bank reconciliations, accounts for transactions, provides reporting where no middle office exists, supervises TMS controls. Front- and back-office roles should be performed by different people with different reporting lines."
- id: act-wiki-sod
  title: Segregation of duties (ACT Wiki)
  publisher: Association of Corporate Treasurers (ACT)
  url: https://wiki.treasurers.org/wiki/Segregation_of_duties
  type: standard
  note: "'No employee should be in a position both to commit and to conceal fraud or errors'; several people and/or systems should be involved in a transaction's life cycle. Summary used: the front office does the deal but doesn't settle the money; the back office settles but doesn't deal."
- id: job-six-treasury-manager
