- id: efd-finfrag-2022
  title: Federal Council commissions revision of Financial Market Infrastructure Act
  publisher: Swiss Federal Department of Finance (FDF / EFD) via admin.ch
  year: 2022
  url: https://www.admin.ch/en/nsb?id=90555
  type: official
  note: "Press release of 30 Sep 2022 (verified on the admin.ch press-release page in review round 1). The derivatives trade-reporting duty for small non-financial counterparties (e.g. industrial companies) was postponed by ordinance amendment to enter into force on 1 January 2028 ('with effect from 1 January 2028'), to give Parliament time to decide on the FMIA revision; reporting duties already applicable to other participants are unaffected. The Federal Council's FMIA revision draft followed in June 2024 (consultation to Oct 2024)."

- id: cms-fmia-revision-2025
  title: Swiss Federal Council commissions revision of the Financial Market Infrastructure Act (FMIA)
  publisher: CMS Switzerland (law-firm legal update)
  year: 2025
  url: https://cms.law/en/che/legal-updates/swiss-federal-council-commissions-revision-of-financial-market-infrastructure-act-fmia
  type: practitioner
  note: "Currentness note on the FinfraG/FMIA revision: the package proposes abolishing the derivatives reporting duty for small non-financial counterparties entirely, with Parliament to decide before the postponed 2028 start date; the revision reached the dispatch/parliament phase in 2025–2026. Law-firm summary, not the primary text — check the current status before relying on it."

- id: fmia-art108
  title: "Financial Market Infrastructure Act (FinfraG/FMIA), Art. 108 — Mitigation of operational and counterparty risk"
  publisher: Swiss Confederation (text via lawbrary.ch)
  year: 2019
  url: https://lawbrary.ch/law/art/FINFRAG-v2019.01-en-art-108
  type: official
  note: "Counterparties to non-centrally cleared OTC derivatives must confirm contractual terms in a timely manner; must have portfolio-reconciliation procedures except where the counterparty is a small non-financial counterparty; must have dispute-resolution procedures; portfolio compression applies only with 500+ outstanding uncleared trades."

- id: isda-emir-refit-mdr
  title: EMIR Refit — mandatory delegated reporting
  publisher: ISDA
  year: 2020
  url: https://www.isda.org/a/meuTE/EMIR-Refit_mandatory-delegated-reporting_final.docx
  type: practitioner
  note: "From 18 June 2020 EU financial counterparties are responsible and legally liable for reporting OTC derivatives on behalf of both themselves and their NFC- clients (non-financial counterparties below the clearing threshold); the NFC- must supply the data the FC cannot reasonably be expected to possess. Applies to OTC, not exchange-traded, derivatives."

- id: linklaters-emir3-2025
  title: EMIR 3 – ESMA consults on new clearing thresholds regime
  publisher: Linklaters
  year: 2025
  url: https://www.linklaters.com/knowledge/publications/alerts-newsletters-and-guides/2025/april/09/title
  type: practitioner
  note: "EMIR 3 entered into force on 24 December 2024. The new clearing-threshold methodology (based on uncleared OTC volumes, excluding ETDs and voluntarily cleared OTC) applies only once the Level 2 technical standards apply. A July 2026 Linklaters alert is headlined 'Commission adopts regulatory technical standards on the clearing thresholds regime' (headline only verified)."

- id: ifrscommunity-ifrs9-hedge
  title: Hedge Accounting (IFRS 9)
  publisher: IFRScommunity.com
  year: 2024
  url: https://ifrscommunity.com/knowledge-base/ifrs-9-hedge-accounting/
  type: practitioner
  note: "IFRS 9 qualifying criteria: formal designation and documentation at inception (risk-management objective and strategy, hedging instrument, hedged item, nature of risk, how effectiveness is assessed including sources of ineffectiveness and hedge-ratio determination); economic relationship; credit risk does not dominate; hedge ratio consistent with actual quantities. Retrospective designation not allowed; IAS 39's 80–125% bright line replaced by a principles-based test."

- id: bdo-ifrs9-hedge-doc
  title: Hedge accounting documentation under IFRS 9
  publisher: BDO UK
  year: 2018
  url: https://www.uk-tst2.bdo.global/en-gb/insights/business-edge/business-edge-2018/hedge-accounting-documentation-under-ifrs-9
  type: practitioner
  note: Practitioner explanation of what IFRS 9 hedge documentation must contain; consistent with the IFRScommunity summary.

- id: pwc-ch-fer-fi-2025
  title: Swiss GAAP FER — Financial Instruments
  publisher: PwC Switzerland
  year: 2025
  url: https://www.pwc.ch/en/publications/2025/Swiss-GAAP-FER-Financial-Instruments.pdf
  type: practitioner
  note: "Swiss GAAP FER 27 contains the essential hedge-accounting rules; IFRS-style comprehensive documentation and effectiveness tests are not required. Derivatives are measured at current (fair) value, or on the same basis as the hedged underlying. Hedges of future transactions (section 18) are dealt with only rudimentarily: the future cash flows must be highly probable, and the hedge result can be recognised in equity or disclosed in the notes. Seen via publisher snippet; a revised FER 27 is referenced in KPMG's 2027 FER checklist and was not reviewed."

