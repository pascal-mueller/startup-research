- id: lma-facility-sample
  title: Loan Market Association facility agreement (teaching copy)
  publisher: Queen Mary University of London (LMA-form document)
  year: 2020
  url: https://qmplus.qmul.ac.uk/mod/resource/view.php?id=2678916
