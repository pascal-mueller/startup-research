  note: "LMA-form mechanics, e.g. a borrower draws by delivering a duly completed Utilisation Request to the Agent not later than 10:00 on the third Business Day before the proposed Utilisation Date. Actual notice periods vary by agreement and by loan type (term-rate vs compounded-RFR loans)."

- id: heidelberg-sfa-2014
  title: Syndicated facility agreement executed on 25 February 2014
  publisher: HeidelbergCement / Heidelberg Materials
  year: 2014
  url: https://www.heidelbergmaterials.com/sites/default/files/assets/document/bc/db/syndicated_facility_agreement_executed_on_25_february_2014.pdf
