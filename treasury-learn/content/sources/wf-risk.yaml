- id: zanders-saron
  title: Calculation of compounded SARON
  publisher: Zanders
  year: 2021
  url: https://zandersgroup.com/en/insights/blog/calculation-of-compounded-saron
  type: practitioner
  note: "Compounded SARON in arrears: interest is known only near the end of the interest period; lookback variant shifts the observation period a few days earlier so interest can be calculated and invoiced on the payment date. Used in LMA-style CHF loans, FRNs and derivatives."

- id: milltech-hedge-monitor-2026
  title: The Corporate Hedging Monitor Q1 2026
  publisher: MillTech (MillTechFX / Millennium Global Treasury Services)
  year: 2026
  url: https://milltech.com/resources/currency-insight-and-education/the-corporate-hedging-monitor-q1-2026
  type: vendor
  note: "Vendor-sponsored quarterly survey of 250 senior finance decision-makers at UK and US corporates (market cap USD 50m–1bn — the corporate sample). Q1 2026: average hedge ratio reached 57% (from 49% in Q4 2025) and average hedge tenor 6.62 months (from 6.33); 96% reported losses from unhedged FX exposure. Figures seen on the publisher's own report page and confirmed by The Full FX (29 May 2026) and CFOtech UK (28 May 2026). The vendor's earlier Global FX Report 2025 (750 corporates + 750 fund managers) showed ≈ 48–49% and ≈ 5.3 months."
