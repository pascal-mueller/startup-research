# Sources for the Agentic Treasury / Startup Lens stream.
# WebFetch was blocked by the environment's egress policy during authoring; every note below records only what the
# original publisher's own page showed in search results. Vendor sources support "what the vendor claims", never
# market-wide or accuracy claims.
- id: sap-cash-agent
  title: "AI Assistant for Cash and Treasury (Joule) / Joule Agents: Cash Management Agent"
  publisher: SAP
  year: 2025
  url: https://www.sap.com/use-cases/joule-assistant/cash-treasury-ai
  type: vendor
  note: "Vendor description: the Cash Management Agent retrieves opening balances, forecasts cash flows, calculates closing balances per bank account, shows surplus/deficit accounts and suggests bank-transfer options using transfer templates, 'in line with treasury policy'. SAP says its internal IT deployed it with S/4HANA. Vendor claim — no independent evidence of results."
- id: kyriba-tai-2025
  title: "New Agentic AI Solution Elevates Data-Driven Decision-Making (TAI launch)"
  publisher: Kyriba
  year: 2025
  url: https://www.kyriba.com/news/kyriba-agentic-ai-solution-tai-transforms-finance-with-security-compliance-trust/
  type: vendor
  note: "Press release, 13 May 2025: TAI, an 'agentic AI' with an embedded LLM, positioned to 'augment — not replace — human expertise' across treasury, payments, risk and working capital; claims faster exception resolution ('hours to minutes'). Vendor claim."
- id: highradius-autonomous-2027
  title: HighRadius Announces a 2027 Goal of Releasing a Fully Autonomous Finance Platform at Radiance
  publisher: HighRadius (Business Wire press release)
  year: 2025
  url: https://www.businesswire.com/news/home/20250226984748/en/HighRadius-Announces-a-2027-Goal-of-Releasing-a-Fully-Autonomous-Finance-Platform-at-Radiance
