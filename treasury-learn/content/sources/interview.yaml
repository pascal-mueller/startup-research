  publisher: Association of Corporate Treasurers (ACT)
  year: 2026
  url: https://www.treasurers.org/ACTAC26
  type: official
  note: "12–13 May 2026, Liverpool; described as the UK's largest treasury conference and exhibition. 2025 edition: 1,164 delegates, 124 speakers, 85 sponsors and exhibitors (ACT's own figures)."
- id: afp-conference-2026
