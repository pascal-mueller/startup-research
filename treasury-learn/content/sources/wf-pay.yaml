- id: afp-pfc-2026-highlights
  title: 2026 AFP Payments Fraud and Control Survey Report — Key Highlights
  publisher: AFP / Truist (underwriter)
  year: 2026
  url: https://www.truist.com/content/dam/truist-bank/us/en/documents/info/cci/2026-afp-payments-fraud-control-survey-report-key-highlights.pdf
  type: survey
  note: "Key-highlights summary of the 2026 survey (data for 2025, 465 corporate practitioners, mostly US, 22nd edition). 76% experienced attempted or actual payments fraud; paper checks the most targeted method (58%), followed by ACH debits (30%) and wire transfers (25%); 74% affected by BEC; 17% use AI against payments fraud. US-centric: checks barely exist in Swiss corporate payments."
- id: swift-eoc-2025
  title: "ISO 20022: Implementation FAQs / ISO 20022 end of coexistence guide"
  publisher: Swift
  year: 2025
  url: https://www.swift.com/standards/iso-20022/iso-20022-faqs/implementation
  type: standard
  note: "Coexistence of MT and ISO 20022 for cross-border bank-to-bank payment instructions (CBPR+) ended 22 Nov 2025; MT 103/202 etc. still sent by lagging banks are converted under chargeable contingency processing. Applies to the interbank leg — corporate-to-bank formats (pain.001, MT101, MT940) are governed by bank/market timelines."
- id: epc-vop-bulk-faq
  title: Clarifications about the provision of VOP-services for bulk files
  publisher: European Payments Council
  year: 2025
  url: https://www.europeanpaymentscouncil.eu/faq/verification-payee-scheme/rulebook/clarifications-about-provision-vop-services-bulk-files
  type: standard
  note: "Under the Instant Payments Regulation PSPs must offer VoP for bulk files, but non-consumer payers may opt out for multiple payment orders submitted as a package and opt back in at any time. EU PSPs from 9 Oct 2025; non-euro EU states by 9 Jul 2027."
- id: epc-vop-golive
  title: "Verification of Payee: Insights from Go-Live"
  publisher: European Payments Council
  year: 2026
  url: https://www.europeanpaymentscouncil.eu/news-insights/insight/verification-payee-insights-go-live
  type: official
  note: "Post-go-live review: corporate clients raised many queries — 'No Match' results for trade names, opt-out procedures for bulk files, integrating Close Match / No Match / 'verification not possible' results into payment processes; banks took varying approaches."
- id: six-address-factsheet
  title: Adjustment of addresses in payment orders and migration to new message versions (factsheet for SMEs)
  publisher: SIX
  year: 2025
