- id: encompass-kyc-2024
  title: A corporate treasurer's perspective on KYC complexities
  publisher: Encompass Corporation (KYC software vendor)
  year: 2024
  url: https://www.encompasscorporation.com/blog/a-corporate-treasurers-perspective-on-kyc-complexities/
  type: survey
  note: "Vendor survey of 250 corporate treasurers split evenly UK/US: average 41 days to open a new bank account; 93% asked for the same information more than once; 87% had abandoned a banking application at least once. Vendor-sponsored, UK/US only — indicative, not a Swiss benchmark."
- id: crowe-swiss-account
  title: Opening a Swiss Business Bank Account
  publisher: Crowe Switzerland
  year: 2025
  url: https://www.crowe.com/ch/zh/en-gb/insights/opening-a-swiss-business-bank-account
