  note: "Adviser checklist of documents Swiss banks request from companies: commercial-register extract, articles, organisation chart, ID and residence proof of shareholders and beneficial owners, financial statements or business plan, major contracts, overview of expected payment flows. Banks must identify controlling persons (25% threshold, AMLA art. 4) — Form K under the Swiss banks' due-diligence agreement (CDB 20)."
