- id: six-ebics
  title: EBICS — Payment Standards for Switzerland (with Swiss bank migration notices)
  publisher: SIX; UBS; Raiffeisen
  year: 2026
  url: https://www.six-group.com/en/products-services/banking-services/payment-standardization/standards/ebics.html
